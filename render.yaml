services:
  - type: web
    name: call-tracker
    runtime: python
    plan: starter           # $7/mo, stays warm. Use "free" for testing (sleeps after 15 min idle).
    buildCommand: pip install -r requirements.txt
    healthCheckPath: /health
    # Single worker = single in-memory cache + one background refresh thread.
    # --threads 8: request-serving thread pool. Bumped from 4 because a few slow
    #   handlers (custom date-range, AI summaries) plus the refresh could occupy
    #   every thread and starve Render's /health probe (5s cap) → "Instance failed"
    #   → worker restart. 8 leaves ample headroom so /health always has a free slot.
    # -t 90: kill a worker stuck >90s on a single request.
    # --graceful-timeout 20: give in-flight requests 20s to finish before hard kill on deploy.
    # --keep-alive 75: match Render's 75s idle connection timeout.
    startCommand: gunicorn -w 1 -k gthread --threads 8 -t 90 --graceful-timeout 20 --keep-alive 75 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_BASE_URL
        value: https://www.zohoapis.com
      - key: ZOHO_ACCOUNTS_URL
        value: https://accounts.zoho.com
      - key: TZ_OFFSET_HOURS
        value: "-6"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://call-tracker-3z6t.onrender.com/auth/callback
      # Shared machine-to-machine secret for the back-office bot's overdue-calls
      # poller (GET /api/overdue-calls). _valid_api_key() FAILS CLOSED when this
      # is unset — every bot request 401s and no overdue scheduled call is ever
      # distributed to the sales chat. Must be the SAME value as OVERDUE_API_KEY
      # on the backoffice-app service.
      - key: OVERDUE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
