services:
  - type: web
    name: call-tracker
    runtime: python
    plan: starter           # $7/mo, stays warm. Use "free" for testing (sleeps after 15 min idle).
    buildCommand: pip install -r requirements.txt
    healthCheckPath: /health
    # Single worker = single in-memory cache + one background refresh thread.
    # --threads 8: request-serving thread pool. Bumped from 4 because a few slow
    #   handlers (custom date-range, AI summaries) plus the refresh could occupy
    #   every thread and starve Render's /health probe (5s cap) → "Instance failed"
    #   → worker restart. 8 leaves ample headroom so /health always has a free slot.
    # -t 90: kill a worker stuck >90s on a single request.
    # --graceful-timeout 20: give in-flight requests 20s to finish before hard kill on deploy.
    # --keep-alive 75: match Render's 75s idle connection timeout.
    startCommand: gunicorn -w 1 -k gthread --threads 8 -t 90 --graceful-timeout 20 --keep-alive 75 -b 0.0.0.0:$PORT app:app
    # Persistent disk. app.py writes resolved_calls.json (resolved / distributed / notes /
    # assigned_to) and ai_handled.json to /data. Without this mount /data does not exist, the
    # code silently falls back to the container filesystem, and EVERY flag is wiped on each
    # deploy or restart — which re-distributes every still-overdue call to Telegram and loses
    # every note. Requires a paid plan and pins the service to one instance (we already run -w 1).
    disk:
      name: call-tracker-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_BASE_URL
        value: https://www.zohoapis.com
      - key: ZOHO_ACCOUNTS_URL
        value: https://accounts.zoho.com
      - key: TZ_OFFSET_HOURS
        value: "-6"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://call-tracker-3z6t.onrender.com/auth/callback
      # Shared machine-to-machine secret for the back-office bot's overdue-calls
      # poller (GET /api/overdue-calls). _valid_api_key() FAILS CLOSED when this
      # is unset — every bot request 401s and no overdue scheduled call is ever
      # distributed to the sales chat. Must be the SAME value as OVERDUE_API_KEY
      # on the backoffice-app service.
      - key: OVERDUE_API_KEY
        sync: false
      # Base URL of the back-office app, e.g. https://backoffice-app-nqat.onrender.com
      # Used by /api/bot-distributions to ask it what the bot handed out today. Without it
      # the "Distributed by Bot" card renders an explanation instead of data.
      - key: BACKOFFICE_URL
        sync: false
      # ── RingCentral (RingEX) — required by the /v6 billing KPI board ──
      # Without all three of these /api/v6/report returns 503 and says so; it does
      # NOT render an empty board, because an empty board and a quiet phone look
      # identical. These live in ringcentral-sync/.env locally and have never been
      # set on this service, so they must be added in Render's dashboard before
      # /v6 shows anything.
      - key: RC_CLIENT_ID
        sync: false
      - key: RC_CLIENT_SECRET
        sync: false
      - key: RC_JWT_TOKEN
        sync: false
      - key: RC_SERVER_URL
        value: https://platform.ringcentral.com
      # Read-only share link for /v6/board. Unset = /v6/board 404s for everyone
      # (fail closed); /v6 itself still works behind the normal login. Must NOT be
      # the same value as SCOREBOARD_TOKEN — that one opens the sales board.
      - key: BILLING_TOKEN
        sync: false
      # How many days back the billing board's snapshot warmer backfills, and how
      # long it waits between fetches. RingEX allows 10 heavy requests per 60s for
      # the WHOLE account and this app's own dashboard refresh already spends from
      # that bucket, so 15s (4/min) leaves room. Lower the pause at your peril.
      - key: V6_WARM_DAYS
        value: "35"
      - key: V6_WARM_PAUSE
        value: "15"
      - key: PYTHON_VERSION
        value: "3.11.9"
