<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Day</title>
<style>
  /* The approved mock-up's tokens (copied from _board_style.html): white and
     ink, hairlines, --up for things you tap, --dn only for "behind". */
  :root{
    --bg:#FFFFFF; --tint:#F6F8F8; --rule:#E3E9E8; --hair:#EFF3F2;
    --ink:#131C1B; --ink-2:#4A5957; --muted:#7C8B89;
    --up:#0B6E67; --dn:#B03A31; --mid:#9C6712;
    --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --pad-x:clamp(14px, 3.4vw, 26px); --pad-y:clamp(14px, 2.4vw, 26px);
    --pn-fg:#1d4ed8; --pn-bg:#dbeafe; --pn-bd:#93c5fd;
    --pq-fg:#854d0e; --pq-bg:#fef9c3; --pq-bd:#fde047;
    --pc-fg:#166534; --pc-bg:#dcfce7; --pc-bd:#86efac;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#101614; --tint:#161E1C; --rule:#26302E; --hair:#1C2523;
    --ink:#EDF2F1; --ink-2:#BCC9C7; --muted:#849492;
    --up:#4FCCBF; --dn:#EE8177; --mid:#E0A542;
    --pn-fg:#9CC1FF; --pn-bg:rgba(59,130,246,.14); --pn-bd:rgba(147,197,253,.32);
    --pq-fg:#F3D57A; --pq-bg:rgba(234,179,8,.13); --pq-bd:rgba(253,224,71,.30);
    --pc-fg:#86E0A6; --pc-bg:rgba(34,197,94,.13); --pc-bd:rgba(134,239,172,.30);
  }}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .app{max-width:1100px;margin:0 auto;padding:var(--pad-y) var(--pad-x) 72px}
  a{color:inherit}

  .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
  .top h1{margin:0;font-size:20px;letter-spacing:-.02em;font-weight:700}
  .top .who{font-size:12.5px;color:var(--muted)}
  .top .who b{color:var(--ink);font-weight:600}
  .top .sw{margin-left:auto;font:inherit;font-size:12.5px;font-weight:600;padding:4px 10px;border:1px solid var(--rule);
           border-radius:6px;background:var(--bg);color:var(--ink);max-width:220px}
  .banner{margin:10px 0 0;padding:7px 11px;border:1px dashed var(--rule);border-radius:7px;font-size:12.5px;color:var(--ink-2)}
  .banner.err{border-style:solid;border-color:var(--dn);color:var(--dn)}
  .nums{display:flex;flex-wrap:wrap;gap:8px 28px;margin:12px 0 12px;padding:10px 0;
        border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .nums div{font-size:12px;color:var(--muted);line-height:1.3}
  .nums b{display:block;font-size:22px;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .nums b small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
  .nums b.dn{color:var(--dn)}
  .alert{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px;padding:8px 11px;
         border:1px solid var(--dn);border-radius:7px;font-size:13px}
  .alert .dot{width:8px;height:8px;border-radius:50%;background:var(--dn);flex:none}
  .alert .what{font-weight:600}
  .alert .hint{color:var(--muted)}
  .alert .btn{margin-left:auto}

  .sec{margin:20px 0 0;scroll-margin-top:10px}
  .sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 0 6px;border-bottom:1px solid var(--rule)}
  .sh h2{margin:0;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
  .sh h2.dn{color:var(--dn)}
  .sh .c{font-size:12px;font-weight:700;color:var(--muted)}
  .sh .h{font-size:12px;color:var(--muted)}
  .empty{font-size:12.5px;color:var(--muted);padding:9px 0}
  /* Groups: the day in four parts, each list folds to its header. */
  .grp{margin:30px 0 0}
  .gh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .gh h3{margin:0;font-size:17px;font-weight:750;letter-spacing:-.01em}
  .gh .gs{font-size:12.5px;color:var(--muted);flex-basis:100%}
  .sh{cursor:pointer;user-select:none;-webkit-user-select:none;align-items:center}
  .when small.up{color:var(--up);font-weight:650}
  .sh h2{order:0} .sh .c{order:1} .sh .h{order:2} .sh .info{order:3} .sh .chev{order:4}
  .sh .chev{margin-left:auto;font-size:11px;color:var(--muted);transition:transform .15s}
  .sec.closed .chev{transform:rotate(-90deg)}
  .sec.closed > :not(.sh):not(.tip){display:none}
  .sec.closed .sh{border-bottom-color:var(--hair)}
  .info{font:inherit;font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;padding:0;flex:none;
        border:1px solid var(--rule);background:var(--bg);color:var(--muted);cursor:pointer;line-height:18px;text-align:center;
        align-self:center}
  .info:hover,.tipon > .sh .info,.tipon > .gh .info{border-color:var(--up);color:var(--up)}
  .tip{display:none;margin:8px 0 4px;padding:9px 12px;border-radius:8px;background:var(--tint);font-size:12.5px;
       color:var(--ink-2);line-height:1.5;max-width:640px}
  .tipon > .tip{display:block}
  .tools{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
  .plan{margin:12px 0 0;padding:10px 0 12px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .ptiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:6px}
  .pt2{padding:8px 10px;border-radius:9px;border:1px solid var(--rule);font-size:12px;color:var(--muted);line-height:1.3}
  .pt2 b{display:block;font-size:20px;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pt2 b small{font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}
  .pt2 span{display:block}
  .pt2 em{display:block;font-style:normal;font-size:10.5px;margin-top:2px}
  .pt2.ok{border-color:color-mix(in srgb,var(--up) 45%,var(--rule))} .pt2.ok b{color:var(--up)}
  .pt2.bad{border-color:color-mix(in srgb,var(--dn) 55%,var(--rule))} .pt2.bad b{color:var(--dn)}
  .psub{margin:8px 0 0;font-size:12px;color:var(--muted)}
  @media(max-width:860px){.ptiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:520px){.ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}.pt2 b{font-size:18px}}
  .prio{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;font-weight:750;
        display:inline-flex;align-items:center;justify-content:center;align-self:center;order:-1}
  .prio.clock{background:transparent;color:var(--ink);border:1px solid var(--rule);font-size:12px}
  .guide{margin:14px 0 0}
  .guide .gbody{display:none;margin:8px 0 0;padding:12px 14px;border-radius:9px;background:var(--tint);font-size:13px;line-height:1.5;max-width:680px}
  .guide.on .gbody{display:block}
  .guide ol{margin:6px 0 8px;padding-left:20px} .guide li{margin:3px 0} .guide p{margin:6px 0}
  /* Alert bar: same tone and mute as the billing board (scoreboard_v6). */
  #alertbar{position:sticky;top:0;z-index:9}
  .abar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0;padding:9px 12px;border-radius:9px;
        border:1px solid var(--dn);background:var(--bg);font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .abar.quiet{border-color:var(--rule)}
  .abar .dot{width:9px;height:9px;border-radius:50%;background:var(--dn);flex:none;animation:pulse 1.6s infinite}
  .abar.quiet .dot{background:var(--muted);animation:none}
  .abar .what{font-weight:650}
  .abar .hint,.abar .mutedtxt{color:var(--muted);font-size:12px}
  .abar [data-amute],.abar [data-aunmute]{margin-left:auto}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .abar .what{display:flex;flex-wrap:wrap;gap:6px}
  .achip{font:inherit;font-size:12.5px;font-weight:650;padding:4px 10px;border-radius:999px;cursor:pointer;
         border:1px solid var(--dn);background:transparent;color:var(--dn)}
  .abar.quiet .achip{border-color:var(--rule);color:var(--muted)}
  .achip:hover{background:var(--tint)}
  .achip.next{border-color:var(--rule);color:var(--ink);font-weight:500}
  /* the row an alert opened */
  .r.flash{animation:flash 2.4s ease-out}
  @keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--dn);background:color-mix(in srgb,var(--dn) 12%,var(--bg))}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.r.flash{animation:none;box-shadow:0 0 0 3px var(--dn)}}
  @media (prefers-reduced-motion:reduce){.abar .dot{animation:none}}
  .handle{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin:10px 0 0;font-size:12.5px;color:var(--muted)}
  .handle b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .handle .lbl2{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
  .tools .btn{font-size:12px;padding:4px 10px;min-height:0}

  .hd,.r{display:grid;grid-template-columns:118px minmax(0,1.3fr) 178px minmax(0,1fr) 300px;
         gap:0 14px;align-items:center}
  .hd{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 0 4px}
  .r{padding:9px 0;border-bottom:1px solid var(--hair);cursor:pointer}
  .r:hover{background:var(--tint)}
  .r.open{background:var(--tint);border-bottom:0}
  .r.done{opacity:.55}
  .when{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;min-width:0}
  .when small{display:block;font-size:11.5px;font-weight:650;color:var(--dn)}
  .when small.q{color:var(--muted);font-weight:500}
  .pt{min-width:0}
  .pt b{font-size:14.5px;font-weight:650;letter-spacing:-.01em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pt .meta{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .why{min-width:0}
  .last{font-size:12.5px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .last i{font-style:normal;color:var(--muted)}
  .acts{display:flex;gap:6px;justify-content:flex-end}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
  .p-new{color:var(--pn-fg);background:var(--pn-bg);border-color:var(--pn-bd)}
  .p-quote,.p-balance{color:var(--pq-fg);background:var(--pq-bg);border-color:var(--pq-bd)}
  .p-cb{color:var(--pc-fg);background:var(--pc-bg);border-color:var(--pc-bd)}
  .p-retry,.p-missed{color:var(--muted);background:transparent;border-color:var(--muted);border-style:dashed}
  .p-booked,.p-preop,.p-postop{color:var(--ink-2);background:var(--tint);border-color:var(--rule)}
  .p-nostep{color:var(--dn);background:transparent;border-color:var(--dn)}
  .p-quotewait,.p-invoice{color:var(--pq-fg);background:var(--pq-bg);border-color:var(--pq-bd)}
  .p-texted{color:var(--pc-fg);background:var(--pc-bg);border-color:var(--pc-bd)}
  /* a RingCX dialer call: small, quiet, beside the name */
  .tag{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
       padding:0 5px;border-radius:4px;border:1px solid var(--rule);color:var(--muted);vertical-align:2px}
  .btn{font:inherit;font-size:13px;font-weight:650;padding:6px 13px;border-radius:7px;min-height:32px;
       border:1px solid var(--rule);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap;
       text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .btn.go{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .btn:hover{border-color:var(--up)}
  .btn[disabled]{opacity:.45;cursor:default}
  .now{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--up);
       letter-spacing:.05em;text-transform:uppercase;margin:2px 0}
  .now::after{content:"";flex:1;height:2px;background:var(--up);opacity:.6}
  .more{font-size:12.5px;color:var(--muted);padding:8px 0}
  .more b{color:var(--ink)}
  .donesum{display:flex;flex-wrap:wrap;gap:4px 16px;padding:9px 0;font-size:12.5px;color:var(--ink-2)}
  .donesum b{color:var(--ink)}
  .donesum .dn b{color:var(--dn)}
  .sub2{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}

  /* the opened row */
  .det{background:var(--tint);padding:4px 14px 16px;border-bottom:1px solid var(--hair);
       display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px 26px}
  .dg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 14px}
  .dg div{display:flex;flex-direction:column;min-width:0}
  .dg em{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .dg b{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis}
  .full{font-size:16px;font-weight:700;margin:6px 0 8px}
  .lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
  .hist div{display:grid;grid-template-columns:62px 92px minmax(0,1fr);gap:0 10px;font-size:12.5px;
            padding:4px 0;border-top:1px solid var(--rule)}
  .hist .d{color:var(--muted);font-variant-numeric:tabular-nums}
  .hist .k{font-weight:600}
  .hist .x{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
  .note{margin:0;padding:8px 11px;border-left:3px solid var(--up);background:var(--bg);font-size:13px;color:var(--ink-2);
        border-radius:0 6px 6px 0;white-space:pre-wrap;word-break:break-word}
  .note small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .callbar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
  .q{font-size:13.5px;font-weight:700;margin:4px 0 2px}
  .q span{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
  .glabel{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px}
  .obs{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
  .ob{font:inherit;text-align:left;padding:8px 11px;min-height:44px;border-radius:8px;
      border:1px solid var(--rule);background:var(--bg);color:var(--ink);cursor:pointer}
  .ob b{display:block;font-size:13.5px;font-weight:650}
  .ob small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
  .ob.stop{border-style:dashed}
  .ob:hover{border-color:var(--up)}
  .ob.on{border-color:var(--up);box-shadow:inset 0 0 0 1px var(--up);background:color-mix(in srgb,var(--up) 10%,var(--bg))}
  /* The saved result stays filled, so the rep sees what was recorded, not only a toast. */
  .ob.saved,.ob.saved:hover{background:var(--up);border-color:var(--up);color:var(--bg)}
  .ob.saved small{color:var(--bg);opacity:.85}
  .ob.saved b::before{content:"\2713  "}
  .ob.saving{opacity:.7;cursor:progress}
  .savedline{margin:8px 0 0;font-size:13px;font-weight:650;color:var(--up)}
  .pill.saved{background:var(--up);color:var(--bg);border-color:var(--up)}
  .ob[disabled]{opacity:.5;cursor:default}
  .why-no{font-size:12px;color:var(--muted);margin:8px 0 0}

  /* the follow-up step: time, reason, confirm */
  .flow{margin:10px 0 0;padding:10px 12px;border:1px solid var(--up);border-radius:8px;background:var(--bg)}
  .flow h4{margin:0 0 6px;font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font:inherit;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--rule);
        background:var(--bg);color:var(--ink);cursor:pointer;min-height:32px}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .dayl{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
  .flow input[type=datetime-local]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;
        background:var(--bg);color:var(--ink);margin-top:8px;max-width:100%}
  .prev{margin:10px 0 0;padding:8px 10px;background:var(--tint);border-radius:7px;font-size:12.5px;color:var(--ink-2)}
  .tog{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;font-weight:600}
  .tog input{width:18px;height:18px}
  .frow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:12px;
         max-width:calc(100% - 32px);padding:10px 14px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:13px;
         box-shadow:0 6px 24px rgba(0,0,0,.18)}
  .toast.on{display:flex}
  .toast button{font:inherit;font-weight:700;background:transparent;color:var(--bg);border:1px solid currentColor;
                border-radius:6px;padding:3px 9px;cursor:pointer}
  .pick{margin:18px 0 0;max-width:520px}
  .pick a{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--hair);text-decoration:none}
  .pick a span{color:var(--muted);font-size:12px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:28px}
  .tabbar{display:none}

  @media(max-width:860px){
    .hd{display:none}
    .r{grid-template-columns:96px minmax(0,1fr) auto;grid-template-areas:"w p a" "w y a" "w l a";gap:2px 12px;align-items:start}
    .r .when{grid-area:w} .r .pt{grid-area:p} .r .why{grid-area:y} .r .last{grid-area:l} .r .acts{grid-area:a;align-self:center}
    .det{grid-template-columns:minmax(0,1fr)}
  }
  /* Phone width: rows become cards, buttons two per line, numbers 2 by 2,
     and a tab bar keeps the list short (Frame 3 of the mock). */
  @media(max-width:520px){
    .app{padding-bottom:92px}
    .top h1{font-size:19px}
    .top .sw{margin-left:0}
    .nums{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:10px 0}
    .nums b{font-size:20px}
    .nums .nl{display:none}          /* the tab bar carries it on a phone */
    .alert{font-size:12.5px;padding:7px 10px}
    .sh .h{order:5;flex-basis:100%}
    /* Phone: the pinned alert bar is one row that scrolls sideways, so it never
       takes more than ~60px of the screen; every control is a thumb-size target. */
    .abar{flex-wrap:nowrap;gap:8px;padding:7px 8px;margin-top:8px}
    .abar .what{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-width:0;flex:1}
    .abar .what::-webkit-scrollbar{display:none}
    .abar .achip{white-space:nowrap;min-height:38px;padding:6px 12px}
    .abar .achip.next{display:none}
    .abar .hint{display:none}
    .abar [data-amute],.abar [data-aunmute]{min-height:38px;padding:6px 10px;flex:none}
    .abar .mutedtxt{display:none}
    .tools .btn{min-height:40px;padding:8px 14px;font-size:13px}
    .info{width:28px;height:28px;line-height:26px;font-size:12px}
    .sh{min-height:44px}
    .gbody{font-size:14px}
    .handle{gap:4px 14px}
    .alert .hint{display:none}
    .alert .btn{margin-left:0}
    .r{grid-template-columns:minmax(0,1fr);grid-template-areas:"p" "w" "y" "l" "a";gap:3px 0;
       border:1px solid var(--rule);border-radius:11px;padding:10px 12px;margin:8px 0 0}
    .r.open{border-radius:11px 11px 0 0;border-bottom:0}
    .r .when{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
    .r .when small{display:inline}
    .r .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
    .r .acts .btn{min-height:42px;font-size:14px}
    .r .acts .btn.cs{grid-column:1 / -1}
    .det{border:1px solid var(--rule);border-top:0;border-radius:0 0 11px 11px;padding:4px 12px 14px}
    .dg{grid-template-columns:1fr 1fr}
    .obs{grid-template-columns:1fr 1fr}
    .ob{min-height:46px}
    .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:10;
            border-top:1px solid var(--rule);background:var(--bg);font-size:12px;text-align:center;
            padding-bottom:env(safe-area-inset-bottom)}
    .tabbar a{padding:10px 0 12px;color:var(--muted);text-decoration:none}
    .tabbar a.on{color:var(--ink);font-weight:700}
    .toast{bottom:64px}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <h1>My Day</h1>
    <span class="who" id="who"></span>
    <select class="sw" id="sw" aria-label="Open someone else's day" hidden></select>
    <a class="sw" id="floorlink" href="/my-day/floor" hidden title="Every rep against the plan, side by side">Floor</a>
  </div>
  <div id="banners"></div>
  <div id="alertbar"></div>
  <div id="handle" class="handle"></div>
  <div id="body"><p class="empty">Loading your day…</p></div>
  <p class="foot" id="foot"></p>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections">
  <a href="#s-day" class="on">My Day</a><a href="#s-new">New leads <span id="tb-new"></span></a><a href="#s-done">Done <span id="tb-done"></span></a>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-undo" hidden>Undo</button></div>

<script>
(function(){
  var BOOT = {{ boot|tojson }};
  var REP = BOOT.rep || {};
  var CAN_WRITE = !!(BOOT.viewer && BOOT.viewer.can_write);
  var PAGE = null, OPEN_KEY = null, ROWS = {}, FLOW = null;
  // Results saved in this visit, by row key: {outcome, label, next}. Kept across
  // reloads so a row still on the page shows what was recorded.
  var SAVED = {};
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function tel(d){ return d ? 'tel:+1' + d : ''; }

  // ── the name switch ──
  var sw = $('sw');
  if ((BOOT.floor || []).length && (BOOT.viewer.manager || BOOT.viewer.word_only)) {
    sw.hidden = false; $('floorlink').hidden = false;
    var html = BOOT.need_pick ? '<option value="">Pick a name ▾</option>' : '';
    var lastRole = '';
    BOOT.floor.forEach(function(u){
      if (u.role !== lastRole) { if (lastRole) html += '</optgroup>'; html += '<optgroup label="' + (u.role === 'sales' ? 'Sales' : 'Coordinators') + '">'; lastRole = u.role; }
      html += '<option value="' + esc(u.id) + '"' + (u.id === REP.id ? ' selected' : '') + '>' + esc(u.name) + '</option>';
    });
    sw.innerHTML = html + (lastRole ? '</optgroup>' : '');
    sw.onchange = function(){ if (sw.value) location.href = '/my-day/' + encodeURIComponent(sw.value); };
  }

  if (BOOT.need_pick) {
    var b = $('body');
    if (BOOT.viewer.manager || BOOT.viewer.word_only) {
      b.innerHTML = '<div class="pick"><p class="empty">Whose day? Pick a name.</p>' + (BOOT.floor || []).map(function(u){
        return '<a href="/my-day/' + encodeURIComponent(u.id) + '"><b>' + esc(u.name) + '</b><span>' + (u.role === 'sales' ? 'Sales' : 'Coordinator') + '</span></a>';
      }).join('') + '</div>';
    } else {
      b.innerHTML = '<p class="banner err">Your Google account does not match a Zoho user, so the page cannot tell whose calls to show. Ask Danny to check your email in Zoho.</p>';
    }
    $('tabbar').style.display = 'none';
    return;
  }

  // ── toast ──
  var toastT = null;
  function toast(msg, undoToken){
    $('toast-msg').textContent = msg;
    var u = $('toast-undo');
    u.hidden = !undoToken;
    u.onclick = undoToken ? function(){ undo(undoToken); } : null;
    $('toast').classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function(){ $('toast').classList.remove('on'); }, undoToken ? 5 * 60 * 1000 : 6000);
  }

  // ── load and render ──
  function load(fresh){
    fetch('/my-day/api/data?rep=' + encodeURIComponent(REP.id || '') + (fresh ? '&fresh=1' : ''), {credentials:'same-origin'})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(x){
        if (!x.ok) { $('body').innerHTML = '<p class="banner err">' + esc(x.j.detail || x.j.error || 'The page could not be built.') + '</p>'; return; }
        PAGE = x.j;
        // #open=<row key> opens that row (a link straight to one patient).
        var m = /[#&]open=([^&]+)/.exec(location.hash || '');
        if (m && !OPEN_KEY && PAGE) { OPEN_KEY = decodeURIComponent(m[1]); history.replaceState(null, '', location.pathname + location.search); }
        render();
        if (m) scrollToOpen();
      })
      .catch(function(){ $('body').innerHTML = '<p class="banner err">The page could not be loaded. Check the connection and refresh.</p>'; });
  }

  function whenCell(r){
    var cls = r.sub_kind === 'late' ? '' : (r.sub_kind === 'up' ? ' class="up"' : ' class="q"');
    return '<div class="when">' + esc(r.when) + (r.sub ? '<small' + cls + '>' + esc(r.sub) + '</small>' : '') + '</div>';
  }
  function rowHtml(r, sec){
    ROWS[r.key] = r;
    var last = r.last && r.last.date ? esc(r.last.date) + ' <i>· ' + esc(r.last.what) + '</i>' : '<i>' + esc(r.last ? r.last.what : '') + '</i>';
    var call = r.phone ? '<a class="btn go" href="' + tel(r.phone) + '" data-call="' + esc(r.key) + '"' + (r.claim ? ' data-claim="1"' : '') + ' title="Calls her from your phone">Call</a>'
                       : '<button class="btn go" disabled title="No number on the deal">Call</button>';
    return '<div class="r' + (OPEN_KEY === r.key ? ' open' : '') + (SAVED[r.key] ? ' done' : '') + '" data-key="' + esc(r.key) + '" data-sec="' + sec + '">' +
      whenCell(r) +
      '<div class="pt"><b>' + esc(r.short) + (r.dialer ? '<span class="tag" title="A RingCX dialer call">dialer</span>' : '') + '</b><span class="meta">' + esc(r.meta) + '</span></div>' +
      '<div class="why">' + (SAVED[r.key] ? '<span class="pill saved">\u2713 ' + esc(SAVED[r.key].label) + '</span>'
                                          : '<span class="pill p-' + esc(r.why) + '" title="' + esc(WHY_TIPS[r.why] || '') + '">' + esc(r.why_label) + '</span>') + '</div>' +
      '<div class="last">' + last + '</div>' +
      '<div class="acts">' + call + '<button class="btn" data-result="' + esc(r.key) + '" title="Tap what happened on this call. We update Zoho and book the next step.">Result</button>' + consultBtn(r) + '</div>' +
      '</div>' + (OPEN_KEY === r.key ? detHtml(r) : '');
  }
  // The estimator for this deal, exactly the Zoho "Start Consultation" button.
  function consultBtn(r){
    return r.consult ? '<a class="btn cs" href="' + esc(r.consult) + '" target="_blank" rel="noopener" title="Opens the estimator for this deal, the same as the Start Consultation button in Zoho.">Start consultation</a>' : '';
  }
  var HD = '<div class="hd"><span>When</span><span>Patient</span><span>Why</span><span>Last contact</span><span></span></div>';

  function detHtml(r){
    var facts = (r.facts || []).map(function(f){ return '<div><em>' + esc(f.k) + '</em><b>' + esc(f.v) + '</b></div>'; }).join('');
    var note = r.note ? '<p class="lbl">Last call note</p><p class="note">' + esc(r.note.text) + '<small>' + esc([r.note.by, r.note.date].filter(Boolean).join(', ')) + '</small></p>' : '';
    // Calls still ahead go under "Coming up", soonest first; the rest under "Before this".
    function histRows(list){ return list.map(function(h){
      return '<div><span class="d">' + esc(h.d) + '</span><span class="k">' + esc(h.k) + '</span><span class="x">' + esc(h.x) + (h.by ? ' · ' + esc(h.by) : '') + '</span></div>';
    }).join(''); }
    var ahead = (r.history || []).filter(function(h){ return h.up; }).reverse();
    var past = (r.history || []).filter(function(h){ return !h.up; });
    var hist = (ahead.length ? '<p class="lbl">Coming up</p><div class="hist">' + histRows(ahead) + '</div>' : '') +
               (past.length ? '<p class="lbl">Before this</p><div class="hist">' + histRows(past) + '</div>' : '');
    var callbar = '<div class="callbar">' + (r.phone ? '<a class="btn go" href="' + tel(r.phone) + '" data-call="' + esc(r.key) + '"' + (r.claim ? ' data-claim="1"' : '') + '>Call ' + esc(r.phone_label) + '</a>' : '') +
      consultBtn(r) + (r.zoho ? '<a class="btn" href="' + esc(r.zoho) + '" target="_blank" rel="noopener">Open in Zoho</a>' : '') + '<button class="btn" data-close="1">Close</button></div>';
    var live = PAGE.outcomes_live && CAN_WRITE && !!r.deal_id;
    var groups = [['talked', 'Talked to ' + (r.first || 'them')], ['stop', 'Stop calling'], ['missed', 'Did not reach ' + (r.first || 'them')]];
    var obs = groups.map(function(g){
      var list = PAGE.outcomes.filter(function(o){ return o.group === g[0]; });
      if (!list.length) return '';
      return '<p class="glabel">' + esc(g[1]) + '</p><div class="obs">' + list.map(function(o){
        var sv = SAVED[r.key] && SAVED[r.key].outcome === o.key;
        return '<button class="ob' + (g[0] === 'stop' ? ' stop' : '') + (sv ? ' saved' : (FLOW && FLOW.key === r.key && FLOW.outcome === o.key ? ' on' : '')) + '" data-ob="' + esc(o.key) + '"' + (live ? '' : ' disabled') + '><b>' + esc(o.label) + '</b><small>' + esc(o.hint) + '</small></button>';
      }).join('') + '</div>';
    }).join('');
    var why = '';
    if (!PAGE.outcomes_live) why = 'Coordinator buttons are coming soon. Write the result in Zoho for now.';
    else if (!CAN_WRITE) why = 'Sign in with Google to write results. The floor password can only read.';
    else if (!r.deal_id) why = 'This call is not on a deal, so it has no result buttons. Write it in Zoho.';
    return '<div class="det" data-det="' + esc(r.key) + '"><div><div class="full">' + esc(r.full) + '</div><div class="dg">' + facts + '</div>' + note + hist + '</div>' +
      '<div>' + callbar + '<p class="q" title="Pick the one thing that happened. We write the result in Zoho, book or cancel the next call, and send the patient the right text.">What happened?<span>One tap. We do the rest.</span></p>' + obs +
      (why ? '<p class="why-no">' + esc(why) + '</p>' : '') +
      (SAVED[r.key] ? '<p class="savedline">\u2713 Saved: ' + esc(SAVED[r.key].label) + (SAVED[r.key].next ? '. ' + esc(SAVED[r.key].next) : '') + '</p>' : '') +
      '<div id="flow"></div></div></div>';
  }

  // ── folding and the (i) explanations ──
  // A list folds to its header; the choice is remembered on this phone. Until a
  // rep chooses, an empty list and the pipeline lists start folded, so the day
  // reads as a whole and the calls to make now are what is open.
  // Every list starts folded except Right Now, and only one list is open at a
  // time: opening one folds the rest (Danny, 10-21). Kept for this visit only.
  var FOLD = {}, OPEN_SEC = 's-up';
  var START_FOLDED = {};
  var TIPS_ON = {};
  function folded(id, count){ return id !== OPEN_SEC; }
  function saveFold(){}
  function infoBtn(tip){ return tip ? '<button class="info" data-info="1" aria-label="What is this?" title="What is this?">i</button>' : ''; }
  function secWrap(id, title, cls, count, hint, tip, body){
    return '<div class="sec' + (folded(id, count) ? ' closed' : '') + (TIPS_ON[id] ? ' tipon' : '') + '" id="' + id + '">' +
      '<div class="sh" data-fold="' + id + '" role="button" aria-expanded="' + !folded(id, count) + '">' + prioBadge(id) + '<h2' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(title) + '</h2><span class="c">' + count + '</span><span class="h">' + esc(hint) + '</span>' +
      infoBtn(tip) + '<span class="chev" aria-hidden="true">&#9660;</span></div>' +
      (tip ? '<p class="tip">' + esc(tip) + '</p>' : '') + body + '</div>';
  }
  // ── The plan's order, on the page (Patient Flow Plan, "My Day: How a Rep
  // Works the Day"). Each list carries its number; the guide spells it out. Up
  // Next applies the same order to the next three patients.
  var PRIO = {'s-late': [1, 'A late call: the patient was promised this time.'],
              's-new': [2, 'A new lead: call within 5 minutes.'], 's-queue': [2, 'An unclaimed new lead: call within 5 minutes; tap Call to take it.'],
              's-texts': [3, 'A patient who texted you is waiting on an answer.'],
              's-tasks': [4, 'A follow-up due today: fit it in between booked calls.'],
              's-invoices': [5, 'Retainer invoice unpaid: about 1 in 2 of these pay.'],
              's-quotes': [6, 'Quote sent: about 1 in 8 pay. Newest first.'],
              's-nostep': [7, 'No call booked: call and book the next step.']};
  function prioBadge(id){
    if (id === 's-today') return '<span class="prio clock" title="Booked calls: make each one at its time. It moves to the top of Up Next 5 minutes before.">&#9719;</span>';
    var x = PRIO[id];
    return x ? '<span class="prio" title="Priority ' + x[0] + ' of 7. ' + esc(x[1]) + '">' + x[0] + '</span>' : '';
  }
  var GUIDE_OPEN = false;
  function guideHtml(){
    return '<div class="guide' + (GUIDE_OPEN ? ' on' : '') + '"><div class="tools"><button class="btn gbtn" data-guide="1" aria-expanded="' + GUIDE_OPEN + '">How to work your day</button><button class="btn" data-foldall="1">Fold all</button></div>' +
      '<div class="gbody"><p>Work from <b>Up Next</b>: it always shows the next three patients in this order. The numbers on each list below are the same order.</p><ol>' +
      '<li><b>Late calls.</b> A time we promised comes first. A call due in the next 5 minutes joins them.</li>' +
      '<li><b>New leads.</b> Call within 5 minutes. Unclaimed ones become yours when you tap Call.</li>' +
      '<li><b>Patients who texted back.</b> They are waiting on you right now.</li>' +
      '<li><b>Follow-ups due.</b> Zoho tasks due today with no set time. Do them between booked calls.</li>' +
      '<li><b>Unpaid retainer invoices.</b> About 1 in 2 pay: the best odds on your page.</li>' +
      '<li><b>Quotes waiting.</b> About 1 in 8 pay. Fresh quotes first.</li>' +
      '<li><b>No next step.</b> Newer deals with nothing booked. The goal of the call is a quote.</li></ol>' +
      '<p><b>Booked calls</b> (&#9719; Today) happen at their time, whatever else you are doing.</p>' +
      '<p><b>The dialer is staffed all day.</b> When it is your turn on the dialer, stay logged in to RingCX: times patients picked on the shared calendar come to you there first, then new leads, then retries. Pick the result in RingCX after each call. Off the dialer, work this page top to bottom and take your own booked calls.</p>' +
      '<p><b>After every call, tap Result</b> and pick what happened. That writes Zoho, books the next call and sends the right text. Never leave a call with no result: the red bar counts them.</p>' +
      '<p><b>Alerts:</b> the red bar and the soft tone mean a call is due, a new lead is waiting, or someone texted. Tap a red chip to jump to that patient. Mute quiets what is listed; anything new sounds again.</p></div></div>';
  }
  // ── Your day against the plan: the Patient Flow Plan's own measures, with
  // their goals. Green is on plan, red is not; a measure with nothing to count
  // yet shows a dash. The floor view shows the same tiles for every rep.
  var PLAN_TILES = [
    ['promised', 'promised times kept', 'goal 90%', 'Calls booked at a time a patient agreed to that came due today, made within 15 minutes of the time. A missed time is a broken promise.'],
    ['fast_leads', 'new leads called in 5 min', 'goal 60%', 'Your leads that came in today (8 AM to 9 PM), called within 5 minutes. The first minutes decide whether they pick up.'],
    ['results', 'calls with a result', 'goal 90%', 'Calls you made today with a result written. Every call needs one: it books the next step and the right text.'],
    ['talked_none', 'talked, nothing booked', 'goal 20% or less', 'Calls where you talked to the patient but no next call is booked. Every conversation should end with a next step.'],
    ['texts_waiting', 'texts waiting 15 min+', 'goal 0', 'Patients who texted you and have waited more than 15 minutes for an answer.'],
    ['late', 'late calls', 'goal 0', 'Calls booked for earlier that nobody has made yet.']
  ];
  function planVal(v){
    if (!v) return {big: '–', small: ''};
    if (v.of == null) return {big: String(v.n), small: ''};
    if (!v.of) return {big: '–', small: 'none yet'};
    return {big: v.pct + '%', small: v.n + ' of ' + v.of};
  }
  function planHtml(p){
    var pl = p.plan || {};
    return '<div class="plan"><p class="lbl2" title="The same measures as the Patient Flow Plan. Green is on plan.">Your day vs the plan</p><div class="ptiles">' +
      PLAN_TILES.map(function(t){
        var v = pl[t[0]], x = planVal(v), cls = !v || (v.of === 0) ? 'na' : (v.ok ? 'ok' : 'bad');
        return '<div class="pt2 ' + cls + '" title="' + esc(t[3]) + '"><b>' + esc(x.big) + (x.small ? ' <small>' + esc(x.small) + '</small>' : '') + '</b>' +
               '<span>' + esc(t[1]) + '</span><em>' + esc(t[2]) + '</em></div>';
      }).join('') + '</div><p class="psub">' + p.nums.done + ' calls done today · ' + p.nums.new_leads + ' new leads waiting</p></div>';
  }
  function section(id, title, cls, count, hint, rows, extra, sec){
    return secWrap(id, title, cls, count, hint, extra && extra.tip,
      (rows.length ? HD + rows.map(function(r){ return rowHtml(r, sec); }).join('') : '<p class="empty">' + esc(extra && extra.empty || 'Nothing here.') + '</p>') +
      (extra && extra.more ? '<div class="more">' + extra.more + '</div>' : ''));
  }
  function group(id, title, sub, tip){
    return '<div class="grp' + (TIPS_ON[id] ? ' tipon' : '') + '" id="' + id + '"><div class="gh"><h3>' + esc(title) + '</h3>' + infoBtn(tip) +
      '<span class="gs">' + esc(sub) + '</span></div>' + (tip ? '<p class="tip">' + esc(tip) + '</p>' : '') + '</div>';
  }
  var WHY_TIPS = {
    'new': 'A brand new lead. Call fast: the first minutes matter most.',
    'quote': "A follow-up Zoho books after a quote (24 hours, 3 days, 1 week, 10 days, 2 weeks, 1 month). Skip it if you already have a call booked with her.",
    'cb': 'The patient asked for a call back.',
    'booked': 'A call booked on your calendar, by you or by the patient.',
    'retry': 'An automatic try again after a call nobody answered.',
    'nostep': 'A newer deal with no call booked. Book the next call.',
    'quotewait': 'Quoted, not paid yet. Follow up until she pays or says no.',
    'invoice': 'Retainer invoice sent, not paid yet.',
    'texted': 'She texted us and has no answer yet.',
    'task': 'A Zoho task due today with no set time. Call between your booked calls.',
    'missed': 'She called us and nobody picked up.'
  };

  var showNoResult = false;
  function render(){
    var p = PAGE, n = p.nums;
    ROWS = {};
    var upd = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    $('who').innerHTML = '<b>' + esc(p.rep.name || REP.name || '') + '</b> · ' + esc(p.date_label) + ' · updated ' + esc(upd);
    var ban = '';
    if (p.fake) ban += '<p class="banner">Fake data mode. Made-up patients and 555 numbers.</p>';
    if (p.stale) ban += '<p class="banner err">' + esc(p.error || 'Showing the last good copy.') + '</p>';
    if (p.role === 'coordinator') ban += '<p class="banner">Coordinator view. Your own buttons (Confirmed, Rescheduled, Paid, Call back at a time, No answer) are coming soon.</p>';
    $('banners').innerHTML = ban;

    var h = planHtml(p) + guideHtml();
    h += '<span id="s-day"></span>';
    var up = p.up_next || {rows: []};
    if (up.rows.length) {
      h += group('g-up', 'Up Next', 'Do these now, top first.',
        'One list for right now. A time we promised a patient always comes first: late calls, then calls due in the next 5 minutes. Then a brand new lead (the first minutes matter most), anyone who texted you, and follow-ups due today. After that, the patients most likely to pay: unpaid invoices, then quotes. Every patient is also in their own list below.');
      h += secWrap('s-up', 'Right Now', '', up.rows.length, up.next_booked ? 'Your next booked call is ' + up.next_booked.short + ' at ' + up.next_booked.when + '.' : 'No more booked calls today.',
        '', HD + up.rows.map(function(r){ return rowHtml(r, 'up'); }).join(''));
    }
    h += group('g-calls', 'Calls for Today', 'Late first, then the rest of the day in time order.',
      "These are the calls on your calendar. Work top to bottom. After each call, tap Result and pick what happened: that writes it in Zoho and books the next step. A red line means a call is late or still needs a result.");
    var nr = p.no_result.length;
    if (nr) {
      h += '<div class="alert"><span class="dot"></span><span class="what">' + nr + (nr === 1 ? ' call has' : ' calls have') + ' no result yet.</span><span class="hint">Tap to finish them. It takes one tap each.</span><button class="btn" id="finish">Finish them</button></div>';
      if (showNoResult) h += section('s-nores', 'No Result Yet', 'dn', nr, 'Calls you made today with no result written.', p.no_result,
        {tip: 'You called but did not pick what happened. Open each one and tap one result. Until you do, Zoho does not know the next step.'}, 'nores');
    }
    h += section('s-late', 'Late', 'dn', n.late, 'Should have been called already. Invoice and quote patients first.', p.late,
      {tip: 'Calls booked for earlier that nobody made yet. A call is late ' + p.late_minutes + ' minutes after its time. Patients with an invoice or a quote come first, then the oldest.',
       empty: 'Nothing late. Nice.', more: p.late_more ? '+ ' + p.late_more + ' more late, oldest <b>' + esc(p.late_oldest) + '</b>' : ''}, 'late');

    var trows = p.today.map(function(r){ return rowHtml(r, 'today'); });
    trows.splice(p.now_index, 0, '<div class="now">Now ' + esc(p.now_label) + '</div>');
    h += secWrap('s-today', 'Today', '', p.today.length + p.today_more, 'Still to come, in time order.',
      'Calls booked on your calendar for the rest of today. The green line is the time now. They come from you, from patients who picked a time, and from Zoho follow-up plans.',
      (p.today.length ? HD + trows.join('') : '<div class="now">Now ' + esc(p.now_label) + '</div><p class="empty">No more calls booked today.</p>') +
      (p.today_more ? '<div class="more">+ ' + p.today_more + ' more today, last one at <b>' + esc(p.today_last) + '</b></div>' : ''));

    var newMore = [];
    if (p.new_more) newMore.push('+ ' + p.new_more + ' more');
    if (p.new_elsewhere) newMore.push(p.new_elsewhere + (p.new_elsewhere === 1 ? ' is' : ' are') + ' already in Late or Today above');
    h += group('g-new', 'New Leads', 'Call these as soon as they come in.',
      'Patients who filled in a form in the last 24 hours. About 1 in 20 new leads pay, and almost only after a quote, so the goal of the first call is a quote. The faster you call, the more of them pick up.');
    h += section('s-new', 'Not Called Yet', '', n.new_leads, 'Call now. Newest first.', p.new_leads,

  // ── outcomes ──

  var busy = false;
  function submit(){
    if (busy || !FLOW) return;

    var body = {rep: REP.id, dealId: r.deal_id, outcome: FLOW.outcome};
    if (r.call_id) body.callId = r.call_id;

    if (FLOW.reason) body.reason = FLOW.reason;

    if (tapped) tapped.classList.add('saving');

      busy = false; unsaving();

  // ── alerts: the billing board's tone (scoreboard_v6), for a rep's day ──
  // While something needs the rep NOW, a soft two-note tone every 40 s and a bar
  // saying what. Now = a booked call due within 5 minutes or late, a new lead
  // under 15 minutes old, a patient who texted back. Mute silences what is on
  // the bar; anything new sounds again. Browsers allow sound only after the page
  // has been touched once, so the bar asks for that tap.
  var ALERT = {ctx: null, timer: null, keys: [], items: [], muted: null, armed: false};
  function alertStoreKey(){ return 'myday-alert-muted-' + (REP.id || ''); }
  function mutedSet(){
    if (ALERT.muted) return ALERT.muted;
    var m = {}; try { (JSON.parse(localStorage.getItem(alertStoreKey()) || '[]') || []).forEach(function(k){ m[k] = 1; }); } catch (e) {}
    return (ALERT.muted = m);
  }
  function saveMuted(){ try { localStorage.setItem(alertStoreKey(), JSON.stringify(Object.keys(ALERT.muted || {}))); } catch (e) {} }
  function alertItems(p){
    var out = [], now = Date.now();
    (p.late || []).forEach(function(r){ out.push({k: 'late:' + r.key, t: 'late call', r: r, sec: 's-late'}); });
    (p.today || []).forEach(function(r){ var t = Date.parse(r.start); if (t && t - now <= 5 * 60000) out.push({k: 'due:' + r.key, t: 'call due now', r: r, sec: 's-today'}); });
    (p.new_leads || []).forEach(function(r){ var t = Date.parse(r.start); if (t && now - t <= 15 * 60000) out.push({k: 'lead:' + r.key, t: 'new lead', r: r, sec: 's-new'}); });
    (p.queue || []).forEach(function(r){ var t = Date.parse(r.start); if (t && now - t <= 15 * 60000) out.push({k: 'lead:' + r.key, t: 'new lead', r: r, sec: 's-queue'}); });
    (((p.pipeline || {}).texts || {}).rows || []).forEach(function(r){ out.push({k: 'text:' + r.key + ':' + r.start, t: 'text waiting', r: r, sec: 's-texts'}); });
    return out;
  }
  function alertUnlock(){
    try { if (!ALERT.ctx) ALERT.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ALERT.ctx.state === 'suspended') ALERT.ctx.resume(); } catch (e) { return; }
    if (ALERT.armed) return; ALERT.armed = true;
    setTimeout(function(){ alertRender(); if (ALERT.timer) alertTone(); }, 300);
  }
  function alertTone(){
    var c = ALERT.ctx; if (!c || c.state !== 'running') return;
    [[660, 0], [880, 0.17]].forEach(function(q){
      var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + q[1];
      o.type = 'sine'; o.frequency.value = q[0]; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      o.start(t); o.stop(t + 0.16);
    });
  }
  function alertRender(){
    if (!PAGE) return;
    var items = alertItems(PAGE), muted = mutedSet(), keys = items.map(function(x){ return x.k; });
    Object.keys(muted).forEach(function(k){ if (keys.indexOf(k) < 0) delete muted[k]; }); saveMuted();
    ALERT.items = items; ALERT.keys = keys;
    var fresh = items.filter(function(x){ return !muted[x.k]; });
    var counts = {}; items.forEach(function(x){ counts[x.t] = (counts[x.t] || 0) + 1; });
    var PL = {'late call': 'late calls', 'call due now': 'calls due now', 'new lead': 'new leads', 'text waiting': 'texts waiting'};
    // Each kind is a button: it opens that list and the next patient in it, highlighted.
    var what = Object.keys(counts).map(function(t){
      return '<button class="achip" data-akind="' + esc(t) + '">' + counts[t] + ' ' + esc(counts[t] > 1 ? PL[t] : t) + '</button>';
    }).join('');
    var firstItem = fresh[0] || items[0], first = (firstItem || {}).r;
    $('alertbar').innerHTML = items.length ? '<div class="abar' + (fresh.length ? '' : ' quiet') + '" role="status"><span class="dot"></span>' +
      '<span class="what">' + what + '</span>' + (first ? '<button class="achip next" data-akey="' + esc(firstItem.k) + '">Next: ' + esc(first.short) + '</button>' : '') +
      (fresh.length ? '<button class="btn" data-amute="1">Mute</button>' : '<span class="mutedtxt">muted, a new one will sound</span><button class="btn" data-aunmute="1">Unmute</button>') +
      (fresh.length && !(ALERT.ctx && ALERT.ctx.state === 'running') ? '<span class="hint">Tap anywhere once to turn the sound on.</span>' : '') + '</div>' : '';
    if (fresh.length && !ALERT.timer) { alertTone(); ALERT.timer = setInterval(alertTone, 40000); }
    else if (!fresh.length && ALERT.timer) { clearInterval(ALERT.timer); ALERT.timer = null; }
    var base = document.title.replace(/^\(\d+\) /, '');
    document.title = fresh.length ? '(' + fresh.length + ') ' + base : base;
  }
  document.addEventListener('pointerdown', alertUnlock);
  document.addEventListener('keydown', alertUnlock);
  // Open the list an alert points at, open that patient, and flash the row.
  var AKIND_AT = {};
  function goAlert(item){
    if (!item) return;
    OPEN_SEC = item.sec; OPEN_KEY = item.r.key; FLOW = null;
    render(); alertRender();
    var row = document.querySelector('.r[data-key="' + CSS.escape(item.r.key) + '"]');

  document.addEventListener('click', function(e){

    var ak = e.target.closest('[data-akind]');
    if (ak) {
      // repeated taps step through that kind, one patient at a time
      var kind = ak.getAttribute('data-akind'), list = ALERT.items.filter(function(x){ return x.t === kind; });
      var i = ((AKIND_AT[kind] == null ? -1 : AKIND_AT[kind]) + 1) % (list.length || 1);
      AKIND_AT[kind] = i; goAlert(list[i]); return;
    }
    var akey = e.target.closest('[data-akey]');
    if (akey) { var k = akey.getAttribute('data-akey'); goAlert(ALERT.items.filter(function(x){ return x.k === k; })[0]); return; }
    if (e.target.closest('[data-amute]')) { var m = mutedSet(); ALERT.keys.forEach(function(k){ m[k] = 1; }); saveMuted(); alertRender(); }
    else if (e.target.closest('[data-aunmute]')) { ALERT.muted = {}; saveMuted(); alertRender(); }
  });

  // ── phone time today, from the sales board's report ──
  function fmtDur(sec){ sec = Math.round(sec || 0); var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60); return h ? h + 'h ' + m + 'm' : m + 'm'; }
  function loadHandle(){

          (j.books ? '<span title="From Zoho Books, today: quotes sent, retainer invoices sent, retainers paid."><b>' + (j.books.quotes_sent || 0) + '</b> quotes · <b>' + (j.books.retainers_sent || 0) + '</b> invoices · <b>' + (j.books.retainers_paid || 0) + '</b> paid</span>' : '') +
          (j.covers_to ? '<span title="The dialer report covers calls up to this time.">dialer to ' + esc(j.covers_to.slice(0, 5)) + '</span>' : '');
      }).catch(function(){});

  load(false);
  loadHandle();
  setInterval(function(){ if (!OPEN_KEY && !document.hidden) load(false); }, 120000);
  setInterval(function(){ if (!document.hidden) loadHandle(); }, 120000);
  setInterval(function(){ if (PAGE) alertRender(); }, 30000);
})();
</script>
