<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactions Report — Sales Call Monitor</title>
  <style>
    :root {
      --bg: #eef0f5;
      --bg-grad: radial-gradient(ellipse at top left, #eaecf7 0%, #eef0f5 35%, #f0f1f6 100%);
      --surface: #ffffff; --surface2: #f7f8fc;
      --border: rgba(15,23,42,0.13); --sep: rgba(15,23,42,0.07);
      --text: #0b0e1a; --secondary: #5b6478; --tertiary: #94a0b8;
      --blue: #2563eb; --blue-dk: #1d4ed8; --green: #10b981; --green-dk: #047857;
      --red: #ef4444; --orange: #f59e0b; --purple: #8b5cf6; --teal: #06b6d4;
      --radius-sm: 8px; --radius: 12px; --radius-lg: 18px;
      --shadow-sm: 0 1px 3px rgba(15,23,42,.07), 0 1px 2px rgba(15,23,42,.04);
      --shadow: 0 4px 24px rgba(15,23,42,.08), 0 1px 4px rgba(15,23,42,.06);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); background-image: var(--bg-grad);
      color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; padding: 20px; }
    a { color: var(--blue); text-decoration: none; }
    .wrap { max-width: 1080px; margin: 0 auto; }

    .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .top h1 { margin: 0 0 2px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    .top .sub { color: var(--secondary); font-size: 13px; max-width: 620px; }
    .back { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--secondary); margin-bottom: 8px; }
    .back:hover { color: var(--blue); }

    .controls { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow-sm); }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--tertiary); font-weight: 700; }
    .controls input[type="datetime-local"] { padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font: inherit; }
    .presets { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn { padding: 7px 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
      color: var(--text); font: inherit; font-weight: 600; cursor: pointer; transition: background .12s, border-color .12s; white-space: nowrap; }
    .btn:hover { background: var(--surface2); }
    .btn.sm { padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--secondary); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { background: var(--blue-dk); }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow-sm); }
    .card .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--tertiary); font-weight: 600; }
    .card .v { font-size: 22px; font-weight: 700; margin-top: 3px; font-feature-settings: "tnum"; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th { position: sticky; top: 0; background: var(--surface2); text-align: right; font-size: 11px; text-transform: uppercase;
      letter-spacing: .03em; color: var(--secondary); font-weight: 600; padding: 11px 14px; white-space: nowrap; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
    thead th.left { text-align: left; }
    thead th .arw { color: var(--blue); font-size: 10px; }
    tbody td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--sep); font-feature-settings: "tnum"; white-space: nowrap; }
    tbody td.left { text-align: left; }
    tbody tr:hover { background: var(--surface2); }
    tbody tr:last-child td { border-bottom: none; }
    .rank { color: var(--tertiary); font-size: 12px; width: 26px; }
    .agent { font-weight: 600; }
    .muted { color: var(--tertiary); }
    .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .pill.a { background: rgba(37,99,235,.10); color: var(--blue-dk); }
    .pill.b { background: rgba(139,92,246,.12); color: #6d28d9; }
    .pill.zero { background: transparent; color: var(--tertiary); font-weight: 500; }
    tfoot td { padding: 11px 14px; text-align: right; font-weight: 700; border-top: 2px solid var(--border); background: var(--surface2); font-feature-settings: "tnum"; }
    tfoot td.left { text-align: left; }

    .state { padding: 40px; text-align: center; color: var(--secondary); }
    .note { margin-top: 12px; font-size: 12px; color: var(--tertiary); line-height: 1.5; }
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    @media (max-width: 640px) { body { padding: 12px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/v2">← Back to Sales Call Monitor</a>
    <div class="top">
      <div>
        <h1>Interactions Report <span style="font-size:13px;font-weight:600;color:var(--tertiary)">· automatic</span></h1>
        <div class="sub">Per-agent call breakdown pulled automatically from <strong>RingEX</strong> (manual + regular RingCentral) and <strong>RingCX</strong> (dialer). Pick any date &amp; time range. <a href="/v2/interactions/csv" style="font-weight:600">📄 Upload a RingCX CSV instead</a></div>
      </div>
    </div>

    <div class="controls">
      <div class="field">
        <label for="from">From</label>
        <input type="datetime-local" id="from">
      </div>
      <div class="field">
        <label for="to">To</label>
        <input type="datetime-local" id="to">
      </div>
      <button class="btn primary" id="reload" onclick="load()">↻ Run report</button>
      <div class="presets">
        <button class="btn sm" onclick="preset('today')">Today</button>
        <button class="btn sm" onclick="preset('yesterday')">Yesterday</button>
        <button class="btn sm" onclick="preset('7d')">Last 7 days</button>
        <button class="btn sm" onclick="preset('month')">This month</button>
      </div>
    </div>

    <div class="cards" id="cards"></div>

    <div id="diag" style="display:none;margin-bottom:16px;padding:12px 14px;border-radius:12px;
      background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px;line-height:1.5;"></div>

    <div class="panel">
      <div class="table-scroll">
        <table id="tbl">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"><tr><td class="state" colspan="7"><span class="spin"></span> Loading…</td></tr></tbody>
          <tfoot id="tfoot"></tfoot>
        </table>
      </div>
    </div>
    <div class="note" id="note"></div>
  </div>

<script>
  let _rows = [], _totals = {};
  let _sort = { key: "calls", dir: -1 };

  const COLS = [
    { key: "_rank",            label: "#",                     align: "right", cls: "rank", noSort: true },
    { key: "name",             label: "Agent Full Name",       align: "left" },
    { key: "calls",            label: "Total Calls",           align: "right" },
    { key: "talk_seconds",     label: "Total Talk Time",       align: "right" },
    { key: "calls_under_3m",   label: "Calls < 3 min",         align: "right" },
    { key: "calls_under_15m",  label: "Calls < 15 min",        align: "right" },
    { key: "deals_claimed",    label: "Deals Claimed",         align: "right" },
  ];

  function pad(n) { return String(n).padStart(2, "0"); }
  function toLocalInput(d) {
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function startOfToday() { const d = new Date(); d.setHours(0,0,0,0); return d; }

  function preset(which) {
    const now = new Date();
    let from = startOfToday(), to = now;
    if (which === "yesterday") {
      from = startOfToday(); from.setDate(from.getDate()-1);
      to = startOfToday(); to.setSeconds(-1);
    } else if (which === "7d") {
      from = startOfToday(); from.setDate(from.getDate()-6);
    } else if (which === "month") {
      from = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
    }
    document.getElementById("from").value = toLocalInput(from);
    document.getElementById("to").value = toLocalInput(to);
    load();
  }

  function fmtDur(s) {
    s = Math.round(s || 0);
    if (!s) return '<span class="muted">—</span>';
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (h) return `${h}h ${pad(m)}m ${pad(sec)}s`;
    if (m) return `${m}m ${pad(sec)}s`;
    return `${sec}s`;
  }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }

  function renderHead() {
    document.getElementById("thead").innerHTML = COLS.map(c => {
      const arrow = (!c.noSort && _sort.key === c.key) ? ` <span class="arw">${_sort.dir < 0 ? "▼" : "▲"}</span>` : "";
      const onclick = c.noSort ? "" : ` onclick="sortBy('${c.key}')"`;
      return `<th class="${c.align === "left" ? "left" : ""}"${onclick}>${c.label}${arrow}</th>`;
    }).join("");
  }

  function sortBy(key) {
    if (_sort.key === key) _sort.dir *= -1;
    else _sort = { key, dir: (key === "name" ? 1 : -1) };
    renderHead(); renderBody();
  }

  function renderCards() {
    const t = _totals || {};
    const cards = [
      { k: "Agents",        v: t.agents ?? 0 },
      { k: "Total Calls",   v: t.calls ?? 0 },
      { k: "Total Talk Time", v: fmtDur(t.talk_seconds) },
      { k: "Calls < 3 min", v: t.calls_under_3m ?? 0 },
      { k: "Calls < 15 min",v: t.calls_under_15m ?? 0 },
      { k: "Deals Claimed", v: t.deals_claimed ?? 0 },
    ];
    document.getElementById("cards").innerHTML = cards.map(c =>
      `<div class="card"><div class="k">${c.k}</div><div class="v">${c.v}</div></div>`).join("");
  }

  function renderBody() {
    const tbody = document.getElementById("tbody");
    if (!_rows.length) {
      tbody.innerHTML = `<tr><td class="state" colspan="${COLS.length}">No agent call activity for this range.</td></tr>`;
      document.getElementById("tfoot").innerHTML = "";
      return;
    }
    const dir = _sort.dir, key = _sort.key;
    const sorted = [..._rows].sort((a, b) => {
      let va = a[key], vb = b[key];
      if (key === "name") return String(va).localeCompare(String(vb)) * dir;
      return ((va ?? 0) - (vb ?? 0)) * dir;
    });
    tbody.innerHTML = sorted.map((r, i) => {
      const cells = COLS.map(c => {
        if (c.key === "_rank") return `<td class="rank">${i + 1}</td>`;
        if (c.key === "name") return `<td class="left agent">${esc(r.name)}</td>`;
        if (c.key === "talk_seconds") return `<td>${fmtDur(r.talk_seconds)}</td>`;
        if (c.key === "calls_under_3m") { const n = r.calls_under_3m || 0; return `<td><span class="pill ${n ? "a" : "zero"}">${n}</span></td>`; }
        if (c.key === "calls_under_15m") { const n = r.calls_under_15m || 0; return `<td><span class="pill ${n ? "b" : "zero"}">${n}</span></td>`; }
        if (c.key === "deals_claimed") { const n = r.deals_claimed || 0; return `<td><span class="pill ${n ? "a" : "zero"}">${n}</span></td>`; }
        const val = r[c.key] || 0;
        return `<td class="${val ? "" : "muted"}">${val}</td>`;
      }).join("");
      return `<tr>${cells}</tr>`;
    }).join("");

    const t = _totals;
    document.getElementById("tfoot").innerHTML = "<tr>" + COLS.map(c => {
      if (c.key === "_rank") return `<td></td>`;
      if (c.key === "name") return `<td class="left">Total · ${t.agents || 0} agents</td>`;
      if (c.key === "talk_seconds") return `<td>${fmtDur(t.talk_seconds)}</td>`;
      return `<td>${t[c.key] ?? 0}</td>`;
    }).join("") + "</tr>";
  }

  async function load() {
    const from = document.getElementById("from").value;
    const to = document.getElementById("to").value;
    if (!from || !to) { preset("today"); return; }
    const btn = document.getElementById("reload");
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Running…';
    document.getElementById("diag").style.display = "none";
    document.getElementById("tbody").innerHTML = `<tr><td class="state" colspan="7"><span class="spin"></span> Pulling calls from RingEX + RingCX…</td></tr>`;
    try {
      const tz = new Date().getTimezoneOffset();
      // calls_only=1 → drop Books/CRM agents (quotes/closings); bot_claims=1 → include
      // whoever claimed deals in the bot. Only real callers + claimers, no stale names.
      const resp = await fetch(`/api/agent-analytics?tz=${tz}&start=${encodeURIComponent(from)}&end=${encodeURIComponent(to)}&calls_only=1&bot_claims=1&_=${Date.now()}`, { headers: { Accept: "application/json" } });
      const j = await resp.json();
      if (j.status !== "ok") throw new Error(j.message || "Failed to load");
      _rows = j.rows || [];
      _totals = j.totals || {};
      renderCards(); renderHead(); renderBody();
      const t = _totals;
      const srcLabel = {
        "zoho-crm-calls": "Zoho CRM Calls — every logged call, both platforms (manual/RingEX + RingCX dialer)",
        "backoffice-rc + ringcx-cdr": "RingEX (back-office call log) + RingCX dialer CDR — both platforms",
        "backoffice-rc": "Back-office RingCentral account call log (all RingEX calls)",
        "cdr+calllog": "RingCX CDR + RingEX call log (every dial, both platforms)",
        "analytics": "RingCentral Business Analytics (fallback — may undercount dialer calls)",
        "none": "no telephony source reachable",
      }[t.call_source] || t.call_source || "—";
      let note = `Source: ${srcLabel}.`;
      const m = t.call_meta || {};

      // When calls are 0, say exactly where the pipeline stops so it's not a mystery.
      const diag = document.getElementById("diag");
      if ((t.calls || 0) === 0) {
        let msg = "";
        const f = m.calls_fetched, w = m.calls_in_window, u = m.unattributed;
        if (m.reached) {
          // The back office answered — the 0 is about the calls themselves.
          if (!f) msg = "The back office reached RingCentral, but its account call log returned <b>0 calls</b> for this range. RingCentral isn't returning the account-wide call log to the back office (token scope / permission on the back-office side).";
          else if (!w) msg = `RingCentral returned <b>${f} calls</b>, but <b>0 fall in this date/time window</b> — widen the range or pick a day with calls.`;
          else if (u && u >= w) msg = `<b>${w} calls</b> in this window but <b>none had an agent name</b> on the leg — attribution issue, tell me and I'll adjust.`;
          else msg = `Fetched ${f}, ${w} in window, ${u} unattributed — yet totals are 0. Send me this line.`;
        } else if (m.error) {
          // The back office was NOT reached — show exactly why.
          msg = `Couldn't reach the back-office call-stats endpoint: <b>${esc(m.error)}</b>` + (m.http ? ` (HTTP ${m.http})` : "") + (m.url ? `<br><span style="opacity:.7">${esc(m.url)}</span>` : "");
        } else {
          msg = "No telephony source reachable, and no diagnostic returned. The deploy may still be in progress — re-run in a minute.";
        }
        diag.innerHTML = `⚠️ <b>No call numbers.</b> ${msg}`;
        diag.style.display = "block";
      } else {
        diag.style.display = "none";
      }

      if ((t.calls || 0) === 0 && (m.calls_fetched != null || m.calls_in_window != null)) {
        note += `  (${m.calls_fetched ?? "?"} calls fetched, ${m.calls_in_window ?? "?"} in this window, ${m.unattributed ?? 0} without an agent name.)`;
      }
      if (m.ringcx_calls_added) {
        note += `  ${m.ringcx_calls_added} RingCX dialer call${m.ringcx_calls_added === 1 ? "" : "s"} added from the RingCX CDR. 🎉`;
      } else if (m.ringcx_calls_added === 0 && t.call_source && t.call_source.indexOf("backoffice-rc") === 0) {
        note += `  (RingCX CDR returned 0 dialer calls — either none in this range, or reporting access hasn't propagated yet / is still 403.)`;
      }
      if (m.via_leg) {
        note += `  ${m.via_leg} dialer/queue call${m.via_leg === 1 ? "" : "s"} were credited to their agent from an inner leg (RingCX calls routed through RingCentral).`;
      }
      if (t.unattributed_calls) {
        note += `  ${t.unattributed_calls} call${t.unattributed_calls === 1 ? "" : "s"} still couldn't be tied to a named agent — those are pure RingCX legs not on the RingCentral platform; counting them needs RingCX CDR (WEM) access.`;
      }
      note += "  Showing only agents who placed calls (RingEX/RingCX) or claimed a deal in the bot — Books/CRM-only names are excluded.  Calls < 3 min and < 15 min are cumulative (a 2-min call counts in both).";
      document.getElementById("note").textContent = note;
    } catch (e) {
      document.getElementById("tbody").innerHTML = `<tr><td class="state" colspan="7" style="color:var(--red)">Couldn't load: ${esc(e.message)}</td></tr>`;
      document.getElementById("cards").innerHTML = "";
      document.getElementById("tfoot").innerHTML = "";
    } finally {
      btn.disabled = false; btn.innerHTML = "↻ Run report";
    }
  }

  // Default: today 00:00 → now.
  document.getElementById("from").value = toLocalInput(startOfToday());
  document.getElementById("to").value = toLocalInput(new Date());
  document.getElementById("from").addEventListener("change", load);
  document.getElementById("to").addEventListener("change", load);
  load();
</script>
</body>
</html>
