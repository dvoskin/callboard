<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow · Patient Flow</title>
<style>
  :root{ --bg:#fff; --ink:#111; --muted:#6b7280; --rule:#e5e7eb; --hair:#f0f1f3; --tint:#f7f8f9;
         --ok:#0B6E67; --bad:#B03A31; --warn:#9C6712; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0c0e; --ink:#f3f4f6; --muted:#9ca3af; --rule:#23262b; --hair:#1a1d21; --tint:#14171a;
           --ok:#4FCCBF; --bad:#EE8177; --warn:#E0A542; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  .app{max-width:760px;margin:0 auto;padding:16px 16px 48px}
  .top{display:flex;align-items:center;gap:6px}
  h1{font-size:22px;margin:0 auto 0 0;letter-spacing:-.02em}
  .top a{font-size:13px;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;text-decoration:none;color:inherit}
  .asof{color:var(--muted);font-size:12.5px;margin:4px 0 0}
  /* what needs doing now */
  .now{margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:var(--tint)}
  .now h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .now ol{margin:0;padding-left:20px}
  .now li{margin:5px 0;font-weight:600}
  .now li span{font-weight:400;color:var(--muted)}
  .clear{color:var(--ok);font-weight:650}
  /* the steps */
  .step{margin-top:10px;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  .sh{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
  .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--muted)}
  .ok .dot{background:var(--ok)} .bad .dot{background:var(--bad)} .warn .dot{background:var(--warn)}
  .st{flex:1;min-width:0}
  .st b{display:block;font-size:13px;color:var(--muted);font-weight:650}
  .st p{margin:2px 0 0;font-size:16px;font-weight:650;line-height:1.3}
  .big{flex:none;font-size:24px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ok .big{color:var(--ok)} .bad .big{color:var(--bad)} .warn .big{color:var(--warn)}
  .chev{flex:none;color:var(--muted);font-size:12px;transition:transform .15s}
  .step.open .chev{transform:rotate(90deg)}
  .todo{margin:0;padding:0 14px 12px 38px;font-size:13.5px;color:var(--ink)}
  .todo:empty{display:none}
  .more{display:none;padding:0 14px 14px 38px;font-size:13px}
  .step.open .more{display:block}
  .more p{margin:6px 0;color:var(--muted)}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  td{padding:7px 4px;border-top:1px solid var(--hair);vertical-align:top}
  td.r{text-align:right;color:var(--muted);white-space:nowrap}
  a{color:inherit}
  .err{color:var(--bad);margin-top:14px}
  .dl{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--rule);color:var(--muted)}
  .dl.on{border-color:var(--ok);color:var(--ok)}
  .rf{font:inherit;font-size:12.5px;border:0;background:none;color:var(--ok);font-weight:650;cursor:pointer;padding:0 0 0 6px}
  @media(max-width:520px){
    .app{padding:12px 12px 40px}
    .sh{padding:11px 12px;gap:10px}
    .st p{font-size:15px}
    .big{font-size:21px}
    .todo,.more{padding-left:34px;padding-right:12px}
  }
</style>
<div class="app">
  <div class="top"><h1>Flow</h1><a href="/my-day/floor">Floor</a><a href="/my-day">My Day</a></div>
  <p class="asof" id="asof">Loading today's flow…</p>
  <div id="body"></div>
</div>
<script>
(function(){
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pct(n, of){ return of ? Math.round(100 * n / of) : null; }
  var OPEN = {};
  function people(rows, label){
    if (!rows || !rows.length) return '';
    return '<p>' + esc(label) + '</p><table>' + rows.map(function(r){
      return '<tr><td><a href="' + esc(r.link) + '" target="_blank" rel="noopener">' + esc(r.name) + '</a>' + (r.rep ? ' <span style="color:var(--muted)">· ' + esc(r.rep) + '</span>' : '') +
        (r.why ? '<br><span style="color:var(--muted);font-size:12px">' + esc(r.why) + '</span>' : '') +
        (r.dialer ? ' <span class="dl' + (/^on the dialer/.test(r.dialer) ? ' on' : '') + '">' + esc(r.dialer) + '</span>' : '') + '</td><td class="r">' + esc(r.when) + '</td></tr>';
    }).join('') + '</table>';
  }
  function pairs(rows, a, b){
    if (!rows || !rows.length) return '';
    return '<table>' + rows.map(function(r){ return '<tr><td>' + esc(r[a]) + '</td><td class="r">' + esc(r[b]) + '</td></tr>'; }).join('') + '</table>';
  }
  // One step: a coloured dot, its name, one plain sentence, one big number,
  // a "what to do now" line, and the detail behind a tap.
  function step(id, s){
    return '<div class="step ' + s.tone + (OPEN[id] ? ' open' : '') + '" id="' + id + '"><div class="sh" data-step="' + id + '">' +
      '<span class="dot"></span><div class="st"><b>' + esc(s.name) + '</b><p>' + esc(s.line) + '</p></div>' +
      '<span class="big">' + esc(s.big) + '</span><span class="chev">&#9654;</span></div>' +
      '<p class="todo">' + (s.todo ? esc(s.todo) : '') + '</p><div class="more">' + (s.more || '<p>Nothing more to show.</p>') + '</div></div>';
  }
  function render(d){
    var L = d.leads, D = d.dialer, P = d.picked, O = d.ownership, C = d.commitments, Pi = d.pipeline, A = d.automation, pv = O.preview || {};
    document.getElementById('asof').innerHTML = 'Today, as of ' + esc(new Date(d.builtAt).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})) + ', updates every 2 minutes.<button class="rf" data-refresh="1">Refresh now</button><br>Green is fine, red needs someone now. Tap a step for the names; each name says whether the dialer has them, so nobody calls twice.';
    var steps = [], now = [];

    // 1. New leads
    var p1 = pct(L.fast5, L.due5);
    steps.push(['s-leads', {
      name: '1. New leads', big: p1 == null ? L.total : p1 + '%',
      line: p1 == null ? L.total + ' new leads today' : L.fast5 + ' of ' + L.due5 + ' new leads called within 5 minutes',
      tone: L.neverCalled ? 'bad' : (p1 == null || p1 >= 60 ? 'ok' : 'warn'),
      todo: L.neverCalled ? L.neverCalled + ' new leads have not been called. Call them now.' : '',
      more: '<p>' + L.total + ' came in today. ' + L.picked + ' picked a time to be called; the rest want a call now (goal: 6 in 10 within 5 minutes).</p>' + people(L.stuck, 'Not called yet:')}]);
    if (L.neverCalled) now.push(['s-leads', L.neverCalled + ' new leads not called yet', 'call them now']);

    // 2. Picked times
    var p2 = pct(P.dialed15, P.due);
    steps.push(['s-picked', {
      name: '2. Times patients picked', big: p2 == null ? '–' : p2 + '%',
      line: P.due ? P.dialed15 + ' of ' + P.due + ' called on time' + (P.late != null ? ' · ' + P.late + ' late · ' + P.notCalled + ' not called yet' : '') : 'No picked times due yet',
      tone: p2 == null ? 'ok' : (p2 >= 90 ? 'ok' : (p2 >= 60 ? 'warn' : 'bad')),
      todo: P.notCalled ? P.notCalled + ' not called yet' + (P.waiting ? ' (' + P.waiting + ' waiting in the dialer)' : '') + '. Whoever is on the dialer takes them first.'
        : (P.late ? P.late + ' were called late. Keep someone on the dialer every hour.' : ''),
      more: '<p>When a patient picks a time, they go on the dialer\'s Scheduled list just before it, and whoever is logged in to the dialer takes them (goal: 9 in 10 within 15 minutes).</p>' + people(P.stuck, 'Missed their time:')}]);
    if (P.notCalled) now.push(['s-picked', P.notCalled + ' picked times not called yet', P.waiting ? P.waiting + ' waiting in the dialer' : 'put someone on the dialer']);

    // 3. Calls we promised
    var p3 = pct(C.kept, C.due);
    steps.push(['s-promises', {
      name: '3. Calls we promised', big: C.lateNow,
      line: C.lateNow + ' booked calls are late' + (C.due ? ' · ' + C.kept + ' of ' + C.due + ' due today made' : ''),
      tone: C.lateNow > 100 ? 'bad' : (C.lateNow ? 'warn' : 'ok'),
      todo: C.lateNow ? 'Reps work their late calls first in My Day.' : '',
      more: '<p>Calls booked on a rep\'s calendar that nobody made, from the last 7 days. Also ' + C.tasksToday + ' follow-up tasks due today, ' + C.tasksLate3d + ' overdue from the last 3 days.</p>' +
        (C.lateByRep && C.lateByRep.length ? '<p>Late calls by rep:</p>' + pairs(C.lateByRep, 'rep', 'n') : '') + people(C.stuck, 'Not made today:')}]);
    if (C.lateNow) now.push(['s-promises', C.lateNow + ' late booked calls', 'reps clear them in My Day']);

    // 4. Texts waiting
    steps.push(['s-texts', {
      name: '4. Patients who texted', big: C.textsWaiting,
      line: C.textsWaiting ? C.textsWaiting + ' patients have waited more than 15 minutes for a reply' : 'Every patient who texted has a reply',
      tone: C.textsWaiting ? 'bad' : 'ok',
      todo: C.textsWaiting ? 'Their rep answers from My Day, "Patients who texted back".' : '',
      more: '<p>Counted from the reply alerts sent to each rep. Goal: nobody waits more than 15 minutes.</p>'}]);
    if (C.textsWaiting) now.push(['s-texts', C.textsWaiting + ' patients waiting on a text', 'reply now']);

    // 5. Leads nobody reached
    steps.push(['s-owned', {
      name: '5. Leads given to reps but never reached', big: pv.candidates == null ? '…' : pv.candidates,
      line: pv.candidates == null ? 'Counting…' : pv.candidates + ' leads a rep has had 3+ days without ever reaching them',
      tone: !pv.candidates ? 'ok' : 'warn',
      todo: pv.candidates ? 'They go back to the shared calendar and the dialer automatically at 7:05 AM.' : '',
      more: '<p>Reps have ' + (pv.repDeals || 0) + ' new leads; ' + (pv.reached || 0) + ' have been reached and ' + (pv.tooNew || 0) + ' were handed over less than 3 days ago. ' +
        O.manualWeek + ' leads were handed out by hand this week.</p>' +
        (O.lastReturn ? '<p>Last morning: ' + O.lastReturn.returned + ' went back, ' + O.lastReturn.reloaded + ' back on the dialer.</p>' : '') +
        people((pv.sample || []).map(function(r){ return {name: r.name, rep: r.rep, when: r.days + ' days', link: 'https://crm.zoho.com/crm/org771460636/tab/Potentials/' + r.dealId}; }), 'Next to go back:') +
        (O.manualByRep && O.manualByRep.length ? '<p>Handed out by hand this week:</p>' + pairs(O.manualByRep, 'rep', 'n') : '')}]);

    // 6. The dialer
    var spanishReady = D.lists.filter(function(x){ return /spanish|esp/i.test(x.name); }).reduce(function(a, x){ return a + (x.ready || 0); }, 0);
    var spanishDialed = D.queues.filter(function(q){ return /esp/i.test(q.queue); }).reduce(function(a, q){ return a + q.dialed; }, 0);
    var ready = D.lists.reduce(function(a, x){ return a + (x.ready || 0); }, 0);
    steps.push(['s-dialer', {
      name: '6. The dialer', big: D.dialedToday,
      line: D.dialedToday + ' dialer calls today, ' + D.reachedToday + ' reached · ' + ready.toLocaleString() + ' patients ready',
      tone: spanishReady && !spanishDialed ? 'warn' : 'ok',
      todo: spanishReady && !spanishDialed ? 'Nobody is dialing Spanish: ' + spanishReady + ' Spanish patients are waiting.' : '',
      more: '<p>Patients ready to dial, by list:</p>' + pairs(D.lists.map(function(x){ return {a: x.name, b: x.ready == null ? '–' : x.ready.toLocaleString()}; }), 'a', 'b') +
        (D.queues.length ? '<p>Calls today, by list (calls / reached):</p>' + pairs(D.queues.slice(0, 10).map(function(q){ return {a: q.queue, b: q.dialed + ' / ' + q.reached}; }), 'a', 'b') : '')}]);
    if (spanishReady && !spanishDialed) now.push(['s-dialer', spanishReady + ' Spanish patients waiting', 'someone must dial Spanish']);

    // 7. Closest to paying
    steps.push(['s-pipe', {
      name: '7. Closest to paying', big: Pi.invoices,
      line: Pi.invoices + ' unpaid retainer invoices · ' + Pi.quotes.toLocaleString() + ' open quotes',
      tone: 'ok',
      todo: 'About 1 in 2 invoices and 1 in 8 quotes pay. Reps follow up from My Day.',
      more: '<p>From the last 30 days.</p>'}]);

    // 8. Automation (for checking the robots)
    steps.push(['s-auto', {
      name: '8. What the system did', big: A.bookedToday,
      line: A.bookedToday + ' calls booked and ' + A.cancelledToday + ' cancelled automatically today',
      tone: 'ok', todo: '',
      more: '<p>Calls booked, by what booked them:</p>' + pairs((A.byFamily || []).map(function(f){ return {a: f.family, b: f.n}; }), 'a', 'b')}]);

    var h = '<div class="now"><h2>Needs attention now</h2>' + (now.length ? '<ol>' + now.map(function(x){
      return '<li><a href="#' + x[0] + '" data-go="' + x[0] + '">' + esc(x[1]) + '</a> <span>· ' + esc(x[2]) + '</span></li>'; }).join('') + '</ol>' : '<p class="clear">Nothing urgent. The flow is on plan.</p>') + '</div>';
    h += steps.map(function(s){ return step(s[0], s[1]); }).join('');
    document.getElementById('body').innerHTML = h;
  }
  document.addEventListener('click', function(e){
    var go = e.target.closest('[data-go]');
    if (go) { e.preventDefault(); var id = go.getAttribute('data-go'); OPEN[id] = true; var el = document.getElementById(id); if (el) { el.classList.add('open'); el.scrollIntoView({block: 'start', behavior: 'smooth'}); } return; }
    var sh = e.target.closest('[data-step]');
    if (sh) { var sid = sh.getAttribute('data-step'); OPEN[sid] = !OPEN[sid]; sh.parentNode.classList.toggle('open', !!OPEN[sid]); }
  });
  function load(fresh){
    fetch('/flow/api/summary' + (fresh ? '?fresh=1' : ''), {credentials: 'same-origin'})
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d.error) throw new Error(d.error); render(d); })
      .catch(function(){ document.getElementById('body').innerHTML = '<p class="err">The flow could not be read just now. Trying again in a minute.</p>'; setTimeout(load, 60000); });
  }
  load();
  setInterval(function(){ if (!document.hidden) load(); }, 120000);
  document.addEventListener('click', function(e){ if (e.target.closest('[data-refresh]')) { document.getElementById('asof').textContent = 'Refreshing…'; load(true); } });
})();
</script>
