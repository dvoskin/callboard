<style>
  /* One team per section, titled the way the Billing & Surgical Coordinator
     Dashboard titles its boards: a plain bold heading, one muted line under
     it, a rule between teams. */
  .tb-sec{margin-top:24px;padding-top:18px;border-top:1px solid var(--rule)}
  .tb-sec.first{margin-top:12px;padding-top:0;border-top:0}
  .tb-sec .bt{font-size:17px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em;color:var(--ink);text-transform:none}
  .tb-sec>.sub{margin:0 0 8px}
  .tb-sec>.sub a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule)}
  .tb-sec>.sub a:hover{color:var(--up);border-color:var(--up)}
  .tb-sec>.sub .sep{opacity:.45;padding:0 5px}
  .tb-head{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .tb-sec .bt.tb-tog{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;margin:0;-webkit-user-select:none;user-select:none}
  .tb-sec .bt.tb-tog:focus-visible{outline:2px solid var(--up);outline-offset:3px;border-radius:3px}
  .tb-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tb-sec .chev{display:inline-flex;align-items:center;justify-content:center;flex:0 0 18px;width:18px;height:18px;border-radius:4px;
                font-size:12px;line-height:1;color:var(--muted);background:var(--tint);transition:transform .15s}
  .tb-sec.collapsed .chev{transform:rotate(-90deg)}
  .tb-open{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 0 4px 8px;white-space:nowrap}
  .tb-open:hover{color:var(--up)}
  .tb-sec>.tb-sub{margin:3px 0 10px;padding-left:26px;font-size:12px}
  .tb-sec.collapsed>.tb-sub{margin-bottom:0}
  .tb-sec.collapsed .tb-body{display:none}
  .tb-hl{display:none;margin:4px 0 0;padding-left:26px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .tb-hl b{color:var(--ink);font-weight:700} .tb-hl b.hot{color:var(--dn)} .tb-hl .sep{opacity:.45;padding:0 5px}
  .tb-sec.collapsed .tb-hl{display:block}
  .tb-stats{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 12px;margin:10px 0 2px;padding-left:26px}
  .tb-sec.collapsed .tb-stats{display:grid}
  .tb-stats div{display:flex;flex-direction:column;gap:1px;min-width:0}
  .tb-stats b{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-stats b.hot{color:var(--dn)}
  .tb-stats span{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
                 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* summary: a label column wide enough for TARGET / RESULT */
  .tb-sec .sum{padding:8px 0 7px}
  .tb-sec .sum .srow{grid-template-columns:62px minmax(0,1fr);gap:0 10px;padding:2px 0;line-height:1.45}
  /* rows and their detail */
  .tb-sec .r{padding:9px 0}
  .tb-sec .nm .press,.tb-sec .nm .unr{margin-top:2px}
  .tb-sec .nm .prog{margin-top:6px}
  .tb-sec .det{padding:12px 0 14px 22px}
  .tb-sec .dg{gap:12px 18px;max-width:560px}
  .tb-sec .dg em{margin-bottom:2px}
  .tb-sec .dg b{font-size:13px}
  .tb-sec .dg b i{font-size:11.5px;font-weight:400;color:var(--muted)}
  .tb-sec .ml{margin-top:12px}
  .nm .qn{display:block;margin-top:2px;font-size:11.5px;font-weight:400;color:var(--muted)}
  details.tb-notes{margin-top:12px}
  /* the coordinators' progress hairline, as on their own board */
  .nm .prog{display:block;height:3px;max-width:240px;margin-top:4px;border-radius:2px;background:var(--hair);overflow:hidden}
  .nm .prog i{display:block;height:100%;border-radius:2px}
  .flr .mk{color:var(--muted)}
  /* panel values that carry a target line wrap instead of running off a phone */
  .tb-sec .dg b{white-space:normal;line-height:1.35}
  .tb-sec .dg b i{margin-left:0}
  .tb-sec .dg b i.hot{color:var(--dn)}
  details.tb-notes .note{margin:6px 0 0}
  details.tb-notes{border-top:1px solid var(--hair);padding-top:9px}
  details.tb-notes>summary{padding:2px 0}
  @media(max-width:560px){
    .tb-sec{margin-top:0;padding:14px 0 12px;border-top:1px solid var(--rule)}
    .tb-sec.first{margin-top:4px;padding-top:6px;border-top:0}
    .tb-sec .bt{font-size:16px}
    .tb-sec>.tb-sub{padding-left:26px;margin:2px 0 8px;font-size:11.5px}
    .tb-stats{gap:4px 8px;margin-top:9px}
    .tb-stats b{font-size:15px}
    .tb-stats span{font-size:9.5px}
    .tb-sec .sum{margin-top:2px;padding:7px 0 6px}
    .tb-sec .sum .srow{grid-template-columns:54px minmax(0,1fr);gap:0 8px;font-size:12px}
    .tb-sec .r{padding:8px 0;row-gap:3px}
    .tb-sec .det{padding:10px 0 12px 16px}
    .tb-sec .dg{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
    .tb-sec .dg b{font-size:12.5px}
    .tb-sec .dg b i{font-size:11px}
    .tb-sec .nm .prog{max-width:none;margin-top:5px}
    details.tb-notes{margin-top:8px;padding-top:8px}
    details.tb-notes .note{font-size:12px;line-height:1.5}
  }
  .q .hot,.rt .hot{color:var(--dn)}
  /* a seat not read yet: its own line, so the texts line never paints over it */
  .nm .unr{display:block;margin-top:1px;font-size:11px;font-weight:400;font-style:italic;letter-spacing:0;color:var(--muted);white-space:normal}
</style>
<script>
// One team, one table, in the sales board's own design (the classes in
// _board_style.html). Used under the sales roster for the RingEX reps and on
// /teams for every team, so every team reads the same way. Danny, 2026-10-16:
// "all the teams on one combined page all the same design across each team
// type".
//
// A model is {key, label, href, sum: [[label, html]], colA, colB, aTitle,
// bTitle, nameHead, rows: [...], note}. A row is {name, talk (s), dials, over3,
// a: {html, zero, hot}, b: {...}, press (html), panel: [[label, html, zero]],
// missed: [...]}. Talk, dials and >3m carry an arrow against the team's own
// median rep; the two result columns do not.
window.TB = (function () {
  function hm(s) {
    s = Math.round(s || 0);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return h ? h + ':' + p(m) + ':' + p(x) : m + ':' + p(x);
  }
  function w(n) { return Math.round(n || 0); }
  // "10h 39m" / "42m": the folded figures' talk time, short enough for a phone
  function hmShort(sec) {
    var m = Math.round((sec || 0) / 60), h = Math.floor(m / 60);
    return h ? h + 'h ' + (m % 60) + 'm' : m + 'm';
  }
  function fmt(n) { return Math.round(n || 0).toLocaleString('en-US'); }
  function money(v) { return v == null ? '—' : '$' + Math.round(v).toLocaleString('en-US'); }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function median(xs) {
    xs = xs.slice().sort(function (a, b) { return a - b; });
    if (!xs.length) return 0;
    var m = Math.floor(xs.length / 2);
    return xs.length % 2 ? xs[m] : (xs[m - 1] + xs[m]) / 2;
  }
  // The floor: the median of the people who worked, not a target.
  function floorOf(rows) {
    var on = rows.filter(function (r) { return !r.unread && !r.quiet && (r.talk || r.dials); });
    return { talk: median(on.map(function (r) { return r.talk || 0; })),
             dials: median(on.map(function (r) { return r.dials || 0; })),
             over3: median(on.map(function (r) { return r.over3 || 0; })) };
  }
  function cell(v, med, cls, label) {
    var up = (v || 0) >= med;
    return '<span class="' + cls + ' ' + (up ? 'up' : 'down') + '"><span class="mk">' + (up ? '▲' : '▼') +
           '</span>' + w(v) + '<span class="lbl">' + label + '</span></span>';
  }
  // Graded against the KPI target instead of the team median -- the way the
  // Billing & Surgical Coordinator Dashboard marks its rows (Danny, 2026-10-16:
  // "Retain the same KPI and progress tracking on billers and surgical
  // coordinators as on the separated link"). Below the floor is red and down;
  // at or above target is up; between floor and target carries a quiet dot.
  function gcell(v, band, cls, label, html) {
    var m = band === 'below' ? ['down', '\u25BC'] : (band === 'target' || band === 'stretch') ? ['up', '\u25B2'] : band ? ['flr', '\u00b7'] : ['', ''];
    return '<span class="' + cls + (m[0] ? ' ' + m[0] : '') + '"' + (band ? ' title="' + esc(band === 'below' ? 'under the floor' : band === 'floor' ? 'between floor and target' : 'at or above target') + '"' : '') + '>' +
           (m[1] ? '<span class="mk">' + m[1] + '</span>' : '') + (html != null ? html : w(v)) + '<span class="lbl">' + label + '</span></span>';
  }
  function res(x, cls, label) {
    x = x || {};
    return '<span class="' + cls + (x.zero ? ' zero' : '') + '"' + (x.title ? ' title="' + esc(x.title) + '"' : '') + '>' +
           (x.hot ? '<b class="hot" style="font-weight:inherit">' + x.html + '</b>' : (x.html == null ? '—' : x.html)) +
           '<span class="lbl"> ' + esc(label) + '</span></span>';
  }
  function cell2(label, value, isZero) {
    return '<div' + (isZero ? ' class="zero"' : '') + '><em>' + esc(label) + '</em><b>' + value + '</b></div>';
  }
  // Missed inbound calls: the number to call back, or who got back and when.
  function missedList(L, open, self) {
    L = L || [];
    if (!L.length) return '';
    return '<div class="ml"><div class="ml-h">Missed calls · ' + (open || 0) + ' not called back</div>' +
      L.map(function (m) {
        var b = m.back || {};
        return '<div class="ml-r' + (m.resolved ? ' done' : '') + '"><span class="ml-t">' + esc(m.at) + '</span>' +
          (m.resolved
            ? '<span class="ml-n">' + esc(m.number) + '</span><span class="ml-s">' + esc(b.how || 'called back') + ' ' +
              esc(b.at || '') + (b.by && b.by !== self ? ' · ' + esc(b.by) : '') + '</span>'
            : '<a class="ml-n" href="tel:' + esc(String(m.number || '').replace(/[^0-9]/g, '')) + '">' + esc(m.number) +
              '</a><span class="ml-s hot">call back</span>') + '</div>';
      }).join('') + '</div>';
  }

  // Folded or not, per team, on this device. Memory first (a refresh must not
  // flip it), then localStorage, then the default: folded on a phone unless
  // the model says it opens there.
  var FOLD = {};
  function foldKey(m) { return 'tb-fold-' + (m.key || 'tb'); }
  function isCollapsed(m) {
    var k = foldKey(m);
    if (k in FOLD) return FOLD[k];
    var v = null;
    try { v = window.localStorage.getItem(k); } catch (e) { v = null; }
    if (v === '1' || v === '0') return (FOLD[k] = v === '1');
    var phone = !!(window.matchMedia && window.matchMedia('(max-width:560px)').matches);
    return (FOLD[k] = phone && !m.openOnPhone);
  }
  function remember(m, folded) {
    FOLD[foldKey(m)] = folded;
    try { window.localStorage.setItem(foldKey(m), folded ? '1' : '0'); } catch (e) { /* private mode: memory only */ }
  }

  function render(el, m) {
    if (!el) return;
    // A seat RingEX has not been read for yet is "not known", never zero: it
    // sorts last, carries no arrows and no figures, and says so under the name.
    var rows = (m.rows || []).slice().sort(function (a, b) {
      return (a.unread ? 2 : a.quiet ? 1 : 0) - (b.unread ? 2 : b.quiet ? 1 : 0) || (b.talk || 0) - (a.talk || 0) || (b.dials || 0) - (a.dials || 0);
    });
    var f = m.floor || floorOf(rows), k = m.key || 'tb';
    el.classList.add('tb-sec');
    // Collapsible: tap the title. A phone starts with every team but the
    // first folded (Danny, 2026-10-16: "make teams collapsible maybe on mobile
    // for easier use"); a folded team still shows its one-line headline. The
    // choice is remembered per team on this device.
    var col = isCollapsed(m);
    el.classList.toggle('collapsed', col);
    // The title row: arrow + title (the fold control), the team's own board
    // on the right. Under it one short muted line, then -- folded only -- four
    // figures in a row, value over label, so a folded team still answers
    // "how is it going" at a glance on a phone.
    var head = '<div class="tb-head">' +
               '<h2 class="bt tb-tog" role="button" tabindex="0" aria-expanded="' + (!col) + '">' +
               '<span class="chev" aria-hidden="true">▾</span><span class="tb-t">' + esc(m.label) + '</span></h2>' +
               (m.href ? '<a class="tb-open" href="' + esc(m.href) + '">Open ↗</a>' : '') + '</div>' +
               (m.sub ? '<p class="sub tb-sub">' + m.sub + '</p>' : '') +
               (m.stats && m.stats.length
                 ? '<div class="tb-stats">' + m.stats.map(function (x) {
                     return '<div><b' + (x[2] ? ' class="hot"' : '') + '>' + x[0] + '</b><span>' + esc(x[1]) + '</span></div>';
                   }).join('') + '</div>'
                 : (m.headline ? '<p class="tb-hl">' + m.headline + '</p>' : ''));
    var h = '';
    if (m.error) {
      h = '<div class="msg err">' + m.error + '</div>';
    } else if (!rows.length) {
      h = '<div class="msg">' + (m.empty || 'No one on this team has a call in this window.') + '</div>';
    } else {
      if (m.sum && m.sum.length) {
        h += '<div class="sum">' + m.sum.map(function (s) {
          // a number keeps its word: lines break at the separators, never between "12" and "\u22652m"
        return '<div class="srow"><span class="sl">' + esc(s[0]) + '</span><span class="sv">' + String(s[1]).replace(/<\/b> /g, '</b>\u00a0') + '</span></div>';
        }).join('') + '</div>';
      }
      h += '<div class="hd"><span class="a-rk"></span><span class="a-nm">' + esc(m.nameHead || 'Name') + '</span>' +
           '<span class="a-tk">Talk</span><span class="a-d">' + esc(m.dialsHead || 'Dials') + '</span>' +
           '<span class="a-t3">' + (m.t3Head || '&gt;3m') + '</span>' +
           '<span class="a-q"' + (m.aTitle ? ' title="' + esc(m.aTitle) + '"' : '') + '>' + esc(m.colA) + '</span>' +
           '<span class="a-rt"' + (m.bTitle ? ' title="' + esc(m.bTitle) + '"' : '') + '>' + esc(m.colB) + '</span></div>';
      rows.forEach(function (r, i) {
        if (r.quiet) {
          // On the live day a seat with no calls yet is one quiet line, the
          // way the coordinators' and billers' own board shows it; their Zoho
          // figures still stand.
          h += '<div class="r" role="button" tabindex="0" aria-expanded="false" data-det="' + k + '-d' + i + '"><span class="rk">' + (i + 1) + '</span>' +
               '<span class="nm" data-name="' + esc(r.name) + '">' + esc(r.name) + '<span class="qn">no calls yet today</span>' + (r.press || '') + '</span>' +
               '<span class="tk zero">\u2014</span><span class="d"></span><span class="t3"></span>' +
               res(r.a, 'q', m.aLbl || m.colA) + res(r.b, 'rt', m.bLbl || m.colB) + '</div>';
          h += '<div class="det" id="' + k + '-d' + i + '"><div class="dg">' +
               (r.panel || []).map(function (p) { return p === 'rule' ? '<span class="rule"></span>' : cell2(p[0], p[1], p[2]); }).join('') +
               '</div>' + missedList(r.missed, r.missedOpen, r.name) + '</div>';
          return;
        }
        if (r.unread) {
          var dash = function (cls) { return '<span class="' + cls + ' zero">—</span>'; };
          h += '<div class="r"><span class="rk">' + (i + 1) + '</span><span class="nm" data-name="' + esc(r.name) + '">' + esc(r.name) +
               '<span class="unr">not read yet · RingEX fills this in within a few minutes</span></span>' +
               dash('tk') + dash('d') + dash('t3') + dash('q') + dash('rt') + '</div>';
          return;
        }
        var up = (r.talk || 0) >= f.talk;
        var low = m.grade ? (r.g || {}).talk === 'below'
                          : (r.talk || 0) < f.talk && (r.dials || 0) < f.dials && (r.over3 || 0) < f.over3;
        h += '<div class="r' + (low ? ' low' : '') + '" role="button" tabindex="0" aria-expanded="false" data-det="' + k + '-d' + i + '">' +
             '<span class="rk">' + (i + 1) + '</span>' +
             '<span class="nm" data-name="' + esc(r.name) + '">' + esc(r.name) + (r.press || '') + '</span>' +
             (m.grade
               ? gcell(0, (r.g || {}).talk, 'tk', '', hm(r.talk)) +
                 gcell(r.dials, (r.g || {}).dials, 'd', m.dialsLbl || ' calls') + gcell(r.over3, (r.g || {}).over3, 't3', m.t3Lbl || ' long')
               : '<span class="tk ' + (up ? 'up' : 'down') + '"><span class="mk">' + (up ? '\u25B2' : '\u25BC') + '</span>' + hm(r.talk) + '</span>' +
                 cell(r.dials, f.dials, 'd', m.dialsLbl || ' dials') + cell(r.over3, f.over3, 't3', ' >3m')) +
             res(r.a, 'q', m.aLbl || m.colA) + res(r.b, 'rt', m.bLbl || m.colB) + '</div>';
        h += '<div class="det" id="' + k + '-d' + i + '"><div class="dg">' +
             (r.panel || []).map(function (p) { return p === 'rule' ? '<span class="rule"></span>' : cell2(p[0], p[1], p[2]); }).join('') +
             '</div>' + missedList(r.missed, r.missedOpen, r.name) + '</div>';
      });
      if (m.note) h += '<p class="note">' + m.note + '</p>';
    }
    // What the section's numbers are, where they come from and how far
    // behind they can run (Danny, 2026-10-16: "add page notes for each
    // section about delays and what each means").
    if (m.notes && m.notes.length) {
      h += '<details class="notes tb-notes"><summary>Notes</summary>' +
           m.notes.map(function (p) { return '<p class="note">' + p + '</p>'; }).join('') + '</details>';
    }
    el.innerHTML = head + '<div class="tb-body">' + h + '</div>';
    var tog = el.querySelector('.tb-tog'), row0 = el.querySelector('.tb-head');
    if (tog && row0) {
      var flip = function () {
        var now = !el.classList.contains('collapsed');
        el.classList.toggle('collapsed', now);
        tog.setAttribute('aria-expanded', String(!now));
        remember(m, now);
      };
      row0.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('a')) return; flip(); });
      tog.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    }
    if (m.error || !rows.length) return;
    el.querySelectorAll('.r[data-det]').forEach(function (row) {
      var open = function () {
        var d = document.getElementById(row.getAttribute('data-det'));
        if (!d) return;
        var was = d.classList.contains('on');
        document.querySelectorAll('.det.on').forEach(function (o) { o.classList.remove('on'); });
        document.querySelectorAll('.r[aria-expanded="true"]').forEach(function (x) { x.setAttribute('aria-expanded', 'false'); });
        if (!was) { d.classList.add('on'); row.setAttribute('aria-expanded', 'true'); }
      };
      row.addEventListener('click', open);
      row.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });
  }

  // The RingEX reps (/api/v5/ringex) as a model: the sales columns, Quotes and
  // Paid from Books, the same panel the RingCX reps have where the data exists.
  function ringexModel(d, opts) {
    opts = opts || {};
    var bm = (d.meta || {}).books || {}, booksOk = !bm.loading;
    var rows = (d.ranked || []).map(function (a) {
      var b = a.books || {};
      return {
        name: a.name, talk: a.talk, dials: a.attempts, over3: a.over_3,
        unread: a.complete === false && !a.talk && !a.attempts && !a.inbound,
        a: { html: booksOk ? w(b.quotes_sent) : '—', zero: booksOk && !b.quotes_sent },
        b: { html: booksOk ? w(b.retainers_paid) : '—', zero: booksOk && !b.retainers_paid },
        press: opts.press ? opts.press(a) : pressMissed(a.missed_open),
        missed: a.missed_calls, missedOpen: a.missed_open,
        panel: [
          ['Inbound', w(a.inbound) + ' <i>' + w(a.inbound_answered) + ' answered</i>', !a.inbound],
          ['Outbound', w(a.attempts), !a.attempts],
          ['Over 10 min', w(a.over_10), !a.over_10],
          ['Longest', hm(a.longest), !a.longest],
          ['First call', a.first ? esc(a.first) + (a.late_minutes ? ' <i>' + w(a.late_minutes) + ' min late</i>' : '') : '—', !a.first],
          'rule',
          ['Quotes invoiced', booksOk ? w(b.quotes_invoiced) : '—', !b.quotes_invoiced],
          ['Retainers sent', booksOk ? w(b.retainers_sent) : '—', !b.retainers_sent],
          ['Paid $', b.paid_amount ? money(b.paid_amount) : '—', !b.paid_amount]
        ].concat(opts.panelExtra ? opts.panelExtra(a) : [])
      };
    });
    // Nobody read yet (a restart): say so rather than print a team of zeros.
    var allUnread = rows.length && rows.every(function (r) { return r.unread; });
    var T = d.totals || {}, S = function (k) { return (d.ranked || []).reduce(function (s, a) { return s + ((a.books || {})[k] || 0); }, 0); };
    return {
      key: opts.key || 'rx', label: opts.label || d.label || 'Sales Training Class', href: opts.href,
      sub: opts.sub != null ? opts.sub : rows.length + ' rep' + (rows.length === 1 ? '' : 's') + ' \u00b7 dialing from RingEX' +
           (rows.filter(function (r) { return r.unread; }).length && !allUnread
             ? ' \u00b7 ' + rows.filter(function (r) { return r.unread; }).length + ' not read yet' : ''),
      openOnPhone: !!opts.openOnPhone,
      headline: allUnread ? 'not read yet' :
        '<b>' + hm(T.talk) + '</b> talk<span class="sep">·</span><b>' + fmt(T.attempts) + '</b> dials' +
        '<span class="sep">·</span><b>' + fmt(T.over_3) + '</b> over 3m' +
        (booksOk ? '<span class="sep">·</span><b>' + fmt(S('quotes_sent')) + '</b> quotes' : '') +
        (T.missed_open ? '<span class="sep">·</span><b class="hot">' + fmt(T.missed_open) + '</b> missed' : ''),
      notes: opts.notes || TRAINING_NOTES,
      stats: allUnread ? [['\u2014', 'not read yet']] : [[hmShort(T.talk), 'talk'], [fmt(T.attempts), 'dials'], [fmt(T.over_3), 'over 3m'],
             [booksOk ? fmt(S('quotes_sent')) : '\u2014', 'quotes']],
      colA: 'Quotes', colB: 'Paid', aLbl: 'quotes', bLbl: 'paid', nameHead: 'Rep',
      aTitle: 'Quotes sent in this window (Books)', bTitle: 'Retainers paid in full in this window (Books)',
      rows: rows,
      sum: allUnread ? [['Team', '<i>not read yet \u00b7 RingEX fills this in within a few minutes</i>']] : [
        ['Team', '<b>' + hm(T.talk) + '</b> talk<span class="sep">·</span><b>' + fmt(T.attempts) + '</b> dials' +
                 '<span class="sep">·</span><b>' + fmt(T.over_3) + '</b> &gt;3m<span class="sep">·</span><b>' + fmt(T.over_10) + '</b> &gt;10m'],
        ['Sent', booksOk ? '<b>' + fmt(S('quotes_sent')) + '</b> quotes<span class="sep">·</span><b>' + fmt(S('retainers_sent')) +
                 '</b> retainers<span class="sep">·</span><b>' + fmt(S('retainers_paid')) + '</b> paid' +
                 (S('paid_amount') ? ' <i>' + money(S('paid_amount')) + '</i>' : '') : 'loading from Books…'],
        ['Calls', '<b>' + fmt(T.inbound) + '</b> inbound <i>' + fmt(T.inbound_answered) + ' answered</i>' +
                  '<span class="sep">·</span><b>' + fmt(T.attempts) + '</b> outbound' +
                  (T.missed_open ? '<span class="sep">·</span><b class="hot">' + fmt(T.missed_open) + '</b> missed not called back' : '')]
      ],
      note: opts.note
    };
  }
  var MARKS = '<b>Marks.</b> ▲▼ compare each person with the median person on the same team, not a target. ' +
              'A red name is below that median on talk, dials and >3m together. “missed” under a name is an inbound call ' +
              'that rang out and has not been returned yet; tap the row for the numbers.';
  var TRAINING_NOTES = [
    '<b>Where.</b> Each rep’s own RingEX extension. The training class dials from RingEX, not RingCX, so the Sales Floor never shows them.',
    '<b>Delay.</b> A background job reads one rep every 30 seconds, so each rep is at most about 5 minutes behind. A reading older than ' +
      '15 minutes shows as “not read yet”, and so does every rep for a few minutes after the board restarts. That means not known, not zero. ' +
      'Quotes and Paid come from Books and refresh every 5 minutes.',
    '<b>Columns.</b> Talk is time on connected calls; on RingEX that includes voicemail drops, so >3m (calls over 3 minutes) is the better count ' +
      'of real conversations. Dials are outbound calls. Quotes are quotes sent in Books in this window. Paid is retainers paid in full in this window.',
    MARKS
  ];

  function pressMissed(n) {
    return n ? '<span class="press"><b class="hot">' + w(n) + '</b> missed</span>' : '';
  }

  return { render: render, ringexModel: ringexModel, MARKS: MARKS, hmShort: hmShort, hm: hm, w: w, fmt: fmt, money: money, esc: esc,
           median: median, floorOf: floorOf, pressMissed: pressMissed };
})();
</script>
