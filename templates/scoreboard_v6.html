<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>{{ landing_title or page_title or 'Team KPI Board' }}</title>
<style>
  :root{
    --bg:#FFFFFF; --tint:#F6F8F8; --rule:#E3E9E8; --hair:#EFF3F2;
    --ink:#131C1B; --ink-2:#4A5957; --muted:#7C8B89;
    /* --up is interaction only (focus, hover). --dn is the ONLY colour the
       data uses, and it means one thing: under the floor. */
    --up:#0B6E67; --dn:#B03A31;
    --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    /* Spacing scales with the viewport instead of stepping at one breakpoint.
       The board is read on a 375px phone and a 1400px monitor and everything in
       between; fixed paddings meant a 559px window used phone spacing and a
       561px window jumped to desktop spacing mid-drag. */
    --pad-x:clamp(11px, 3.4vw, 24px);      /* page gutter */
    --pad-y:clamp(14px, 2.4vw, 32px);      /* space above the title */
    --row-y:clamp(7px, 1.1vw, 10px);       /* row breathing room */
    --gap-x:clamp(8px, 2.4vw, 16px);       /* between columns */
    --gap-s:clamp(5px, 1.4vw, 9px);        /* between small controls */
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#101614; --tint:#161E1C; --rule:#26302E; --hair:#1C2523;
    --ink:#EDF2F1; --ink-2:#BCC9C7; --muted:#849492;
    --up:#4FCCBF; --dn:#EE8177;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
       -webkit-text-size-adjust:100%}
  .wrap{max-width:820px;margin:0 auto;
        padding:var(--pad-y) var(--pad-x) calc(var(--pad-y) + 24px)}

  h1{margin:0 0 2px;font-size:19px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
  .sub b{color:var(--ink);font-weight:600}
  h2{margin:22px 0 6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;
     text-transform:uppercase;color:var(--muted)}

  .ctl{display:flex;flex-wrap:wrap;gap:var(--gap-s);align-items:center;
       margin-bottom:var(--gap-x)}
  .ctl input,.ctl button{font-family:inherit;font-size:12.5px;padding:4px 8px;
       border:1px solid var(--rule);background:var(--bg);color:var(--ink);
       border-radius:5px;-webkit-appearance:none}
  .ctl button{cursor:pointer;font-weight:600}
  .ctl button:hover{border-color:var(--up);color:var(--up)}
  .ctl button:focus-visible,.day:focus-visible,.r:focus-visible{outline:2px solid var(--up);
       outline-offset:2px}
  .day{cursor:pointer;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:5px;
       border:1px solid var(--rule);background:var(--bg);color:var(--muted)}
  .day:hover{border-color:var(--up);color:var(--up)}
  .day.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .spin{font-size:12.5px;color:var(--muted)}

  .floor{font-size:12.5px;color:var(--muted);padding:8px 0;border-top:1px solid var(--rule)}
  .floor b{color:var(--ink);font-weight:700}
  .floor .sep{opacity:.45;padding:0 5px}

  /* KPI legend */
  .key{display:flex;flex-wrap:wrap;gap:2px var(--gap-x);font-size:11px;
       color:var(--muted);padding:0 0 7px;border-bottom:1px solid var(--rule);
       line-height:1.5}
  .key span{white-space:nowrap}
  .key i{font-style:normal;font-weight:700}
  .key .b-below{color:var(--dn)}
  .key.coll{border-bottom:0;padding-top:6px;padding-bottom:0}
  .key.coll b{color:var(--ink);font-weight:600}

  /* the list
     Four layouts, because two independent flags each add a column: a LIVE day
     adds pace, and billing adds collected. Every combination needs its own
     areas -- `.live .r` used to be declared after `.hascoll .r` and win, which
     left `co` with no area at all, so it auto-placed into the ">2m" cell and
     the two numbers printed on top of each other. That was true on the desktop
     grid as well as the phone one. Most specific last, always. */
  .hd,.r{display:grid;align-items:center;
         grid-template-columns:22px minmax(0,1fr) 86px 62px;
         grid-template-areas:"rk nm tk c"}
  .live .hd,.live .r{grid-template-columns:20px minmax(0,1fr) 76px 82px 52px;
         grid-template-areas:"rk nm tk pc c"}
  .hascoll .hd,.hascoll .r{grid-template-columns:22px minmax(0,1fr) 80px 54px 84px;
         grid-template-areas:"rk nm tk c co"}
  .live.hascoll .hd,.live.hascoll .r{
         grid-template-columns:20px minmax(0,1fr) 68px 74px 44px 76px;
         grid-template-areas:"rk nm tk pc c co"}
  /* a live board without the pace column: the plain four-column grid */
  .live.nopace .hd,.live.nopace .r{grid-template-columns:20px minmax(0,1fr) 86px 62px;
         grid-template-areas:"rk nm tk c"}
  .live.nopace.hascoll .hd,.live.nopace.hascoll .r{
         grid-template-columns:20px minmax(0,1fr) 80px 54px 84px;
         grid-template-areas:"rk nm tk c co"}
  .a-co{grid-area:co} .co{grid-area:co}
  /* SMS rides in the NAME cell, not a column of its own. The grid already has
     two optional columns (pace, collected) and every combination needs its own
     explicit areas -- a missing one silently printed two numbers on top of each
     other once. A third binary would mean eight desktop and eight phone
     declarations to get wrong. The name cell exists in all of them. */
  .bd+.bd{margin-top:34px;padding-top:22px;border-top:1px solid var(--rule)}
  .bd:first-child{margin-top:6px}
  /* Plain, by request: black on white, nothing else. */
  .bt{font-size:17px;font-weight:700;margin:0 0 2px;letter-spacing:0;color:#000;background:#fff;padding:0;
      text-transform:none}
  .bd .sub{margin:0 0 10px}
  .pz{margin-left:7px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;
      border:1px solid currentColor;white-space:nowrap;vertical-align:1px;letter-spacing:0}
  /* One vocabulary on every table, whichever platform the seat is read from:
     On a Call / Ringing / On Hold / Available / Busy / Do Not Disturb /
     Offline / Not Read. Same pill, same colour for the same word. */
  .pz-on_call{color:#166534;background:#dcfce7;border-color:#86efac}
  .pz-ringing{color:#854d0e;background:#fef9c3;border-color:#fde047}
  .pz-on_hold{color:#854d0e;background:#fef9c3;border-color:#fde047}
  .pz-idle{color:#1d4ed8;background:#dbeafe;border-color:#93c5fd}
  .pz-busy{color:#9a3412;background:#ffedd5;border-color:#fdba74}
  .pz-dnd{color:#9a3412;background:#ffedd5;border-color:#fdba74}
  .pz-offline{color:var(--muted);background:transparent}
  /* The quiet states: not due yet, finished, or due and silent. Muted, not
     alarming -- none of them is a problem by itself. */
  .pz-lunch,.pz-break{color:#9a3412;background:#ffedd5;border-color:#fdba74}
  .pz-wrap{color:#854d0e;background:#fef9c3;border-color:#fde047}
  .pz-other{color:var(--muted);background:transparent}
  .pz-before_shift{color:var(--muted);background:transparent;border-style:dashed}
  .pz-after_shift{color:var(--muted);background:transparent;border-style:dashed}
  .pz-no_activity{color:#9a3412;background:transparent;border-style:dashed}
  /* Not Read is deliberately the dullest thing on the row: it is the absence of
     a fact, and it must not compete with the states that ARE facts. */
  .pz-unknown{color:var(--muted);background:transparent;font-weight:400;font-style:italic}
  /* A seat with no calls yet today, on the live day: one quiet line, not a
     row of zeros the eye has to read past. Expands like any other row. */
  .r.r-quiet{display:flex;align-items:center;gap:10px;min-height:0;padding:5px 0;
             border-top:1px solid var(--hair);color:var(--muted)}
  .r.r-quiet .rk{width:22px;flex:none}
  .r.r-quiet .nm{flex:1 1 auto;color:var(--ink-2)}
  .r.r-quiet .qn{font-size:12px;font-style:italic;white-space:nowrap}
  /* The live strip: four counts a supervisor glances at before anything else,
     and the one caption that says how fresh each half is. */
  .now{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;margin:4px 0 10px;
       padding:8px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .now .nw{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .now .nw b{font-size:17px;color:var(--ink);margin-right:5px;font-variant-numeric:tabular-nums}
  .now .nw.on b{color:#166534}
  .now .cap{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
  /* A framed board from another app: full width, tall enough to use, no
     chrome of its own beyond the hairline every section has. */
  /* The other app's board is a LINK, not a frame. Danny, 2026-10-07: "make
     the Distribution chart a linked thing, not an iframe, it's adding
     clutter". One line, in the section's own style, opens it in a new tab. */
  .lnkrow{margin:0;font-size:13px}
  .lnkrow a{color:var(--ink);font-weight:600;text-decoration:none;
            border-bottom:1px solid var(--rule)}
  .lnkrow a:hover,.lnkrow a:focus-visible{color:var(--up);border-color:var(--up)}
  .lnkrow .arr{color:var(--muted);font-weight:400;margin-left:4px}
  /* one coordinator's own page: no team strip, no rank number, the row
     reads as a heading over its open panel */
  .agent .rk,.agent .hd .a-rk{visibility:hidden}
  .agent .r[aria-expanded="true"]{background:transparent}
  .agent .qhd{display:none}
  /* The pills' two honest limits, under the strip they qualify. */
  .disc{font-size:10.5px;color:var(--muted);margin:-4px 0 8px;line-height:1.4}
  .disc b{color:var(--ink-2);font-weight:600}
  /* Quiet seats sit under their own faint heading, after the ranked rows. */
  .qhd{margin:14px 0 2px;font-size:10.5px;font-weight:700;letter-spacing:.08em;
       text-transform:uppercase;color:var(--muted)}
  /* The expand panel in three short groups rather than one list. */
  .det .grp{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
            color:var(--muted);margin:10px 0 3px}
  .det .col > .g:first-child .grp{margin-top:0}
  .det .grp[title]{cursor:help}
  /* a label with a definition behind it: a dotted cue, nothing louder */
  .ln .lb[title]{cursor:help;text-decoration:underline dotted;text-decoration-color:var(--rule);
                 text-underline-offset:3px}
  /* surgery readiness: the three reasons as small chips under the count */
  .rd{display:flex;flex-wrap:wrap;gap:4px 6px;margin:1px 0 4px 0;padding-left:calc(92px + var(--gap-x))}
  .rd .rc{font-size:11px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;
          padding:1px 8px;white-space:nowrap;cursor:help}
  .rd .rc b{color:var(--ink);font-weight:700}
  .rd .rc.hot{border-color:var(--dn);color:var(--dn)} .rd .rc.hot b{color:var(--dn)}
  .rd a.rc{text-decoration:none} .rd a.rc:hover{background:var(--tint)}
  /* a link into Zoho, inside a line's tail */
  .zl{color:var(--up);text-decoration:none;border-bottom:1px solid var(--hair);white-space:nowrap}
  .zl:hover{border-color:var(--up)}
  /* Data notes fold behind one line; the table is what the page is for. */
  details.notes{margin:12px 0 4px}
  details.notes>summary{cursor:pointer;font-size:11.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);list-style:none;display:flex;gap:8px;align-items:center}
  details.notes>summary::-webkit-details-marker{display:none}
  details.notes>summary::before{content:'\25B8';font-size:10px}
  details.notes[open]>summary::before{content:'\25BE'}
  details.notes .warn{font-size:12px;padding:6px 9px;margin:6px 0}
  details.subfold{margin:-4px 0 8px}
  details.subfold .sub{margin:6px 0 0;font-size:12px}
  /* Listen · Whisper: two muted words after the pill, underlined on hover. */
  .mon{margin-left:8px;font-size:11px;color:var(--muted);white-space:nowrap}
  .mon a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--hair)}
  .mon a:hover{color:var(--up);border-color:var(--up)}
  .sms{margin-left:7px;font-size:11px;font-weight:600;color:var(--muted);
       white-space:nowrap}
  .sms b{font-weight:700;color:var(--ink-2)}
  .sms-na{font-style:italic;font-weight:400}
  .live .hd>*{padding-left:6px}
  .live .hd .a-nm{padding-left:0}
  .a-pc{grid-area:pc} .pc{grid-area:pc;font-weight:700;font-size:12.5px}
  .pc .exp{display:block;font-weight:400;font-size:10px;color:var(--muted);
           line-height:1.25}
  .pc.early{color:var(--muted);font-weight:400}
  .asof{font-size:11px;color:var(--muted);padding:6px 0 0}
  .hd{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      color:var(--muted);padding:9px 0 5px;border-bottom:1px solid var(--rule);
      column-gap:var(--gap-x)}
  .r{padding:var(--row-y) 0;border-bottom:1px solid var(--hair);cursor:pointer;
     column-gap:var(--gap-x)}
  .r:last-child{border-bottom:0}
  .r:hover,.r[aria-expanded="true"]{background:var(--tint)}
  .hd>*,.r>*{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .hd .a-rk,.hd .a-nm,.r .rk,.r .nm{text-align:left}
  .a-rk{grid-area:rk} .a-nm{grid-area:nm} .a-tk{grid-area:tk} .a-c{grid-area:c}
  .a-cn{grid-area:cn} .a-lg{grid-area:lg}
  .rk{grid-area:rk;color:var(--muted);font-size:11px}
  .nm{grid-area:nm;font-weight:600;font-size:14px;letter-spacing:-.01em;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
  .tk{grid-area:tk;font-weight:700;font-size:14px}
  .c{grid-area:c} .cn{grid-area:cn} .lg{grid-area:lg}
  .c,.cn,.lg,.co{font-weight:600;color:var(--ink-2);font-size:12.5px}
  .lbl{display:none;color:var(--muted);font-weight:400}
  /* Four band colours meant four things to hold in your head while reading a
     column of numbers. Only one of them is a call to action, so only one is a
     colour: at floor or above reads as ordinary text, and under the floor is
     the single thing that stands out. */
  .b-stretch,.b-target,.b-floor{color:inherit}
  .b-below{color:var(--dn)}
  .r.r-below .nm{color:var(--dn)}

  /* expand panel */
  /* No tinted block. The panel is one row's detail, not a different kind of
     thing, and a filled panel under a list of hairlines reads as heavier than
     everything it explains. */
  .det{display:none;border-bottom:1px solid var(--hair);
       border-left:2px solid var(--rule);margin-left:2px;
       padding:var(--row-y) 0 calc(var(--row-y) + 4px) var(--gap-x)}
  .det.on{display:block}
  /* expand panel: a line per metric, no table and so nothing to scroll */
  /* Two columns of short blocks on a wide screen -- the phone/calls side and
     the CRM/texts side -- one column on a phone. Danny, 2026-10-08: "refine
     the layout and design of the existing expanded view so it is more
     digestible". */
  .lns{display:grid;grid-template-columns:minmax(0,1fr);gap:2px 32px;max-width:980px}
  .lns .col{display:flex;flex-direction:column;gap:3px;min-width:0}
  .lns .g{margin-bottom:4px}
  @media(min-width:760px){.lns{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .ln{display:flex;align-items:baseline;gap:var(--gap-x);font-size:12.5px;
      font-variant-numeric:tabular-nums}
  .ln .lb{flex:0 0 92px;color:var(--muted);white-space:nowrap}
  .ln .vl{flex:0 0 auto;min-width:52px;font-weight:700}
  /* the tail wraps: in two columns a clipped "on track for 154.6m · tar…"
     loses the one number it exists to show */
  .ln .tl{color:var(--muted);min-width:0;white-space:normal;line-height:1.35}
  .ln .tl b{color:var(--ink);font-weight:600}
  .foot{font-size:11px;color:var(--muted);padding-top:7px;margin-top:8px;
        line-height:1.5;max-width:520px}

  /* per-day bars inside the panel */
  /* grid-column was for the tile grid this panel used to be; it is a plain
     block now, and a stray grid property is a thing someone later has to prove
     inert. */
  .spark{margin-top:9px;padding-top:8px;border-top:1px solid var(--hair);max-width:560px}
  .spark .cap{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
              color:var(--muted);margin-bottom:5px}
  .bars{display:flex;align-items:flex-end;justify-content:flex-start;gap:2px;height:38px}
  .bars div{flex:1 1 0;min-width:3px;max-width:22px;background:var(--ink-2);
            border-radius:1px 1px 0 0;opacity:.5}
  .bars div.off{background:var(--muted);opacity:.3}
  .bars div:hover{opacity:1}

  /* a team whose calls are not on this platform at all */
  .blocked{background:var(--tint);border:1px solid var(--rule);
           border-left:2px solid var(--dn);
           padding:10px 13px;margin:0 0 12px;font-size:12.5px;line-height:1.55;
           color:var(--ink-2)}
  .blocked summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);
                   list-style:none}
  .blocked summary::-webkit-details-marker{display:none}
  .blocked summary::before{content:'\25B8  ';color:var(--dn);font-weight:700}
  .blocked[open] summary::before{content:'\25BE  '}
  .blocked summary b{color:var(--ink)}
  .blocked .bd{margin-top:8px}
  .blocked ul{margin:8px 0 0;padding-left:18px}
  .blocked li{margin-bottom:3px}

  .warn{font-size:12.5px;color:var(--ink-2);background:var(--tint);
        border-left:2px solid var(--rule);padding:8px 11px;margin:7px 0}
  .warn.bad{border-left-color:var(--dn)}
  .warn b{color:var(--ink)}
  .empty{color:var(--muted);font-size:12.5px;padding:16px 0}
  .err{color:var(--dn);font-size:12.5px;padding:14px 0;line-height:1.5}

  /* ── phones ────────────────────────────────────────────────
     Compact, not "mobile-styled". Two lines an agent: identity and the headline
     figure on the first, the supporting counts on the second. The earlier
     version gave the talk figure its own 26px line and cost three lines each,
     which fitted four agents on a screen -- fine for billing, useless for a
     six-person team you want to scan at a glance. */
  @media(max-width:560px){
    h1{font-size:17px}
    .sub{font-size:11px;line-height:1.45}

    .hd{display:none}
    /* Same four combinations as the desktop grid, in the same order, for the
       same reason. Collected gets its own line rather than a fifth cell on a
       375px screen: a dollar figure squeezed between two call counts is how it
       ended up printed over the ">2m" column in the first place. */
    /* The COLUMNS have to be restated on every selector, not just `.r`.
       A media query adds no specificity, so the desktop `.live .r` (0,2,0)
       outranks a phone `.r` (0,1,0) and the live board kept its seven-column
       desktop track list underneath four-column areas -- which collapsed the
       name to zero width and stacked the counts. Same trap as the missing `co`
       area, one level up: specificity, not source order, decides. */
    /* No rank column on a phone: the order down the screen already says it, and
       dropping it gives the second line the full width instead of an 18px
       indent it was only there to clear. */
    /* every live/collections variant is listed, or a more specific desktop
       rule keeps its four columns under three-column areas and the name
       lands in the 20px rank column -- "Judith / Merlo" wrapped at the
       space while the talk figure sat short of the right edge (2026-10-07). */
    .r,.live .r,.hascoll .r,.live.hascoll .r,.live.nopace .r,.live.nopace.hascoll .r{
      grid-template-columns:minmax(0,1fr) 60px 56px;
      row-gap:1px;
    }
    .r{grid-template-areas:"nm tk tk" "c  c  c"}
    .live .r{grid-template-areas:"nm tk pc" "c  c  c"}
    .hascoll .r{grid-template-areas:"nm tk tk" "c  c  c" "co co co"}
    .live.hascoll .r{grid-template-areas:"nm tk pc" "c  c  c" "co co co"}
    .live.nopace .r{grid-template-areas:"nm tk tk" "c  c  c"}
    .live.nopace.hascoll .r{grid-template-areas:"nm tk tk" "c  c  c" "co co co"}
    .r .rk{display:none}
    .co{text-align:left}
    /* "exp 104m" on every row is the same number the expand panel spells out in
       full. The percentage already carries the comparison. */
    .pc .exp{display:none}
    .r .rk{align-self:center;font-size:11px}
    .nm{font-size:14px;padding-right:0;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;align-self:center}
    .tk{font-size:14px;text-align:right;align-self:center;line-height:1.25}
    .tk .lbl{display:none}                 /* the column is obvious in context */
    .pc{text-align:right;font-size:12.5px;align-self:center;min-width:52px}
    .pc .exp{font-size:10px;line-height:1.2}
    /* counts on one quiet line, indented under the name. NO grid-column:auto --
       it overrides the named areas and auto-places all three into one cell, which
       renders as "CallsC79.463.4" stacked on top of each other. */
    .c,.cn,.lg,.co{text-align:left;font-size:11px;font-weight:400;
               color:var(--muted);white-space:nowrap;overflow:hidden;
               text-overflow:ellipsis}
    .c b,.cn b,.lg b,.co b{color:var(--ink);font-weight:600}
    .lbl{display:inline;color:var(--muted);font-weight:400}

    .ln{font-size:11px}
    .ln .lb{flex-basis:72px;white-space:normal}
    .ln .vl{min-width:44px}
    .rd{padding-left:0}
    .foot{font-size:10px;line-height:1.5}

    .ctl{gap:5px;margin-bottom:9px}
    /* 16px exactly: iOS zooms the page when a focused input is smaller. */
    .ctl input{flex:1 1 40%;min-width:0;font-size:16px;padding:6px 7px}
    .ctl button{padding:6px 10px;font-size:12.5px}
    .day{padding:6px 11px;font-size:12.5px}
    .key{font-size:10px;gap:1px 9px;padding-bottom:6px}
    .warn{font-size:11px;padding:8px 10px;margin:5px 0}
    .blocked{font-size:12.5px;padding:11px 12px}
    h2{margin:16px 0 5px;font-size:11px}

    /* ── compact phone pass, 2026-10-07 ──────────────────────────
       Danny: "make the mobile optimized view clean and compacted and super
       user friendly minimal and compact". Everything that arrived after the
       phone layout was written -- pills, the live strip, quiet lines, the
       dashboard heading -- is sized here for a 375px screen. The rules of
       thumb: nothing truncates mid-word, nothing scrolls sideways except the
       preset row, and a row is two short lines. */
    h1{font-size:16px;margin-bottom:0}
    .bt{font-size:15px;margin:0}
    .bd+.bd{margin-top:18px;padding-top:12px}
    .bd:first-child{margin-top:2px}
    /* presets: one row that scrolls, not two that wrap */
    .ctl{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
         gap:6px;margin-bottom:6px;padding-bottom:2px;scrollbar-width:none}
    .ctl::-webkit-scrollbar{display:none}
    .day{flex:none;padding:5px 9px;font-size:12px}
    .ctl input{flex:1 1 42%;padding:5px 6px}
    /* the live strip: four tight counts, the caption on its own line */
    .now{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;
         gap:3px 12px;padding:6px 0;margin:2px 0 6px}
    .now .nw{font-size:11px}
    .now .nw b{font-size:15px;margin-right:4px}
    .now .cap{grid-column:1 / -1;margin-left:0;white-space:normal;font-size:10.5px;
              line-height:1.35}
    /* name + pills wrap; nothing is clipped mid-word */
    .nm{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3}
    .pz{font-size:10px;padding:1px 6px;margin-left:5px;vertical-align:0}
    /* On a phone a live call is a green dot after the name, nothing more, and
       Listen / Whisper are not offered (Danny, 2026-10-07: "Don't show listen
       whisper on mobile just show a green dot if they on the line"). The
       words stay in the markup for the tooltip and the desktop. */
    .mon{display:none}
    .pz.pz-on_call{font-size:0;line-height:0;width:9px;height:9px;padding:0;border:0;
                   border-radius:50%;background:#16a34a;display:inline-block;
                   vertical-align:middle;margin-left:6px;position:relative;top:-1px}
    /* the SMS arrows stay on phones, for every seat on both boards (Danny,
       2026-10-07 evening: "display the inbound outbound sms arrows for all
       agents across both rosters") -- small, after the name */
    .sms{font-size:10px;margin-left:5px;white-space:nowrap}
    .r{padding:6px 0}
    .tk{font-size:13.5px}
    .c,.co{font-size:10.5px}
    /* quiet lines: the note drops under the name when it is long */
    .r.r-quiet{flex-wrap:wrap;gap:2px 8px;padding:5px 0}
    .r.r-quiet .rk{display:none}
    .r.r-quiet .nm{flex:1 1 55%;font-size:13px}
    /* the note stays on the name's line when it fits, and only wraps under it
       when it does not -- "not read yet" alone does not need a line of its own */
    .r.r-quiet .qn{white-space:normal;font-size:10.5px;flex:1 1 auto;min-width:0;
                   text-align:right;line-height:1.35}
    .qhd{margin:10px 0 1px;font-size:10px}
    .key{font-size:10px;gap:1px 8px;padding-bottom:5px}
    .key.coll{padding-top:4px;font-size:10.5px}
    details.notes{margin:8px 0 2px}
    details.notes>summary{font-size:10.5px}
    details.subfold{margin:-2px 0 6px}
    details.subfold .sub{font-size:11px}
    .floor{font-size:10.5px;padding:6px 0;line-height:1.45}
    .blocked{font-size:11.5px;padding:8px 10px;margin-bottom:8px}
    .blocked .bd{margin-top:5px}
    .det{padding:6px 0 8px 8px}
    .det .grp{font-size:9.5px;margin:7px 0 2px}
    .disc{font-size:10px;margin:-2px 0 6px}
    .ln{gap:8px}
  }
  /* very narrow: the pace column drops, the rest keeps its shape */
  @media(max-width:340px){
    .r,.live .r{grid-template-areas:"nm tk tk" "c c c"}
    .hascoll .r,.live.hascoll .r{
      grid-template-areas:"nm tk tk" "c c c" "co co co"}
    .r,.live .r,.hascoll .r,.live.hascoll .r,.live.nopace .r,.live.nopace.hascoll .r{
      grid-template-columns:minmax(0,1fr) 54px 50px}
    .pc{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
