<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Billing Team KPI Board</title>
<style>
  :root{
    --bg:#FFFFFF; --tint:#F6F8F8; --rule:#E3E9E8; --hair:#EFF3F2;
    --ink:#131C1B; --ink-2:#4A5957; --muted:#7C8B89;
    /* --up is interaction only (focus, hover). --dn is the ONLY colour the
       data uses, and it means one thing: under the floor. */
    --up:#0B6E67; --dn:#B03A31;
    --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    /* Spacing scales with the viewport instead of stepping at one breakpoint.
       The board is read on a 375px phone and a 1400px monitor and everything in
       between; fixed paddings meant a 559px window used phone spacing and a
       561px window jumped to desktop spacing mid-drag. */
    --pad-x:clamp(11px, 3.4vw, 24px);      /* page gutter */
    --pad-y:clamp(14px, 2.4vw, 32px);      /* space above the title */
    --row-y:clamp(7px, 1.1vw, 10px);       /* row breathing room */
    --gap-x:clamp(8px, 2.4vw, 16px);       /* between columns */
    --gap-s:clamp(5px, 1.4vw, 9px);        /* between small controls */
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#101614; --tint:#161E1C; --rule:#26302E; --hair:#1C2523;
    --ink:#EDF2F1; --ink-2:#BCC9C7; --muted:#849492;
    --up:#4FCCBF; --dn:#EE8177;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
       -webkit-text-size-adjust:100%}
  .wrap{max-width:820px;margin:0 auto;
        padding:var(--pad-y) var(--pad-x) calc(var(--pad-y) + 24px)}

  h1{margin:0 0 2px;font-size:19px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
  .sub b{color:var(--ink);font-weight:600}
  h2{margin:22px 0 6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;
     text-transform:uppercase;color:var(--muted)}

  .ctl{display:flex;flex-wrap:wrap;gap:var(--gap-s);align-items:center;
       margin-bottom:var(--gap-x)}
  .ctl input,.ctl button{font-family:inherit;font-size:12.5px;padding:4px 8px;
       border:1px solid var(--rule);background:var(--bg);color:var(--ink);
       border-radius:5px;-webkit-appearance:none}
  .ctl button{cursor:pointer;font-weight:600}
  .ctl button:hover{border-color:var(--up);color:var(--up)}
  .ctl button:focus-visible,.day:focus-visible,.r:focus-visible{outline:2px solid var(--up);
       outline-offset:2px}
  .day{cursor:pointer;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:5px;
       border:1px solid var(--rule);background:var(--bg);color:var(--muted)}
  .day:hover{border-color:var(--up);color:var(--up)}
  .day.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .spin{font-size:12.5px;color:var(--muted)}

  .floor{font-size:12.5px;color:var(--muted);padding:8px 0;border-top:1px solid var(--rule)}
  .floor b{color:var(--ink);font-weight:700}
  .floor .sep{opacity:.45;padding:0 5px}

  /* KPI legend */
  .key{display:flex;flex-wrap:wrap;gap:2px var(--gap-x);font-size:11px;
       color:var(--muted);padding:0 0 7px;border-bottom:1px solid var(--rule);
       line-height:1.5}
  .key span{white-space:nowrap}
  .key i{font-style:normal;font-weight:700}
  .key .b-below{color:var(--dn)}
  .key.coll{border-bottom:0;padding-top:6px;padding-bottom:0}
  .key.coll b{color:var(--ink);font-weight:600}

  /* the list
     Four layouts, because two independent flags each add a column: a LIVE day
     adds pace, and billing adds collected. Every combination needs its own
     areas -- `.live .r` used to be declared after `.hascoll .r` and win, which
     left `co` with no area at all, so it auto-placed into the ">2m" cell and
     the two numbers printed on top of each other. That was true on the desktop
     grid as well as the phone one. Most specific last, always. */
  .hd,.r{display:grid;align-items:center;
         grid-template-columns:22px minmax(0,1fr) 86px 62px 62px 60px;
         grid-template-areas:"rk nm tk c cn lg"}
  .live .hd,.live .r{grid-template-columns:20px minmax(0,1fr) 76px 82px 52px 52px 46px;
         grid-template-areas:"rk nm tk pc c cn lg"}
  .hascoll .hd,.hascoll .r{grid-template-columns:22px minmax(0,1fr) 80px 54px 54px 50px 84px;
         grid-template-areas:"rk nm tk c cn lg co"}
  .live.hascoll .hd,.live.hascoll .r{
         grid-template-columns:20px minmax(0,1fr) 68px 74px 44px 44px 40px 76px;
         grid-template-areas:"rk nm tk pc c cn lg co"}
  .a-co{grid-area:co} .co{grid-area:co}
  .live .hd>*{padding-left:6px}
  .live .hd .a-nm{padding-left:0}
  .a-pc{grid-area:pc} .pc{grid-area:pc;font-weight:700;font-size:12.5px}
  .pc .exp{display:block;font-weight:400;font-size:10px;color:var(--muted);
           line-height:1.25}
  .pc.early{color:var(--muted);font-weight:400}
  .asof{font-size:11px;color:var(--muted);padding:6px 0 0}
  .hd{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      color:var(--muted);padding:9px 0 5px;border-bottom:1px solid var(--rule);
      column-gap:var(--gap-x)}
  .r{padding:var(--row-y) 0;border-bottom:1px solid var(--hair);cursor:pointer;
     column-gap:var(--gap-x)}
  .r:last-child{border-bottom:0}
  .r:hover,.r[aria-expanded="true"]{background:var(--tint)}
  .hd>*,.r>*{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .hd .a-rk,.hd .a-nm,.r .rk,.r .nm{text-align:left}
  .a-rk{grid-area:rk} .a-nm{grid-area:nm} .a-tk{grid-area:tk} .a-c{grid-area:c}
  .a-cn{grid-area:cn} .a-lg{grid-area:lg}
  .rk{grid-area:rk;color:var(--muted);font-size:11px}
  .nm{grid-area:nm;font-weight:600;font-size:14px;letter-spacing:-.01em;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
  .tk{grid-area:tk;font-weight:700;font-size:14px}
  .c{grid-area:c} .cn{grid-area:cn} .lg{grid-area:lg}
  .c,.cn,.lg,.co{font-weight:600;color:var(--ink-2);font-size:12.5px}
  .lbl{display:none;color:var(--muted);font-weight:400}
  /* Four band colours meant four things to hold in your head while reading a
     column of numbers. Only one of them is a call to action, so only one is a
     colour: at floor or above reads as ordinary text, and under the floor is
     the single thing that stands out. */
  .b-stretch,.b-target,.b-floor{color:inherit}
  .b-below{color:var(--dn)}
  .r.r-below .nm{color:var(--dn)}

  /* expand panel */
  /* No tinted block. The panel is one row's detail, not a different kind of
     thing, and a filled panel under a list of hairlines reads as heavier than
     everything it explains. */
  .det{display:none;border-bottom:1px solid var(--hair);
       border-left:2px solid var(--rule);margin-left:2px;
       padding:var(--row-y) 0 calc(var(--row-y) + 4px) var(--gap-x)}
  .det.on{display:block}
  /* expand panel: a line per metric, no table and so nothing to scroll */
  .lns{display:flex;flex-direction:column;gap:3px;max-width:560px}
  .ln{display:flex;align-items:baseline;gap:var(--gap-x);font-size:12.5px;
      font-variant-numeric:tabular-nums}
  .ln .lb{flex:0 0 74px;color:var(--muted)}
  .ln .vl{flex:0 0 auto;min-width:52px;font-weight:700}
  .ln .tl{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;
          white-space:nowrap}
  .ln .tl b{color:var(--ink);font-weight:600}
  .foot{font-size:11px;color:var(--muted);padding-top:7px;margin-top:8px;
        line-height:1.5;max-width:520px}

  /* per-day bars inside the panel */
  /* grid-column was for the tile grid this panel used to be; it is a plain
     block now, and a stray grid property is a thing someone later has to prove
     inert. */
  .spark{margin-top:9px;padding-top:8px;border-top:1px solid var(--hair);max-width:560px}
  .spark .cap{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
              color:var(--muted);margin-bottom:5px}
  .bars{display:flex;align-items:flex-end;justify-content:flex-start;gap:2px;height:38px}
  .bars div{flex:1 1 0;min-width:3px;max-width:22px;background:var(--ink-2);
            border-radius:1px 1px 0 0;opacity:.5}
  .bars div.off{background:var(--muted);opacity:.3}
  .bars div:hover{opacity:1}

  /* a team whose calls are not on this platform at all */
  .blocked{background:var(--tint);border:1px solid var(--rule);
           border-left:2px solid var(--dn);
           padding:10px 13px;margin:0 0 12px;font-size:12.5px;line-height:1.55;
           color:var(--ink-2)}
  .blocked summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);
                   list-style:none}
  .blocked summary::-webkit-details-marker{display:none}
  .blocked summary::before{content:'\25B8  ';color:var(--dn);font-weight:700}
  .blocked[open] summary::before{content:'\25BE  '}
  .blocked summary b{color:var(--ink)}
  .blocked .bd{margin-top:8px}
  .blocked ul{margin:8px 0 0;padding-left:18px}
  .blocked li{margin-bottom:3px}

  .warn{font-size:12.5px;color:var(--ink-2);background:var(--tint);
        border-left:2px solid var(--rule);padding:8px 11px;margin:7px 0}
  .warn.bad{border-left-color:var(--dn)}
  .warn b{color:var(--ink)}
  .empty{color:var(--muted);font-size:12.5px;padding:16px 0}
  .err{color:var(--dn);font-size:12.5px;padding:14px 0;line-height:1.5}

  /* ── phones ────────────────────────────────────────────────
     Compact, not "mobile-styled". Two lines an agent: identity and the headline
     figure on the first, the supporting counts on the second. The earlier
     version gave the talk figure its own 26px line and cost three lines each,
     which fitted four agents on a screen -- fine for billing, useless for a
     six-person team you want to scan at a glance. */
  @media(max-width:560px){
    h1{font-size:17px}
    .sub{font-size:11px;line-height:1.45}

    .hd{display:none}
    /* Same four combinations as the desktop grid, in the same order, for the
       same reason. Collected gets its own line rather than a fifth cell on a
       375px screen: a dollar figure squeezed between two call counts is how it
       ended up printed over the ">2m" column in the first place. */
    /* The COLUMNS have to be restated on every selector, not just `.r`.
       A media query adds no specificity, so the desktop `.live .r` (0,2,0)
       outranks a phone `.r` (0,1,0) and the live board kept its seven-column
       desktop track list underneath four-column areas -- which collapsed the
       name to zero width and stacked the counts. Same trap as the missing `co`
       area, one level up: specificity, not source order, decides. */
    /* No rank column on a phone: the order down the screen already says it, and
       dropping it gives the second line the full width instead of an 18px
       indent it was only there to clear. */
    .r,.live .r,.hascoll .r,.live.hascoll .r{
      grid-template-columns:minmax(0,1fr) 60px 56px;
      row-gap:1px;
    }
    .r{grid-template-areas:"nm tk tk" "c  cn lg"}
    .live .r{grid-template-areas:"nm tk pc" "c  cn lg"}
    .hascoll .r{grid-template-areas:"nm tk tk" "c  cn lg" "co co co"}
    .live.hascoll .r{grid-template-areas:"nm tk pc" "c  cn lg" "co co co"}
    .r .rk{display:none}
    .co{text-align:left}
    /* "exp 104m" on every row is the same number the expand panel spells out in
       full. The percentage already carries the comparison. */
    .pc .exp{display:none}
    .r .rk{align-self:center;font-size:11px}
    .nm{font-size:14px;padding-right:0;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;align-self:center}
    .tk{font-size:14px;text-align:right;align-self:center;line-height:1.25}
    .tk .lbl{display:none}                 /* the column is obvious in context */
    .pc{text-align:right;font-size:12.5px;align-self:center;min-width:52px}
    .pc .exp{font-size:10px;line-height:1.2}
    /* counts on one quiet line, indented under the name. NO grid-column:auto --
       it overrides the named areas and auto-places all three into one cell, which
       renders as "CallsC79.463.4" stacked on top of each other. */
    .c,.cn,.lg,.co{text-align:left;font-size:11px;font-weight:400;
               color:var(--muted);white-space:nowrap;overflow:hidden;
               text-overflow:ellipsis}
    .c b,.cn b,.lg b,.co b{color:var(--ink);font-weight:600}
    .lbl{display:inline;color:var(--muted);font-weight:400}

    .ln{font-size:11px}
    .ln .lb{flex-basis:58px}
    .ln .vl{min-width:44px}
    .foot{font-size:10px;line-height:1.5}

    .ctl{gap:5px;margin-bottom:9px}
    /* 16px exactly: iOS zooms the page when a focused input is smaller. */
    .ctl input{flex:1 1 40%;min-width:0;font-size:16px;padding:6px 7px}
    .ctl button{padding:6px 10px;font-size:12.5px}
    .day{padding:6px 11px;font-size:12.5px}
    .key{font-size:10px;gap:1px 9px;padding-bottom:6px}
    .warn{font-size:11px;padding:8px 10px;margin:5px 0}
    .blocked{font-size:12.5px;padding:11px 12px}
    h2{margin:16px 0 5px;font-size:11px}
  }
  /* very narrow: the pace column drops, the rest keeps its shape */
  @media(max-width:340px){
    .r,.live .r{grid-template-areas:"nm tk tk" "c cn lg"}
    .hascoll .r,.live.hascoll .r{
      grid-template-areas:"nm tk tk" "c cn lg" "co co co"}
    .r,.live .r,.hascoll .r,.live.hascoll .r{
      grid-template-columns:minmax(0,1fr) 54px 50px}
    .pc{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Team KPI Board</h1>
  <p class="sub" id="sub">Loading&hellip;</p>

  <div class="ctl" id="days"></div>
  <div class="ctl">
    <input type="date" id="start" aria-label="Start date" />
    <span class="to">to</span>
    <input type="date" id="end" aria-label="End date" />
    <span class="spin" id="spin"></span>
  </div>

  <div id="out"></div>
</div>

<script>
(function () {
  'use strict';
  var SHARE = {{ 'true' if share_mode else 'false' }};
  var TOKEN = {{ (share_token or '')|tojson }};
  var $ = function (id) { return document.getElementById(id); };
  // A team page knows which team it is; only /v6 falls back to the query string.
  var FIXED = {{ (fixed_team or '')|tojson }};
  var TEAM = FIXED || (new URLSearchParams(location.search).get('team') || '').toLowerCase();

  function hm(s) {
    s = Math.round(s || 0);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    if (s >= 3600) return Math.floor(s / 3600) + ':' + p(Math.floor((s % 3600) / 60)) + ':' + p(s % 60);
    return Math.floor(s / 60) + ':' + p(s % 60);
  }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  // A metric cell coloured by where it lands against the KPI.
  function cell(area, value, band, label) {
    // The label only shows on phones (see .lbl), where a bare number in a
    // three-across row is unreadable without it.
    return '<div class="' + area + ' b-' + esc(band) + '">' +
           '<span class="lbl">' + esc(label) + ' </span><b>' + esc(value) + '</b></div>';
  }
  // Ahead/behind against what a normal day looks like at this hour -- not
  // against the clock. See _PACE_CURVE_DEFAULT in billing_report.py for why.
  function paceCell(pace, key, unit) {
    if (!pace) return '<div class="pc"></div>';
    var exp = pace.expected[key], act = pace.actual[key], r = pace.ratio[key];
    if (r == null) {
      return '<div class="pc early">&mdash;<span class="exp">too early</span></div>';
    }
    var pct = Math.round((r - 1) * 100);
    // The sign already says which way it is going; colour is spent only on the
    // one case that needs a decision.
    var cls = r >= 0.8 ? '' : 'b-below';
    var sign = pct > 0 ? '+' : '';
    return '<div class="pc ' + cls + '">' + sign + pct + '%' +
           '<span class="exp">exp ' + exp + (unit || '') + '</span></div>';
  }

  // A seat held out of the ranking still banked money, and the sheet knows it
  // whether or not the phone log does. These notices render instead of a row,
  // so without this the whole Collected figure disappeared for anyone the call
  // data could not rank -- which on a quiet morning is everybody.
  function collNote(a) {
    if (!a || a.collected_total == null || !a.collected_total) return '';
    return ' Collected <b>' + money(a.collected_total) + '</b> in this window.';
  }

  function money(v) {
    if (v == null) return '\u2014';
    return '$' + Math.round(v).toLocaleString();
  }

  function tgt(t, k) {
    return t[k] ? (t[k].floor + ' / ' + t[k].target + ' / ' + t[k].stretch) : '';
  }

  function render(d) {
    var ranked = d.ranked || [], silent = d.silent || [], stalled = d.stalled || [],
        unknown = d.unknown || [], team = d.team || {};
    var T = d.targets || {}, LONG = d.long_call_seconds || 120;
    var longLbl = '≥' + Math.round(LONG / 60) + 'm';
    var longKey = 'over_' + LONG + 's';
    var multi = (d.window || {}).start !== (d.window || {}).end;

    if (d.team_label) {
      $('title').textContent = d.team_label + ' KPI Board';
      document.title = d.team_label + ' KPI Board';
    }

    // Two facts and, on a live day, the one that changes how every number below
    // is read. The team's own averages used to sit here too; they are the list
    // itself, restated, and they pushed the sentence onto three lines on a
    // phone before it said anything a reader could act on.
    var sub = '<b>' + ranked.length + '</b> seat' + (ranked.length === 1 ? '' : 's') +
      ' &middot; <b>' + (team.agent_days || 0) + '</b> working day' +
      ((team.agent_days || 0) === 1 ? '' : 's');
    if (d.live && ranked.length && ranked[0].pace) {
      var pc = ranked[0].pace;
      // For a RingCX team these are the SAME instant -- the pace clock is pulled
      // back to where the delivered report reaches -- so the time is stated
      // once, and only its provenance changes. RingCX arrives by email, and
      // saying how far behind stops "they are quiet this hour" being read off a
      // report that simply has not landed yet.
      sub += d.data_as_of
        ? ' &middot; report to <b>' + esc(d.data_as_of.as_of) + '</b> (' +
          d.data_as_of.lag_minutes + ' min behind)'
        : ' &middot; <b>' + esc(pc.as_of) + '</b>';
      sub += ', day <b>' + Math.round(pc.fraction * 100) +
             '%</b> through &mdash; targets pro-rated';
    } else {
      // isoLocal, not toISOString: in the evening the UTC date is already
      // tomorrow, so a finished day stopped being called "in progress" hours
      // early -- and the ranges the chips built were off by a day outright.
      if ((d.window || {}).end >= isoLocal(new Date())) {
        sub += ' &middot; <b>today is still in progress</b>';
      }
    }
    if (d.meta && d.meta.complete === false) {
      sub += ' &middot; <b>still fetching</b>';
    }
    $('sub').innerHTML = sub;

    var h = '';
    // The TARGET only. Floor and stretch were on this line too -- twelve numbers
    // to read before the first agent, to explain a scale that is now one colour.
    // Both still sit in the expand panel, next to the figure they qualify.
    var one = function (k) { return T[k] ? T[k].target : ''; };
    h += '<div class="key">' +
      '<span>Daily target</span>' +
      '<span>' + esc(one('talk_minutes')) + 'm talk</span>' +
      '<span>' + esc(one('calls')) + ' calls</span>' +
      '<span>' + esc(one('connected')) + ' conn</span>' +
      '<span>' + esc(one('long_calls')) + ' ' + longLbl + '</span>' +
      '<span><i class="b-below">red is under ' + esc(
         (T.talk_minutes || {}).floor || '') + 'm</i></span>' +
      '</div>';

    // Collections context: one line, and deliberately no "today vs a full day"
    // ratio. Today is a part-day and collections are logged in batches, not
    // continuously, so pro-rating them against a whole day would repeat the
    // mistake that put agents on this board at 200% of expected. The typical
    // day is stated beside today and left for the reader to judge.
    var C = d.collections;
    if (C && C.total) {
        // Every figure names the RECORD it came from. "Collected" beside "all
        // payments" read as a total beside a subset -- so a Books number that
        // was legitimately smaller looked like an error. They are two separate
        // records of the same week and the labels have to say so.
        var bits = [];
        if (d.live) {
            bits.push('Billers logged <b>' + money(C.today) + '</b> today');
            if (C.typical_day) bits.push('typical day <b>' + money(C.typical_day) + '</b>');
        } else {
            bits.push('Billers logged <b>' + money(C.total) + '</b>');
            if (C.days_with_money) bits.push('over <b>' + C.days_with_money + '</b> day' +
                                             (C.days_with_money === 1 ? '' : 's'));
            if (C.typical_day) bits.push('<b>' + money(C.typical_day) + '</b> a day');
        }
        if (C.trend_pct != null) {
            bits.push('trending <b>' + (C.trend_pct > 0 ? '+' : '') + C.trend_pct + '%</b>');
        }
        // The gap runs both ways and means something different each way, so it
        // is named rather than signed. Books ahead IS the self-service money --
        // the thing this was added to surface. The sheet ahead is money Books
        // never saw, which is what cash looks like.
        var P = C.payments;
        if (P && P.available) {
            var gap = '';
            if (P.difference) {
                gap = P.sheet_exceeds_books
                    ? ' &mdash; <b>' + money(-P.difference) + '</b> less, so the sheet holds ' +
                      'payments Books never saw'
                    : ' &mdash; <b>' + money(P.difference) + '</b> more, paid without a biller';
            }
            bits.push('Books shows <b>' + money(P.all_payments) + '</b>' + gap);
        }
        h += '<div class="key coll">' + bits.map(function (b) {
            return '<span>' + b + '</span>'; }).join('') + '</div>';
    }

    // Why the payments half is missing, when it is. An absent number that never
    // explains itself is how the collections column spent a day reading zero.
    if (C && C.payments && !C.payments.available && C.total) {
        h += '<div class="warn">Payments from Books are not being counted: ' +
             esc(C.payments.reason) + '</div>';
    }

    if (!ranked.length && !silent.length && !stalled.length && !unknown.length) {
      $('out').innerHTML = h + '<div class="empty">No seats on the roster.</div>';
      return;
    }

    if (d.blocked) {
      // One line by default. The full explanation is three paragraphs and three
      // bullets -- worth having, but not worth burying the board under on a
      // phone every time someone opens it.
      h += '<details class="blocked"><summary><b>These numbers are not this ' +
           'team\'s performance</b> &mdash; no RingCX report for this window yet' +
           '</summary><div class="bd">' + esc(d.blocked.message) +
           '<ul>' + (d.blocked.unblock || []).map(function (u) {
             return '<li>' + esc(u) + '</li>';
           }).join('') + '</ul></div></details>';
    }

    var live = !!d.live;
    // Only billing has a collections sheet behind it -- and the question is
    // whether the BOARD has collections, not whether the ranked seats do.
    //
    // Asking `ranked` alone meant the whole Collected column vanished on any
    // view where nobody made it into the ranking: a today view with sparse or
    // rate-limited call data leaves every seat in silent/stalled, and the
    // column disappeared with them, while a 7- or 30-day view of the same
    // sheet showed it fine. Collections come from the sheet; whether a seat
    // dialled has nothing to do with whether they banked money.
    var hasColl = [].concat(ranked, silent, stalled, unknown)
      .some(function (a) { return a && a.collected_total != null; });
    h += '<div class="' + (live ? 'live' : '') + (hasColl ? ' hascoll' : '') + '">';
    // No column headings over an empty list. When nothing ranks, the seats
    // render as notices below and a bare header row sits over nothing.
    if (ranked.length) h += '<div class="hd">' +
      '<div class="a-rk"></div><div class="a-nm">Agent</div>' +
      '<div class="a-tk">' + (live ? 'So far' : 'Talk/day') + '</div>' +
      (live ? '<div class="a-pc">vs expected</div>' : '') +
      '<div class="a-c">Calls</div>' +
      '<div class="a-cn">Conn</div><div class="a-lg">' + longLbl + '</div>' +
      (hasColl ? '<div class="a-co">Collected</div>' : '') + '</div>';

    ranked.forEach(function (a, i) {
      // `worked` = the working-day figures every per-day average is derived from.
      // `totals` includes idle-day stray dials; showing those here instead would
      // make the panel disagree with the row above it.
      var g = a.grades || {}, p = a.per_day || {}, tot = a.worked || a.totals || {};
      var all = a.totals || {};
      var id = 'd' + i;
      // On a live day the numbers ARE the part-day so far, and the colour comes
      // from where the day is HEADED -- colouring a half-finished day against a
      // whole-day target just paints everyone red until the evening.
      var pace = a.pace;
      var band = pace && pace.grades ? (pace.grades.talk_minutes || a.band) : a.band;
      var show = pace ? pace.actual : p;
      var pg = pace && pace.grades ? pace.grades : g;
      h += '<div class="r' + (band === 'below' ? ' r-below' : '') + '" data-det="' + id +
           '" tabindex="0" role="button" aria-expanded="false">' +
        '<div class="rk">' + (i + 1) + '</div>' +
        '<div class="nm">' + esc(a.name) + '</div>' +
        cell('tk', show.talk_minutes + 'm', pg.talk_minutes || 'below',
             live ? 'Talk so far' : 'Talk/day') +
        (live ? paceCell(pace, 'talk_minutes', 'm') : '') +
        cell('c', show.calls, pg.calls || 'below', 'Calls') +
        cell('cn', show.connected, pg.connected || 'below', 'Conn') +
        cell('lg', show.long_calls, pg.long_calls || 'below', longLbl) +
        (hasColl ? '<div class="co"><span class="lbl">Collected </span><b>' +
                   money(a.collected_total) + '</b></div>' : '') +
        '</div>';

      var days = (a.days || []);
      var worked = days.filter(function (x) { return x.worked; });
      var peak = Math.max.apply(null, days.map(function (x) { return x.talk_minutes; }).concat([1]));
      var METRICS = [['talk_minutes', 'Talk', 'm'], ['calls', 'Calls', ''],
                     ['connected', 'Connected', ''], ['long_calls', longLbl, '']];

      // One table, not a wall of tiles. A live day answers "where are they, where
      // should they be, where will they land"; a finished range answers "per day
      // and in total". Everything else is one quiet footnote.
      var body;
      // A line per metric, not a table. The table was sixteen numbers of which
      // eight were already on the row above (Now) or in the legend (Target),
      // laid out in four columns that did not fit a phone -- Target, the number
      // the others are read against, fell off the right edge. One sentence each
      // says the same thing in the order it is asked: where they are, where that
      // lands, what the bar is.
      var line = function (label, value, tail, band) {
        return '<div class="ln"><span class="lb">' + label + '</span>' +
               '<span class="vl' + (band ? ' b-' + band : '') + '">' + value + '</span>' +
               (tail ? '<span class="tl">' + tail + '</span>' : '') + '</div>';
      };
      // What a connected call was worth. The one collections figure the call
      // columns cannot express: a seat can sit bottom on talk time and top on
      // takings, and only this says so.
      var collLine = '';
      if (a.collected_total) {
        // Per-connected only. Adding "$14,419/day over 6 days" ran past the
        // line on a phone and got an ellipsis, and it is the team line's
        // figure repeated for one seat -- the per-connected number is the one
        // nothing else on the board says.
        collLine = line('Collected', money(a.collected_total),
                        a.collected_per_connected
                          ? money(a.collected_per_connected) + ' per connected call'
                          : '');
      }

      var body;
      if (pace) {
        body = '<div class="lns">' + METRICS.map(function (m) {
          var k = m[0], u = m[2], pj = pace.projected[k];
          var t = (T[k] || {}).target;
          return line(m[1], pace.actual[k] + u,
                      (pj == null ? 'too early to project'
                                  : 'on track for <b>' + pj + u + '</b>') +
                      (t != null ? ' &middot; target ' + t + u : ''),
                      pace.grades[k] || 'below');
        }).join('') + collLine + '</div>';
      } else {
        var totals = {talk_minutes: hm(tot.talk_seconds), calls: tot.handled_calls,
                      connected: tot.connected, long_calls: tot[longKey]};
        body = '<div class="lns">' + METRICS.map(function (m) {
          var k = m[0], u = m[2], t = (T[k] || {}).target;
          return line(m[1], p[k] + u + '/day',
                      totals[k] + ' total' + (t != null ? ' &middot; target ' + t + u : ''),
                      g[k] || 'below');
        }).join('') + collLine + '</div>';
      }

      // One line, and only facts that are not already on the row or in the
      // table above it. The share of connected calls running over two minutes
      // was the count beside it expressed as a percentage; the pace sentence
      // restated the page header; the working-day count is in the header too.
      var bits = ['Ext ' + esc(a.ext || a.ext_id),
                  'avg call ' + a.avg_call_seconds + 's',
                  'longest ' + hm(tot.longest_seconds)];
      // Wrap, and the handle total it adds up to. Only where there is any --
      // RingEX has no after-call work to report, so an unconditional "+0m wrap"
      // would be noise on the billing board.
      if (a.wrap_minutes) {
        bits.push('wrap ' + a.wrap_minutes + 'm');
        bits.push('handle ' + a.handle_minutes + 'm');
      }
      if (!pace) bits.push('median day ' + a.median_talk_minutes + 'm');
      if (!pace && a.idle_days) bits.push(a.idle_days + ' idle days not averaged');
      if (pace && !pace.projectable) bits.push('too early to project');
      var foot = bits.join(' &middot; ');

      h += '<div class="det" id="' + id + '">' + body +
        (multi && days.length ?
          '<div class="spark"><div class="cap">Talk per day</div>' +
          '<div class="bars">' + days.map(function (x) {
            return '<div class="' + (x.worked ? '' : 'off') + '" title="' + esc(x.date) +
                   ': ' + x.talk_minutes + ' min, ' + x.connected + ' connected" style="height:' +
                   Math.max(2, Math.round(100 * x.talk_minutes / peak)) + '%"></div>';
          }).join('') + '</div></div>' : '') +
        '<div class="foot">' + foot + '</div></div>';
    });

    h += '</div>';   // close .live / plain list wrapper

    if (stalled.length) {
      h += '<h2>Dialling but not connecting</h2>';
      stalled.forEach(function (a) {
        var t = a.totals || {};
        h += '<div class="warn bad"><b>' + esc(a.name) + '</b> &mdash; <b>' + t.calls +
             '</b> call(s), <b>none</b> connected. Held out of the ranking: a line that ' +
             'never connects is broken, not last.' + collNote(a) + '</div>';
      });
    }

    if (unknown.length) {
      h += '<h2>Not known yet</h2>';
      unknown.forEach(function (a) {
        h += '<div class="warn"><b>' + esc(a.name) + '</b> &mdash; window <b>not fully ' +
             'read</b>, so this is not known rather than no calls. Reload shortly.</div>';
      });
    }

    if (silent.length) {
      h += '<h2>No calls logged</h2>';
      silent.forEach(function (a) {
        h += '<div class="warn bad"><b>' + esc(a.name) + '</b> (ext ' + esc(a.ext || a.ext_id) +
             ') &mdash; no calls at all. An empty seat, a wrong extension, or the wrong ' +
             'platform &mdash; not a zero score.' + collNote(a) + '</div>';
      });
    }

    var warns = (d.warnings || []).filter(function (x) {
      return x.kind !== 'no_activity' && x.kind !== 'no_connections' &&
             x.kind !== 'unknown_seat';
    });
    if (warns.length) {
      h += '<h2>Data notes</h2>';
      warns.forEach(function (x) {
        h += '<div class="warn' + (x.kind === 'incomplete_fetch' ? ' bad' : '') + '">' +
             esc(x.message) +
             (x.values ? ' (' + x.values.map(function (v) {
               return esc(v[0]) + ' ×' + v[1];
             }).join(', ') + ')' : '') + '</div>';
      });
    }

    var m = d.meta || {};
    h += '<div class="floor">' + esc(d.source_label || 'Call log') +
         '<span class="sep">&middot;</span>' +
         (m.cached ? (m.age_seconds || 0) + 's old' : 'live') +
         '<span class="sep">&middot;</span>connected calls only' +
         // Which time this is. The RingCX report's own column is Handle Time =
         // talk + wrap, and comparing the two without knowing that reads as a
         // discrepancy rather than as two different measurements.
         '<span class="sep">&middot;</span>talk time, wrap excluded' +
         '</div>';

    $('out').innerHTML = h;

    $('out').querySelectorAll('.r[data-det]').forEach(function (row) {
      var toggle = function () {
        var panel = document.getElementById(row.getAttribute('data-det'));
        if (!panel) return;
        var wasOpen = panel.classList.contains('on');
        $('out').querySelectorAll('.det.on').forEach(function (o) { o.classList.remove('on'); });
        $('out').querySelectorAll('.r[aria-expanded="true"]').forEach(function (r) {
          r.setAttribute('aria-expanded', 'false');
        });
        if (!wasOpen) {
          panel.classList.add('on');
          row.setAttribute('aria-expanded', 'true');
        }
      };
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });
  }

  function load() {
    $('spin').textContent = 'loading…';
    // A page that sits on "Loading…" forever tells the viewer nothing. If the
    // server drops the connection -- a killed gunicorn worker does exactly that
    // -- fetch() never settles, so the page needs its own deadline.
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var bailed = false;
    var bail = setTimeout(function () {
      bailed = true;
      if (ctl) { try { ctl.abort(); } catch (e) {} }
      $('spin').textContent = '';
      $('sub').textContent = '';
      $('out').innerHTML = '<div class="err"><b>The server did not answer in 45 seconds.</b>' +
        '<br>RingCentral only allows 10 call-log requests a minute for the whole account, ' +
        'and this board shares that budget with the sales dashboard. Days already fetched ' +
        'are cached, so reloading usually works. If it keeps timing out, check the service logs.' +
        '</div>';
    }, 45000);
    var q = new URLSearchParams();
    if ($('start').value) q.set('start', $('start').value);
    if ($('end').value) q.set('end', $('end').value || $('start').value);
    q.set('tz', String(new Date().getTimezoneOffset()));
    if (TEAM) q.set('team', TEAM);
    if (SHARE && TOKEN) q.set('k', TOKEN);

    fetch('/api/v6/report?' + q.toString(),
          ctl ? { credentials: 'same-origin', signal: ctl.signal }
              : { credentials: 'same-origin' })
      .then(function (r) {
        return r.text().then(function (t) {
          // A dropped worker or a proxy error returns HTML, not JSON. Parsing it
          // blind threw inside the success path and left the spinner running.
          var j; try { j = JSON.parse(t); } catch (e) {
            j = { error: 'bad_response',
                  detail: 'HTTP ' + r.status + ' — the server returned ' +
                          (t.slice(0, 120) || 'an empty body') };
          }
          return { ok: r.ok, j: j };
        });
      })
      .then(function (res) {
        if (bailed) return;
        clearTimeout(bail);
        $('spin').textContent = '';
        if (!res.ok) {
          var j = res.j || {};
          $('out').innerHTML = '<div class="err"><b>' + esc(j.error || 'Request failed') +
            '</b><br>' + esc(j.detail || '') + '</div>';
          $('sub').textContent = '';
          return;
        }
        render(res.j);
        var w = res.j.window || {};
        if (w.start && !$('start').value) { $('start').value = w.start; $('end').value = w.end; }
        syncChips();
      })
      .catch(function (err) {
        if (bailed) return;
        clearTimeout(bail);
        $('spin').textContent = '';
        $('out').innerHTML = '<div class="err">Could not reach the server: ' +
          esc(err && err.message ? err.message : err) + '</div>';
      });
  }

  // LOCAL date, not UTC. The presets used d.toISOString(), which is UTC, so
  // after 8pm Eastern every one of them asked for a range a day ahead -- "Today"
  // fetched tomorrow and came back empty. A board about a working day has to
  // count days the way the floor does.
  function isoLocal(d) {
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
             .toISOString().slice(0, 10);
  }

  // Ranges people actually ask for, not just "last N days". Yesterday is how you
  // check a finished day; the month ones are how the numbers get reported.
  function presetRange(key) {
    var now = new Date();
    var d = function (n) { var x = new Date(now); x.setDate(x.getDate() + n); return x; };
    var monthStart = function (off) {
      return new Date(now.getFullYear(), now.getMonth() + off, 1);
    };
    switch (key) {
      case 'today':      return [d(0), d(0)];
      case 'yesterday':  return [d(-1), d(-1)];
      case '7d':         return [d(-6), d(0)];
      case '30d':        return [d(-29), d(0)];
      case 'month':      return [monthStart(0), d(0)];
      case 'lastmonth':  return [monthStart(-1),
                                 new Date(now.getFullYear(), now.getMonth(), 0)];
    }
  }

  var PRESETS = [['today', 'Today'], ['yesterday', 'Yesterday'], ['7d', '7 days'],
                 ['30d', '30 days'], ['month', 'This month'], ['lastmonth', 'Last month']];

  function buildDayButtons() {
    var box = $('days');
    if (box.dataset.built) return;
    box.dataset.built = '1';
    PRESETS.forEach(function (pr) {
      var b = document.createElement('button');
      b.className = 'day'; b.type = 'button'; b.textContent = pr[1];
      b.dataset.key = pr[0];
      b.onclick = function () {
        var r = presetRange(pr[0]);
        $('start').value = isoLocal(r[0]);
        $('end').value = isoLocal(r[1]);
        syncChips();
        load();
      };
      box.appendChild(b);
    });
    syncChips();
  }

  // Highlight whichever preset the current range happens to match -- including
  // after the dates are edited by hand, so the chips describe what is on screen
  // rather than only what was last clicked.
  function syncChips() {
    var box = $('days');
    if (!box) return;
    var a = $('start').value, b = $('end').value;
    box.querySelectorAll('.day').forEach(function (x) {
      var r = presetRange(x.dataset.key);
      x.classList.toggle('on', !!r && isoLocal(r[0]) === a && isoLocal(r[1]) === b);
    });
  }

  // Open on today, explicitly. The API defaults to today anyway, but leaving the
  // pickers blank meant the board's own controls did not say what it was showing.
  (function initToday() {
    var iso = isoLocal(new Date());
    $('start').value = iso;
    $('end').value = iso;
    // Build the range controls BEFORE the first fetch, not after a successful
    // one. They used to be created in the success path, so a board whose first
    // request failed offered no way to ask for a different range -- the one
    // control that could have got it out of the error.
    buildDayButtons();
  })();

  // The range applies itself. A separate "Show" button was a second way to do
  // what picking a date already means, and picking a date and then wondering
  // why nothing moved is the whole friction being removed here.
  ['start', 'end'].forEach(function (id) {
    var el = $(id);
    el.addEventListener('change', function () {
      if (!$('start').value || !$('end').value) return;
      if ($('start').value > $('end').value) {          // swap rather than refuse
        var t = $('start').value; $('start').value = $('end').value; $('end').value = t;
      }
      syncChips();
      load();
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { syncChips(); load(); }
    });
  });
  load();
  // Today's numbers move; a board left open on a wall should not go stale.
  setInterval(function () {
    var today = isoLocal(new Date());
    if (!$('end').value || $('end').value >= today) load();
  }, 120000);
})();
</script>
</body>
</html>
