<body>
<div class="wrap">
  <h1 id="title">{{ landing_title or page_title or 'Team KPI Board' }}</h1>
  <p class="sub" id="sub">Loading&hellip;</p>

  <div class="ctl" id="days"></div>
  <div class="ctl">
    <input type="date" id="start" aria-label="Start date" />
    <span class="to">to</span>
    <input type="date" id="end" aria-label="End date" />
    <span class="spin" id="spin"></span>
  </div>

  <div id="out"></div>
</div>

<script>
(function () {
  'use strict';
  var SHARE = {{ 'true' if share_mode else 'false' }};
  var TOKEN = {{ (share_token or '')|tojson }};
  var $ = function (id) { return document.getElementById(id); };
  // A team page knows which team it is; only /v6 falls back to the query string.
  var FIXED = {{ (fixed_team or '')|tojson }};
  // Which boards this link shows. An explicit ?team= or a share link pinned to
  // one team still renders exactly one, unchanged -- MULTI_BOARD is only the
  // default landing page, where Billing and Surgical Coordinator sit together.
  var BOARD_TEAMS = {{ (board_teams or [])|tojson }};
  var LANDING_TITLE = {{ (landing_title or '')|tojson }};
  // One coordinator's own page: the report and presence calls are cut to
  // this seat on the server; the page hides the team strip and opens the
  // panel. Danny, 2026-10-08: "view their own individual stats and
  // performance separately".
  // Where the work behind a red number lives in Zoho. View ids read off the
  // CRM on 2026-10-08; the chips and the fix list link straight to them.
  var ZB = 'https://crm.zoho.com/crm/goalsplasticsurgery/tab/';
  var ZOHO = {
    myCalls: ZB + 'Calls/custom-view/5212466001042325429/list',          // My Journey Calls
    teamOverdue: ZB + 'Calls/custom-view/5212466001043166717/list',      // Team Journey Calls - Overdue
    tasks: ZB + 'Tasks/custom-view/5212466000000331219/list',            // My Today + Overdue Tasks
    notReady: ZB + 'CustomModule13/custom-view/5212466001043166677/list', // Within 14 Days - Not Ready
    medical: ZB + 'CustomModule13/custom-view/5212466001043166701/list',  // Medical Action Needed
    dateNeeded: ZB + 'CustomModule13/custom-view/5212466001043166685/list',
    myActive: ZB + 'CustomModule13/custom-view/5212466001043166661/kanban',
    upcoming: ZB + 'CustomModule13/custom-view/5212466001043166669/list'
  };
  var AGENT = {{ (agent_only or '')|tojson }};
  var AGENT_SLUG = {{ (agent_slug or '')|tojson }};
  if (AGENT) document.documentElement.classList.add('agent');
  var EMBED_URL = {{ (embed_url or '')|tojson }};
  // Listen / whisper on a live RingCX call: signed-in supervisors only. The
  // number to ring them on is remembered in this browser (a convenience, not
  // state), and every read or write of it is guarded.
  var CAN_MONITOR = {{ (can_monitor or false)|tojson }};
  function myNumber(v) {
    try { if (v !== undefined) localStorage.setItem('v6_monitor_number', v); return localStorage.getItem('v6_monitor_number') || ''; }
    catch (e) { return ''; }
  }
  var EMBED_TITLE = {{ (embed_title or 'Lead Distribution')|tojson }};
  var TEAM = FIXED || (new URLSearchParams(location.search).get('team') || '').toLowerCase();
  var BOARDS = TEAM ? [TEAM] : (BOARD_TEAMS.length ? BOARD_TEAMS : ['']);
  var MULTI_BOARD = BOARDS.length > 1;
  var SLOTS_READY = false;

  function slotId(t) { return 'slot_' + (t || 'main'); }

  // Built once. render() only ever writes its own slot div, so the sections have
  // to exist before the first report lands or the second board would overwrite
  // the first.
  function ensureSlots() {
    if (SLOTS_READY) return;
    if (!MULTI_BOARD) { SLOTS_READY = true; return; }
    var html = '';
    BOARDS.forEach(function (t) {
      // The page is the dashboard; each board under it has its own plain
      // heading and its own summary line.
      html += '<section class="bd">' +
              '<h2 class="bt" id="bt_' + slotId(t) + '">\u2026</h2>' +
              '<p class="sub" id="sub_' + slotId(t) + '"></p>' +
              '<div id="' + slotId(t) + '"></div></section>';
    });
    // The back-office board, as a third section in the same style: plain
    // heading and ONE link that opens it in a new tab. No frame -- the
    // preview card was clutter (Danny, 2026-10-07).
    if (EMBED_URL) {
      html += '<section class="bd"><h2 class="bt">' + esc(EMBED_TITLE) + '</h2>' +
              '<p class="lnkrow"><a href="' + esc(EMBED_URL) + '" target="_blank" rel="noopener">' +
              'Open ' + esc(EMBED_TITLE) + '<span class="arr">\u2197</span></a></p></section>';
    }
    document.getElementById('out').innerHTML = html;
    if (LANDING_TITLE) {
      document.getElementById('title').textContent = LANDING_TITLE;
      document.title = LANDING_TITLE;
    }
    document.getElementById('sub').textContent = '';
    SLOTS_READY = true;
  }

  function hm(s) {
    s = Math.round(s || 0);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    if (s >= 3600) return Math.floor(s / 3600) + ':' + p(Math.floor((s % 3600) / 60)) + ':' + p(s % 60);
    return Math.floor(s / 60) + ':' + p(s % 60);
  }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  // Sent/received for one seat. Returns '' when SMS was never read, so a board
  // with the reader switched off looks exactly as it did before rather than
  // growing a row of zeros. `unknown` is the case that matters: RingEX refusing
  // the message store and a seat sending nothing are the same empty list, and
  // this board names individuals.
  // Which platform carried this row's calls, shown only when it differs from the
  // board's own. Without it, Ana Salazar's RingCX zero is indistinguishable from
  // a billing seat that dialled nothing -- the same confusion that read her dead
  // RingEX handset as a failing agent for eleven working days.
  function srcChip(a) {
    if (!a || !a.call_source) return '';
    return '<span class="sms" title="Calls for this seat are read from ' +
      esc(a.call_source) + ', not this board\u2019s own platform.">on <b>' +
      esc(a.call_source) + '</b></span>';
  }

  // Presence arrives on its own fetch and its own clock, so a row renders before
  // it lands and re-renders when it does. PRESENCE is empty until then, and an
  // empty map means "not read yet" -- never "nobody is on a call".
  var PRESENCE = {};          // slot -> {name -> seat}
  var CUR_SLOT = 'out';       // the slot render() is currently drawing

  function presenceChip(a) {
    var P = PRESENCE[CUR_SLOT];
    if (!P) return '';
    var p = P[a.name];
    if (!p || !p.label) return '';   // a RingCX seat between calls: no pill at all
    var t = p.label;
    if (p.ext_mismatch) t += ' \u2014 ' + p.ext_mismatch;
    else if (p.state === 'unknown' && (p.note || P.__note)) t += ' \u2014 ' + (p.note || P.__note);
    else if (p.call && p.call.seconds != null) t += ' \u2014 ' + Math.round(p.call.seconds / 60) + ' min' +
      (p.call.queue ? ' on ' + p.call.queue : '');
    return '<span class="pz pz-' + esc(p.state) + '" title="' + esc(t) + '">' +
           esc(p.label) + '</span>';
  }

  // Activities the person created in Zoho CRM inside the window shown. Shown
  // only on boards that carry it; "not read" when the count could not be
  // attributed, never 0 -- a board of zeros reads as nobody logging anything.
  // Danny, 2026-10-07: "hide CRM 18 calls · 1 tasks in the collapsed state".
  // The count is still fetched and still on the row's data (a.crm), so the
  // chip comes back by flipping this; nothing else changes.
  var SHOW_CRM_CHIP = false;

  function crmChip(a) {
    var D = LAST[CUR_SLOT] || {};
    if (!SHOW_CRM_CHIP || !D.crm_enabled) return '';
    if (!a.crm) {
      var why = (D.crm_meta && D.crm_meta.error) ? D.crm_meta.error : 'not a CRM user by this name';
      return '<span class="sms sms-na" title="Zoho CRM, this window: ' + esc(why) + '">CRM not read</span>';
    }
    // The row shows what got DONE; the panel has created and due beside it.
    var c = a.crm.calls, t = a.crm.tasks;
    var tip = 'Zoho CRM in the window shown \u2014 calls: ' + c.created + ' created, ' + c.due + ' due, ' +
              c.completed + ' completed' + (c.overdue ? ', ' + c.overdue + ' overdue' : '') +
              '; tasks: ' + t.created + ' created, ' + t.due + ' due, ' + t.completed + ' completed' +
              (t.open ? ', ' + t.open + ' still open' : '');
    return '<span class="sms" title="' + esc(tip) + '">CRM <b>' + c.completed + '</b> calls \u00b7 <b>' +
           t.completed + '</b> tasks</span>';
  }

  // Danny, 2026-10-07: "show the SMS data in collapsed state for now until we
  // get data available for all agents" -- the row chip is off (half the
  // surgical seats have no RingEX extension yet, so it read "SMS not read"
  // down the column); the panel's SMS line stays. Flip to bring the chip back.
  // Danny, 2026-10-07 evening: "add back the subtle inbound outbound sms we
  // had for both coordinators and billers" -- every seat has its extension now.
  var SHOW_SMS_CHIP = true;

  // "Listen · Whisper" on a row that is on a RingCX call, for a supervisor
  // who is signed in. Two words, no icons, no buttons; the result replaces
  // the words for a moment and then they come back.
  function monitorLinks(a) {
    if (!CAN_MONITOR) return '';
    var p = (PRESENCE[CUR_SLOT] || {})[a.name];
    if (!p || p.source !== 'ringcx' || !p.call || !p.call.uii) return '';
    return '<span class="mon" data-uii="' + esc(p.call.uii) + '">' +
           '<a href="#" data-verb="listen">Listen</a> \u00b7 <a href="#" data-verb="whisper">Whisper</a></span>';
  }

  function smsChip(a) {
    if (!SHOW_SMS_CHIP) return '';
    // A board with SMS switched off shows nothing at all -- not "not read".
    // The server sends no SMS for such a board, so this is belt and braces
    // against a future default that would render a null as unknown.
    if ((LAST[CUR_SLOT] || {}).sms_enabled === false) return '';
    var s = a && a.sms;
    if (!s) return '';
    if (s.unknown) return '<span class="sms sms-na" title="The message store could ' +
      'not be read for this seat, so this is unknown -- not zero.">SMS not read</span>';
    var tip = s.sent + ' sent, ' + s.received + ' received' +
      (s.complete ? '' : ' -- PART of the window could not be read, so this is a floor');
    return '<span class="sms" title="' + esc(tip) + '">' +
      '<b>' + s.sent + '</b>&uarr; <b>' + s.received + '</b>&darr;' +
      (s.complete ? '' : '+') + '</span>';
  }

  // A metric cell coloured by where it lands against the KPI.
  function cell(area, value, band, label) {
    // The label only shows on phones (see .lbl), where a bare number in a
    // three-across row is unreadable without it.
    return '<div class="' + area + ' b-' + esc(band) + '">' +
           '<span class="lbl">' + esc(label) + ' </span><b>' + esc(value) + '</b></div>';
  }
  // Ahead/behind against what a normal day looks like at this hour -- not
  // against the clock. See _PACE_CURVE_DEFAULT in billing_report.py for why.
  function paceCell(pace, key, unit) {
    if (!pace) return '<div class="pc"></div>';
    var exp = pace.expected[key], act = pace.actual[key], r = pace.ratio[key];
    if (r == null) {
      return '<div class="pc early">&mdash;<span class="exp">too early</span></div>';
    }
    var pct = Math.round((r - 1) * 100);
    // The sign already says which way it is going; colour is spent only on the
    // one case that needs a decision.
    var cls = r >= 0.8 ? '' : 'b-below';
    var sign = pct > 0 ? '+' : '';
    return '<div class="pc ' + cls + '">' + sign + pct + '%' +
           '<span class="exp">exp ' + exp + (unit || '') + '</span></div>';
  }

  // A seat held out of the ranking still banked money, and the sheet knows it
  // whether or not the phone log does. These notices render instead of a row,
  // so without this the whole Collected figure disappeared for anyone the call
  // data could not rank -- which on a quiet morning is everybody.
  function collNote(a) {
    if (!a || a.collected_total == null || !a.collected_total) return '';
    return ' Collected <b>' + money(a.collected_total) + '</b> in this window.';
  }

  function money(v) {
    if (v == null) return '\u2014';
    return '$' + Math.round(v).toLocaleString();
  }

  function tgt(t, k) {
    return t[k] ? (t[k].floor + ' / ' + t[k].target + ' / ' + t[k].stretch) : '';
  }

  // One page can now hold more than one board, so the last report is kept per
  // SLOT. Presence re-renders from these, and a single shared LAST would have
  // redrawn every board with whichever report landed last.
  var LAST = {};

  function render(d, slot, subId) {
    slot = slot || 'out';
    subId = subId || 'sub';
    CUR_SLOT = slot;
    LAST[slot] = d;
    var ranked = d.ranked || [], silent = d.silent || [], stalled = d.stalled || [],
        unknown = d.unknown || [], team = d.team || {};
    if (AGENT) {   // belt and braces: the server already sends one seat
      var onlyMe = function (a) { return a && a.name === AGENT; };
      ranked = ranked.filter(onlyMe); silent = silent.filter(onlyMe);
      stalled = stalled.filter(onlyMe); unknown = unknown.filter(onlyMe);
    }
    // Danny, 2026-10-07: "dont tabulate users who have no calls or activity
    // logged today on the surgical coordinator board". On the LIVE day a seat
    // with no calls and no CRM activity is left off the table and counted in a
    // footer line, so the omission is visible. A finished range still lists
    // everyone, which was the earlier ask.
    // On the live day a seat with no calls and no CRM activity is not
    // tabulated: it is moved to the end as one quiet line -- name and its
    // status pill (Starts 1:00 PM / No Activity / Offline) -- with no rank and
    // no numbers. Danny, 2026-10-07: "users who havent started their shift
    // could be cleanly denoted, and users without any activity recorded".
    var quietSeats = [], notShown = 0, extraNotes = [];
    if (d.live) {
      ranked = ranked.filter(function (a) {
        var quietToday = !((a.totals || {}).calls) && !a.crm_created && !a.collected_total;
        if (quietToday) { quietSeats.push(a); notShown++; }
        return !quietToday;
      });
      // Danny, 2026-10-07: "collapse users not active yet today, not started
      // shift yet, or with no stats or analytics available yet". A seat whose
      // window is not read yet is the third kind: one quiet line with its
      // "Not Read" pill, not a paragraph in a NOT KNOWN YET block.
      unknown.forEach(function (a) { quietSeats.push(a); });
      unknown = [];
    }
    var T = d.targets || {}, LONG = d.long_call_seconds || 120;
    var longLbl = '≥' + Math.round(LONG / 60) + 'm';
    var longKey = 'over_' + LONG + 's';
    var multi = (d.window || {}).start !== (d.window || {}).end;

    // A single-board page is titled by its board; the landing page keeps the
    // dashboard name set when its sections were built.
    if (d.team_label && !MULTI_BOARD && !AGENT) {
      var pt = /KPI$/.test(d.team_label) ? d.team_label : d.team_label + ' KPI Board';
      $('title').textContent = pt;
      document.title = pt;
    }
    if (MULTI_BOARD && d.team_label && $('bt_' + slot)) {
      $('bt_' + slot).textContent = d.team_label;
    }

    // Two facts and, on a live day, the one that changes how every number below
    // is read. The team's own averages used to sit here too; they are the list
    // itself, restated, and they pushed the sentence onto three lines on a
    // phone before it said anything a reader could act on.
    // The ROSTER's size, not the chart's. These used to be the same number, and
    // became different the moment a seat could be ranked at zero: with three
    // seats still unfetched and one ranked, "1 seat" said the team had shrunk to
    // one person. The count a reader checks against the roster must not move
    // because of how far a rate-limited fetch has got.
    // Quiet seats were filtered OUT of `ranked` above but are still seats: a
    // surgical table where nobody has called yet read "0 seats" and fell into
    // the empty state, and its thirteen quiet lines never rendered.
    var seatsAll = ranked.length + silent.length + stalled.length + unknown.length + quietSeats.length;
    var sub = '<b>' + seatsAll + '</b> seat' + (seatsAll === 1 ? '' : 's') +
      ' &middot; <b>' + (team.agent_days || 0) + '</b> working day' +
      ((team.agent_days || 0) === 1 ? '' : 's');
    // Say it on the headline, not only in a note at the bottom: a ranking that
    // is missing seats is provisional, and the order can still change.
    if (unknown.length) {
      sub += ' &middot; <b>' + unknown.length + '</b> not read yet';
    }
    if (notShown) {
      sub += ' &middot; <b>' + notShown + '</b> not active today';
    }
    // On the live day the freshness caption moves into the strip below the
    // heading, next to the counts it qualifies; the summary line stays short.
    var freshCap = '';
    if (d.live && ranked.length && ranked[0].pace) {
      var pc = ranked[0].pace;
      // For a RingCX team these are the SAME instant -- the pace clock is pulled
      // back to where the delivered report reaches -- so the time is stated
      // once, and only its provenance changes. RingCX arrives by email, and
      // saying how far behind stops "they are quiet this hour" being read off a
      // report that simply has not landed yet.
      freshCap = (d.data_as_of
        ? 'report to <b>' + esc(d.data_as_of.as_of) + '</b> (' + d.data_as_of.lag_minutes + ' min behind)'
        : 'figures to <b>' + esc(pc.as_of) + '</b>') +
        ' &middot; day <b>' + Math.round(pc.fraction * 100) + '%</b> through, targets pro-rated' +
        ' &middot; status live';
    } else if (d.live) {
      freshCap = 'status live';
    } else {
      // isoLocal, not toISOString: in the evening the UTC date is already
      // tomorrow, so a finished day stopped being called "in progress" hours
      // early -- and the ranges the chips built were off by a day outright.
      if ((d.window || {}).end >= isoLocal(new Date())) {
        sub += ' &middot; <b>today is still in progress</b>';
      }
    }
    if (d.meta && d.meta.complete === false) {
      sub += ' &middot; <b>still fetching</b>';
    }
    // On the live day the summary line is folded under the strip, which
    // already says who is on a call, free, quiet and unread. Danny,
    // 2026-10-07: "Collapse the summary line under the strip too". A finished
    // range has no strip, so its summary line stays where it was.
    $(subId).innerHTML = d.live ? '' : sub;

    var h = '';
    // The glance strip (live day only): who is on a call, who is free, who is
    // quiet, who could not be read -- from the same presence map the pills use,
    // so it re-renders when presence lands. Danny, 2026-10-07: "redistribute
    // it to be easier to use and oversee these teams daily and live".
    if (d.live && !AGENT) {   // one person needs no team strip
      var P = PRESENCE[slot];
      if (!P) {
        h += '<div class="now"><span class="nw">status loading&hellip;</span>' +
             (freshCap ? '<span class="cap">' + freshCap + '</span>' : '') + '</div>';
      } else {
        // "Quiet" is the table's own definition -- no calls and no CRM activity
        // today -- so the strip and the summary line agree. Presence states
        // only split the rest: on a call, free, or not read.
        var nOn = 0, nFree = 0, nQuiet = quietSeats.length, nUnread = 0, nAway = 0, hasEx = false;
        ranked.concat(silent, stalled, unknown).forEach(function (a) {
          var st = (P[a.name] || {}).state || 'unknown';
          if ((P[a.name] || {}).source && P[a.name].source !== 'ringcx') hasEx = true;
          if (st === 'on_call' || st === 'ringing' || st === 'on_hold' || st === 'wrap') nOn++;
          else if (st === 'idle' || st === 'busy') nFree++;
          else if (st === 'unknown') nUnread++;
          else if (st === 'lunch' || st === 'break') nAway++;
        });
        h += '<div class="now">' +
          '<span class="nw on"><b>' + nOn + '</b>On a Call</span>' +
          // RingCX cannot say Available (lunch and wrap-up look the same), so a
          // board of RingCX seats counts On a Call and Not Active only.
          (hasEx ? '<span class="nw"><b>' + nFree + '</b>Available</span>' : '') +
          (nAway ? '<span class="nw"><b>' + nAway + '</b>On Break</span>' : '') +
          '<span class="nw"><b>' + nQuiet + '</b>Not Active</span>' +
          (nUnread ? '<span class="nw"><b>' + nUnread + '</b>Not Read</span>' : '') +
          (freshCap ? '<span class="cap">' + freshCap + '</span>' : '') +
          '</div>';
      }
      // Danny, 2026-10-07: "Add a disclaimer about the agent status pills
      // with lag and then statuses like lunch". Two honest limits of the pills,
      // stated where they are read: they trail the phones by up to a couple of
      // minutes (the page asks every 70s; the server caches RingEX presence
      // 60s and RingCX active calls 30s), and RingCX does not expose agent
      // state through the API this board has, so lunch and break cannot be
      // shown -- a RingCX agent between calls with activity today reads
      // Available.
      h += '<div class="disc">Status pills trail the phones by up to ~2 minutes. ' +
           'For RingCX seats only calls in progress are reported \u2014 not lunch, break, wrap-up or offline \u2014 ' +
           'so an agent between calls shows <b>no pill</b>, and one with no activity today reads ' +
           '<b>No Activity</b>. RingEX seats (billing) do report Available and Offline.</div>';
      h += '<details class="notes subfold"><summary>Summary</summary>' +
           '<p class="sub">' + sub + '</p></details>';
    }
    // The TARGET only. Floor and stretch were on this line too -- twelve numbers
    // to read before the first agent, to explain a scale that is now one colour.
    // Both still sit in the expand panel, next to the figure they qualify.
    var one = function (k, TT) { TT = TT || T; return TT[k] ? TT[k].target : ''; };
    if (d.mixed_targets && (d.target_groups || []).length > 1) {
      // Several jobs on one table, and Danny asked for no job labels on it. One
      // "Daily target" line would be true for some rows and wrong for the rest,
      // so there is no headline target here at all; each row is still graded
      // against its own bar, which its expand panel states next to each figure.
    } else {
      h += '<div class="key">' +
        '<span>Daily target</span>' +
        '<span>' + esc(one('talk_minutes')) + 'm talk</span>' +
        '<span>' + esc(one('calls')) + ' calls</span>' +
        '<span>' + esc(one('connected')) + ' conn</span>' +
        '<span>' + esc(one('long_calls')) + ' ' + longLbl + '</span>' +
        '<span><i class="b-below">red is under ' + esc(
           (T.talk_minutes || {}).floor || '') + 'm</i></span>' +
        '</div>';
    }

    // Collections context: one line, and deliberately no "today vs a full day"
    // ratio. Today is a part-day and collections are logged in batches, not
    // continuously, so pro-rating them against a whole day would repeat the
    // mistake that put agents on this board at 200% of expected. The typical
    // day is stated beside today and left for the reader to judge.
    var C = d.collections;
    if (C && C.total) {
        // Every figure names the RECORD it came from. "Collected" beside "all
        // payments" read as a total beside a subset -- so a Books number that
        // was legitimately smaller looked like an error. They are two separate
        // records of the same week and the labels have to say so.
        var bits = [];
        if (d.live) {
            bits.push('Billers logged <b>' + money(C.today) + '</b> today');
            if (C.typical_day) bits.push('typical day <b>' + money(C.typical_day) + '</b>');
        } else {
            bits.push('Billers logged <b>' + money(C.total) + '</b>');
            if (C.days_with_money) bits.push('over <b>' + C.days_with_money + '</b> day' +
                                             (C.days_with_money === 1 ? '' : 's'));
            if (C.typical_day) bits.push('<b>' + money(C.typical_day) + '</b> a day');
        }
        if (C.trend_pct != null) {
            bits.push('trending <b>' + (C.trend_pct > 0 ? '+' : '') + C.trend_pct + '%</b>');
        }
        // The gap runs both ways and means something different each way, so it
        // is named rather than signed. Books ahead IS the self-service money --
        // the thing this was added to surface. The sheet ahead is money Books
        // never saw, which is what cash looks like.
        var P = C.payments;
        if (P && P.available) {
            var gap = '';
            if (P.difference) {
                gap = P.sheet_exceeds_books
                    ? ' &mdash; <b>' + money(-P.difference) + '</b> less, so the sheet holds ' +
                      'payments Books never saw'
                    : ' &mdash; <b>' + money(P.difference) + '</b> more, paid without a biller';
            }
            bits.push('Books shows <b>' + money(P.all_payments) + '</b>' + gap);
        }
        h += '<div class="key coll">' + bits.map(function (b) {
            return '<span>' + b + '</span>'; }).join('') + '</div>';
    }

    // Why the payments half is missing, when it is. An absent number that never
    // explains itself is how the collections column spent a day reading zero.
    if (C && C.payments && !C.payments.available && C.total) {
        extraNotes.push({kind: 'books_payments',
                         message: 'Payments from Books are not being counted: ' + C.payments.reason});
    }

    if (!ranked.length && !silent.length && !stalled.length && !unknown.length && !quietSeats.length) {
      $(slot).innerHTML = h + '<div class="empty">No seats on the roster.</div>';
      return;
    }

    if (d.blocked) {
      // One line by default. The full explanation is three paragraphs and three
      // bullets -- worth having, but not worth burying the board under on a
      // phone every time someone opens it.
      h += '<details class="blocked"><summary><b>These numbers are not this ' +
           'team\'s performance</b> &mdash; no RingCX report for this window yet' +
           '</summary><div class="bd">' + esc(d.blocked.message) +
           '<ul>' + (d.blocked.unblock || []).map(function (u) {
             return '<li>' + esc(u) + '</li>';
           }).join('') + '</ul></div></details>';
    }

    var live = !!d.live;
    // Only billing has a collections sheet behind it -- and the question is
    // whether the BOARD has collections, not whether the ranked seats do.
    //
    // Asking `ranked` alone meant the whole Collected column vanished on any
    // view where nobody made it into the ranking: a today view with sparse or
    // rate-limited call data leaves every seat in silent/stalled, and the
    // column disappeared with them, while a 7- or 30-day view of the same
    // sheet showed it fine. Collections come from the sheet; whether a seat
    // dialled has nothing to do with whether they banked money.
    var hasColl = [].concat(ranked, silent, stalled, unknown, quietSeats)
      .some(function (a) { return a && a.collected_total != null; });
    // Danny, 2026-10-07 evening: "remove % vs expected column for surgical
    // coordinators". The pace still colours the talk cell; the column goes.
    var paceCol = live && d.pace_column !== false;
    h += '<div class="' + (live ? 'live' : '') + (live && !paceCol ? ' nopace' : '') + (hasColl ? ' hascoll' : '') + '">';
    // No column headings over an empty list. When nothing ranks, the seats
    // render as notices below and a bare header row sits over nothing.
    if (ranked.length) h += '<div class="hd">' +
      '<div class="a-rk"></div><div class="a-nm">Agent</div>' +
      '<div class="a-tk">' + (live ? 'So far' : 'Talk/day') + '</div>' +
      (paceCol ? '<div class="a-pc">vs expected</div>' : '') +
      '<div class="a-c">' + (d.split_direction ? 'In / Out' : 'Calls') + '</div>' +

      (hasColl ? '<div class="a-co">Collected</div>' : '') + '</div>';

    ranked.forEach(function (a, i) {
      // `worked` = the working-day figures every per-day average is derived from.
      // `totals` includes idle-day stray dials; showing those here instead would
      // make the panel disagree with the row above it.
      var g = a.grades || {}, p = a.per_day || {}, tot = a.worked || a.totals || {};
      var all = a.totals || {};
      // Scoped to the slot: two boards on one page each numbered their rows
      // d0, d1... and getElementById found the FIRST, so expanding a row on the
      // second board opened the first board's panel for a different person.
      var id = slot + '_d' + i;
      // On a live day the numbers ARE the part-day so far, and the colour comes
      // from where the day is HEADED -- colouring a half-finished day against a
      // whole-day target just paints everyone red until the evening.
      var pace = a.pace;
      var band = pace && pace.grades ? (pace.grades.talk_minutes || a.band) : a.band;
      var show = pace ? pace.actual : p;
      var pg = pace && pace.grades ? pace.grades : g;
      // Danny, 2026-10-07: "collapse users without any active calls for the
      // day". On the live day a seat with no calls yet is one quiet line.
      var quiet = live && (((a.totals || {}).calls || 0) === 0);
      if (quiet) {
        h += '<div class="r r-quiet" data-det="' + id + '" tabindex="0" role="button" aria-expanded="false">' +
          '<div class="rk">' + (i + 1) + '</div>' +
          '<div class="nm">' + esc(a.name) + presenceChip(a) + monitorLinks(a) + crmChip(a) + smsChip(a) + srcChip(a) + '</div>' +
          '<div class="qn">' + (a.complete ? 'no calls yet today' : 'not read yet') + '</div>' +
          '</div>';
      } else
      h += '<div class="r' + (band === 'below' ? ' r-below' : '') + '" data-det="' + id +
           '" tabindex="0" role="button" aria-expanded="false">' +
        '<div class="rk">' + (i + 1) + '</div>' +
        '<div class="nm">' + esc(a.name) + presenceChip(a) + monitorLinks(a) + crmChip(a) + smsChip(a) + srcChip(a) + '</div>' +
        cell('tk', show.talk_minutes + 'm', pg.talk_minutes || 'below',
             live ? 'Talk so far' : 'Talk/day') +
        (paceCol ? paceCell(pace, 'talk_minutes', 'm') : '') +
        // Queue teams show the two directions; one handled-calls number hid
        // that a surgical coordinator's day is mostly inbound. The colour
        // still grades the KPI (handled calls), which is what has a target.
        (d.split_direction
          ? cell('c', (show.inbound == null ? '\u2014' : show.inbound) + ' in \u00b7 ' +
                      (show.outbound == null ? '\u2014' : show.outbound) + ' out',
                 pg.calls || 'below', 'In / Out')
          : cell('c', show.calls, pg.calls || 'below', 'Calls')) +
        // Connected and the long-call count left the row on 2026-10-07 (Danny:
        // "remove Conn ≥2m and put those away into the collapsed state"); both
        // are still lines in the expand panel, with their bars.
        (hasColl ? '<div class="co"><span class="lbl">Collected </span><b>' +
                   money(a.collected_total) + '</b></div>' : '') +
        '</div>';

      var days = (a.days || []);
      var worked = days.filter(function (x) { return x.worked; });
      var peak = Math.max.apply(null, days.map(function (x) { return x.talk_minutes; }).concat([1]));
      // Two groups, not one list: what the day is adding up to, then how good
      // the calls are. The schedule and the line are the footer's own group.
      var TODAY_M = [['talk_minutes', 'Talk', 'm'], ['calls', 'Calls', '']];
      var QUAL_M = [['connected', 'Connected', ''], ['long_calls', longLbl, '']];
      var grp = function (t) { return '<div class="grp">' + t + '</div>'; };

      // One table, not a wall of tiles. A live day answers "where are they, where
      // should they be, where will they land"; a finished range answers "per day
      // and in total". Everything else is one quiet footnote.
      var body;
      // A line per metric, not a table. The table was sixteen numbers of which
      // eight were already on the row above (Now) or in the legend (Target),
      // laid out in four columns that did not fit a phone -- Target, the number
      // the others are read against, fell off the right edge. One sentence each
      // says the same thing in the order it is asked: where they are, where that
      // lands, what the bar is.
      // What each line means, behind its label (hover). Danny, 2026-10-08:
      // "add tooltips where needed". Keyed by the label text so every line
      // gets one without each call site carrying it.
      var TIP = {
        'Talk': 'Minutes on connected calls (RingCX interaction time; wrap excluded). The target is the daily bar, pro-rated through the shift on a live day.',
        'Calls': 'Outbound dials plus inbound calls answered. Unanswered inbound rolls to another agent and is not counted.',
        'Wrap': 'After-call work minutes from the RingCX report. Handle = talk + wrap.',
        'Inbound': 'Inbound interactions and how many of them this agent answered.',
        'Outbound': 'Outbound dials, answered or not.',
        'Collected': 'Payments in Books attributed to this biller in the window.',
        'Per day': 'Collected divided by the days that had a payment.',
        'Started': 'First interaction of the day, against the shift on file. Red when more than 5 minutes after the start. To fix: be on the phone at the shift start -- the first interaction is what counts.',
        'Last call': 'Last interaction of a finished day, against the shift end. Red when more than 15 minutes before it.',
        'Longest gap': 'Longest silence between the end of one interaction and the start of the next. Lunch is expected; red from 90 minutes. To fix: keep silences outside lunch under 90 minutes; between inbound calls work My Journey Calls.',
        'Started late': 'Days the first interaction came more than 5 minutes after the shift start.',
        'Left early': 'Days the last interaction came more than 15 minutes before the shift end.',
        'Connect rate': 'Answered dials divided by dials. Separates reaching people from dialing numbers. To fix: dial when patients answer, leave a voicemail and a text, and set Next Coordinator Call on the Journey.',
        'Reached': 'Distinct numbers dialed; dials per person shows redial churn. To fix: fewer redials of one number, more different patients.',
        'Answered': 'Inbound calls answered by this agent, of the inbound that reached them. To fix: pick up queue calls; a missed inbound rolls to a teammate.',
        'Connected': 'Calls that connected (outbound answered or inbound accepted).',
        'CRM calls': 'Zoho Calls owned by this person with a start time in the window: completed and overdue; logged = created in the window. To fix: Calls > My Journey Calls, overdue first; mark Completed even on no answer.',
        'Tasks': 'Zoho Tasks owned by this person: due in the window, completed, still open. To fix: Tasks > My Today + Overdue Tasks.',
        'Journeys': 'Journeys (patient cases) owned by this coordinator with Case Status Active.',
        'Planner calls': 'The cadence planner\u2019s \u201cJourney call \u2013 \u2026\u201d calls due in the window: done, overdue, still scheduled. To fix: Calls > My Journey Calls, overdue first; never leave one Overdue.',
        'Surgeries': 'Active Journeys owned by this coordinator with a surgery date inside the next 14 days. Where: Journeys > My Upcoming Surgeries (30 Days).',
        'Not ready': 'Of those surgeries: labs pending, medical clearance pending, or a balance still due. A blank status is not counted as a finding. Where: Journeys > Within 14 Days - Not Ready. Open each Journey: set Lab Status and MC Status as items arrive, or collect the balance.',
        'SMS': 'Texts sent and received on this seat\u2019s RingEX extension in the window.',
        'Text replies': 'Minutes from an inbound text to the next outbound to that number. Consecutive inbound texts before a reply count as one wait; unanswered = still waiting at the end of the window. To fix: answer inbound texts within 15 minutes in the RingEX app; an unanswered text still counts the next day.'
      };
      // the long-call label is built from the threshold, so its tip is too
      TIP[longLbl] = 'Connected calls that ran ' + longLbl + ' or longer -- a real conversation, not a pickup.';
      var line = function (label, value, tail, band, tip) {
        var t = tip !== undefined ? tip : TIP[label];
        return '<div class="ln"><span class="lb"' + (t ? ' title="' + esc(t) + '"' : '') + '>' + label + '</span>' +
               '<span class="vl' + (band ? ' b-' + band : '') + '">' + value + '</span>' +
               (tail ? '<span class="tl">' + tail + '</span>' : '') + '</div>';
      };
      // A titled block of lines; nothing at all when there are no lines.
      var blk = function (title, lines, tip) {
        return lines ? '<div class="g"><div class="grp"' + (tip ? ' title="' + esc(tip) + '"' : '') + '>' + title + '</div>' + lines + '</div>' : '';
      };
      // What a connected call was worth. The one collections figure the call
      // columns cannot express: a seat can sit bottom on talk time and top on
      // takings, and only this says so.
      var collLine = '';
      if (a.collected_total) {
        // Per-connected only. Adding "$14,419/day over 6 days" ran past the
        // line on a phone and got an ellipsis, and it is the team line's
        // figure repeated for one seat -- the per-connected number is the one
        // nothing else on the board says.
        collLine = line('Collected', money(a.collected_total),
                        a.collected_per_connected
                          ? money(a.collected_per_connected) + ' per connected call'
                          : '');
        if (!pace && a.collected_days)
          collLine += line('Per day', money(a.collected_per_day || 0),
                           'over ' + a.collected_days + ' day' + (a.collected_days === 1 ? '' : 's') + ' with payments', '');
      }

      // Wrap is a line of its own, not a scored metric: talk time is what the
      // KPI judges. It earns the space because the RingCX report's Handle Time
      // column is talk + wrap, and without it the two reports disagree by a
      // number nobody can locate. Only shown where there IS any -- RingEX has
      // no after-call work, so on the billing board this stays absent.
      var wrapLine = '';
      if (a.wrap_minutes || (a.per_day || {}).wrap_minutes) {
        wrapLine = pace
          ? line('Wrap', a.wrap_minutes + 'm',
                 'handle <b>' + a.handle_minutes + 'm</b>')
          : line('Wrap', (a.per_day.wrap_minutes || 0) + 'm/day',
                 a.wrap_minutes + 'm total &middot; handle ' + a.handle_minutes + 'm');
      }

      // SMS detail. Sent and received are shown separately and never summed
      // into one "messages" figure: outbound is work the agent did, inbound is
      // work that arrived, and adding them hides which.
      // Direction, on the queue tables: what the In / Out cell shows, spelled
      // out, with how much of the inbound was actually answered.
      var dirLines = '';
      if (d.split_direction) {
        var pdx = a.per_day || {};
        if (pace) {
          var tw = a.worked || a.totals || {};
          dirLines = line('Inbound', (tw.inbound || 0) + ' today', (tw.inbound ? (tw.inbound_answered || 0) + ' answered' : '')) +
                     line('Outbound', (tw.dials || 0) + ' today', '');
        } else {
          dirLines = line('Inbound', (pdx.inbound == null ? '\u2014' : pdx.inbound) + ' per day',
                          (pdx.inbound_answered == null ? '' : pdx.inbound_answered + ' answered per day')) +
                     line('Outbound', (pdx.outbound == null ? '\u2014' : pdx.outbound) + ' per day', '');
        }
      }
      // Zoho CRM in the panel, as performance: what was DUE in the window and
      // how much of it got done, with what was logged beside it. Danny,
      // 2026-10-07 (evening): "add the task and call crm analytics in the
      // expanded pane ... whatever you feel is applicable to see performance".
      // The row chip stays off; this is the only place CRM shows.
      var SHOW_CRM_PANEL = true;
      var crmLines = '', journeyLines = '', readyLines = '';
      var crmOn = (LAST[CUR_SLOT] || {}).crm_enabled;
      if (SHOW_CRM_PANEL && crmOn) {
        if (a.crm) {
          var cc = a.crm.calls, tt = a.crm.tasks;
          var rate = function (done, due) { return due ? Math.round(100 * done / due) + '%' : '\u2014'; };
          crmLines =
            (cc.due
              ? line('CRM calls', cc.completed + ' of ' + cc.due + ' done',
                     rate(cc.completed, cc.due) + (cc.overdue ? ' \u00b7 <b>' + cc.overdue + ' overdue</b>' : '') +
                     ' \u00b7 ' + cc.created + ' logged', cc.overdue ? 'below' : '')
              : line('CRM calls', cc.completed + ' done', 'none due \u00b7 ' + cc.created + ' logged', '')) +
            (tt.due
              ? line('Tasks', tt.completed + ' of ' + tt.due + ' done',
                     rate(tt.completed, tt.due) + (tt.open ? ' \u00b7 <b>' + tt.open + ' still open</b>' : '') +
                     ' \u00b7 ' + tt.created + ' created', tt.open ? 'below' : '')
              : line('Tasks', tt.completed + ' done', 'none due \u00b7 ' + tt.created + ' created', ''));
          // The coordinator's caseload from the Journeys module (the planner
          // sets Journey Owner to the coordinator): cases owned, the planner's
          // own calls in the window, and surgeries inside 14 days that are
          // not ready -- labs, medical clearance, balance. Danny, 2026-10-08.
          var jn = a.crm.journeys;
          if (jn) {
            var jc = jn.journey_calls || {}, so = jn.soon || {};
            journeyLines += line('Journeys', jn.active + ' active', 'cases owned', '');
            if (jc.due)
              journeyLines += line('Planner calls', jc.completed + ' of ' + jc.due + ' done',
                                   (jc.overdue ? '<b>' + jc.overdue + ' overdue</b> &middot; ' : '') + jc.scheduled + ' scheduled',
                                   jc.overdue ? 'below' : '');
            // Surgery readiness, the block Danny asked for by name: the count
            // inside 14 days, how many are not ready, and the three reasons as
            // chips -- each reason with its definition behind it.
            if (so.total) {
              readyLines += line('Surgeries', so.total, 'inside the next 14 days', '');
              readyLines += line('Not ready', so.not_ready, so.not_ready ? 'need labs, clearance or payment' : 'all cleared and paid',
                                 so.not_ready ? 'below' : '');
              if (so.not_ready) {
                // each chip opens the Zoho view where those cases sit
                var chip = function (n, lbl, tip, url) {
                  return n ? '<a class="rc hot" href="' + esc(url) + '" target="_blank" rel="noopener" title="' + esc(tip) + '">' + lbl + ' <b>' + n + '</b> \u2197</a>' : '';
                };
                readyLines += '<div class="rd">' +
                  chip(so.labs, 'Labs pending', 'Lab Status is Not Received, In Review, Rejected, Further Review Needed or Incomplete. Where: Journeys > Within 14 Days - Not Ready, sort by Lab Status. Chase the patient; set Lab Status when the result is in.', ZOHO.notReady) +
                  chip(so.mc, 'Clearance pending', 'MC Status is awaiting submission, pending review, needs more info, not approved or rejected. Where: Journeys > Medical Action Needed (and Within 14 Days - Not Ready). Get the clearance letter; set MC Status when received.', ZOHO.medical) +
                  chip(so.balance, 'Balance due', 'Journey Balance Due is above zero. Where: Journeys > Within 14 Days - Not Ready. Collect it, or hand it to billing with a note on the Journey.', ZOHO.notReady) +
                  '</div>';
              }
            }
          }
        } else {
          var cm = (LAST[CUR_SLOT] || {}).crm_meta || {};
          crmLines = line('CRM', 'not read', cm.error ? esc(cm.error) : 'not a CRM user by this name', '');
        }
      }
      var smsLine = '';
      if (a.sms && a.sms.unknown) {
        // the fetch's own reason -- a budget left for the next refresh, a
        // cooldown, an HTTP status -- never a guessed "refused"
        smsLine = line('SMS', 'not read',
                       a.sms.note ? esc(a.sms.note) : 'not read this refresh; the next one continues');
      } else if (a.sms) {
        smsLine = line('SMS', a.sms.sent + ' sent / ' + a.sms.received + ' received',
                       a.sms.sent_per_day + ' sent per working day &middot; texted on ' +
                       a.sms.active_days + ' day' + (a.sms.active_days === 1 ? '' : 's') +
                       (a.sms.complete ? '' : ' &middot; <b>partial read</b>'));
      }

      var body, mline;
      if (pace) {
        mline = function (m) {
          var k = m[0], u = m[2], pj = pace.projected[k];
          var t = (T[k] || {}).target;
          return line(m[1], pace.actual[k] + u,
                      (pj == null ? 'too early to project'
                                  : 'on track for <b>' + pj + u + '</b>') +
                      (t != null ? ' &middot; target ' + t + u : ''),
                      pace.grades[k] || 'below');
        };
      } else {
        var totals = {talk_minutes: hm(tot.talk_seconds), calls: tot.handled_calls,
                      connected: tot.connected, long_calls: tot[longKey]};
        mline = function (m) {
          var k = m[0], u = m[2], t = (T[k] || {}).target;
          return line(m[1], p[k] + u + '/day',
                      totals[k] + ' total' + (t != null ? ' &middot; target ' + t + u : ''),
                      g[k] || 'below');
        };
      }
      // How the day was WORKED -- the parameters a supervisor could not see
      // anywhere (Danny, 2026-10-08): start against the shift, the longest
      // silence, how many people the dials reached, how fast texts were
      // answered. Panel only; the row stays as it is.
      var dayLines = '', reachLines = '', textLines = '';
      var dy = a.day || {}, fo = dy.focus, gp = a.gaps || {}, re = a.reach || {};
      if (fo) {
        var lateTail = dy.shift ? (fo.late_minutes > 5 ? '<b>' + fo.late_minutes + ' min after</b> the ' + esc(dy.shift.start) + ' start'
                                   : 'shift starts ' + esc(dy.shift.start)) : 'no shift on file';
        dayLines += line('Started', fo.first, lateTail, fo.late_minutes > 5 ? 'below' : '');
        if (fo.last) {
          var earlyTail = dy.shift ? (fo.early_minutes > 15 ? '<b>' + fo.early_minutes + ' min before</b> the ' + esc(dy.shift.end) + ' end'
                                      : 'shift ends ' + esc(dy.shift.end)) : '';
          dayLines += line('Last call', fo.last, earlyTail, fo.early_minutes > 15 ? 'below' : '');
        }
        if (fo.gap_minutes != null && fo.interactions > 1)
          dayLines += line('Longest gap', fo.gap_minutes + ' min', fo.gap_window ? esc(fo.gap_window) : '', fo.gap_minutes >= 90 ? 'below' : '');
      } else if (dy.shift_days) {
        dayLines += line('Started late', dy.late_days + ' of ' + dy.shift_days + ' days',
                         'more than 5 min after ' + esc(dy.shift.start) + (dy.avg_late_minutes != null ? ' &middot; avg ' + dy.avg_late_minutes + ' min' : ''),
                         dy.late_days ? 'below' : '');
        if (dy.early_days != null && dy.avg_early_minutes != null)
          dayLines += line('Left early', dy.early_days + ' of ' + dy.shift_days + ' days',
                           'last call more than 15 min before ' + esc(dy.shift.end), dy.early_days ? 'below' : '');
        if (gp.avg_max_minutes != null) dayLines += line('Longest gap', gp.avg_max_minutes + ' min', 'average of each day\u2019s longest silence', '');
      }
      if (re.dials) {
        reachLines += line('Connect rate', re.connect_rate_pct + '%', re.connected_dials + ' of ' + re.dials + ' dials answered', re.connect_rate_pct < 25 ? 'below' : '');
        if (re.numbers_known && re.unique_outbound)
          reachLines += line('Reached', re.unique_outbound, re.dials_per_contact + ' dials per person' +
                             (re.unique_contacts > re.unique_outbound ? ' &middot; ' + re.unique_contacts + ' incl. inbound' : ''), '');
      }
      if ((tot.inbound || 0) > 0)
        reachLines += line('Answered', tot.inbound_answered + ' of ' + tot.inbound + ' inbound', a.answer_rate_pct + '%', a.answer_rate_pct < 50 ? 'below' : '');
      var rp = a.sms && a.sms.replies;
      if (rp && rp.threads) {
        textLines += line('Text replies', rp.median_minutes != null ? 'median ' + rp.median_minutes + ' min' : 'none yet',
                          rp.replied + ' answered' + (rp.unanswered ? ' &middot; <b>' + rp.unanswered + ' unanswered</b>' : '') +
                          (rp.within_15_pct != null ? ' &middot; ' + rp.within_15_pct + '% within 15 min' : ''),
                          rp.unanswered ? 'below' : '');
      }
      // Left: the phone -- what the day adds up to, how it was worked, who
      // it reached, how good the calls were. Right: the CRM -- what was due
      // and done, the caseload, surgery readiness, texts. Empty blocks vanish.
      // A coordinator's own page: the red items first, each with the Zoho
      // view where the work is. Danny, 2026-10-08: "tooltips of how they can
      // resolve the stat ... where to find those in Zoho".
      var fixLines = '';
      if (AGENT) {
        var zl = function (url, label) { return '<a class="zl" href="' + esc(url) + '" target="_blank" rel="noopener">' + label + ' \u2197</a>'; };
        var jn2 = (a.crm || {}).journeys || {}, jc2 = jn2.journey_calls || {}, so2 = jn2.soon || {}, tt2 = (a.crm || {}).tasks || {};
        if (jc2.overdue) fixLines += line('Overdue calls', jc2.overdue, zl(ZOHO.myCalls, 'open My Journey Calls') + ' &middot; mark each Completed, even on no answer', 'below',
                                          'Planner calls whose start time has passed and are not Completed.');
        if (so2.labs) fixLines += line('Labs', so2.labs + ' pending', zl(ZOHO.notReady, 'open Within 14 Days - Not Ready') + ' &middot; chase, then set Lab Status', 'below',
                                       'Surgeries inside 14 days with Lab Status still pending.');
        if (so2.mc) fixLines += line('Clearance', so2.mc + ' pending', zl(ZOHO.medical, 'open Medical Action Needed') + ' &middot; get the letter, then set MC Status', 'below',
                                     'Surgeries inside 14 days with medical clearance still pending.');
        if (so2.balance) fixLines += line('Balance due', so2.balance, zl(ZOHO.notReady, 'open Within 14 Days - Not Ready') + ' &middot; collect, or hand to billing', 'below',
                                          'Surgeries inside 14 days with Journey Balance Due above zero.');
        if (tt2.open) fixLines += line('Open tasks', tt2.open, zl(ZOHO.tasks, 'open My Today + Overdue Tasks'), 'below', 'Tasks due in the window and not completed.');
        if (rp && rp.unanswered) fixLines += line('Texts', rp.unanswered + ' unanswered', 'reply in the RingEX app &middot; within 15 minutes', 'below',
                                                  'Inbound texts with no reply yet.');
        if (fo && fo.late_minutes > 5) fixLines += line('Start', fo.late_minutes + ' min late', 'first interaction after the ' + esc((dy.shift || {}).start || '') + ' start', 'below',
                                                        'Be on the phone at the shift start; the first interaction is what counts.');
        if (!fixLines) fixLines = line('All clear', '\u2713', 'nothing red right now', '', 'No overdue calls, nothing pending inside 14 days, no unanswered texts.');
      }
      body = '<div class="lns"><div class="col">' +
        blk(pace ? 'Today' : 'This range', TODAY_M.map(mline).join('') + wrapLine + dirLines) +
        blk('Day', dayLines, 'How the day was worked, against the shift on file') +
        blk('Reach', reachLines, 'People, not dials') +
        blk('Quality', QUAL_M.map(mline).join('')) +
        '</div><div class="col">' +
        blk('What to fix now', fixLines, 'Your red items, each with the Zoho view where the work is') +
        blk('Collections', collLine, 'Payments in Books attributed to this biller in the window') +
        blk('CRM', crmLines, 'Zoho CRM calls and tasks owned by this person, in the window shown') +
        blk('Journeys', journeyLines, 'The Journeys module: cases owned and the planner\u2019s calls') +
        blk('Surgery readiness', readyLines, 'Surgeries inside 14 days and what still stands in the way') +
        blk('Texts', smsLine + textLines, 'SMS on the RingEX extension') +
        '</div></div>';

      // One line, and only facts that are not already on the row or in the
      // table above it. The share of connected calls running over two minutes
      // was the count beside it expressed as a percentage; the pace sentence
      // restated the page header; the working-day count is in the header too.
      var bits = ['Ext ' + esc(a.ext || a.ext_id),
                  'avg call ' + a.avg_call_seconds + 's',
                  'longest ' + hm(tot.longest_seconds)];
      // The declared shift, when there is one. It is also what the live day is
      // paced on for this seat, instead of the team curve.
      if (a.shift && a.shift.start) {
        bits.push('Shift ' + esc(a.shift.start) + '\u2013' + esc(a.shift.end) +
                  ((a.shift.off || []).length ? ' \u00b7 off ' + esc((a.shift.off || []).map(function (d) {
                    return d.charAt(0).toUpperCase() + d.slice(1); }).join('/')) : ''));
      }
      if (!pace) bits.push('median day ' + a.median_talk_minutes + 'm');
      if (!pace && a.idle_days) bits.push(a.idle_days + ' idle days not averaged');
      if (pace && !pace.projectable) bits.push('too early to project');
      var foot = bits.join(' &middot; ');

      h += '<div class="det" id="' + id + '">' + body + grp('Schedule &amp; line') +
        (multi && days.length ?
          '<div class="spark"><div class="cap">Talk per day</div>' +
          '<div class="bars">' + days.map(function (x) {
            return '<div class="' + (x.worked ? '' : 'off') + '" title="' + esc(x.date) +
                   ': ' + x.talk_minutes + ' min, ' + x.connected + ' connected" style="height:' +
                   Math.max(2, Math.round(100 * x.talk_minutes / peak)) + '%"></div>';
          }).join('') + '</div></div>' : '') +
        '<div class="foot">' + foot + '</div></div>';
    });

    h += '</div>';   // close .live / plain list wrapper

    if (stalled.length) {
      h += '<h2>Dialling but not connecting</h2>';
      stalled.forEach(function (a) {
        var t = a.totals || {};
        h += '<div class="warn bad"><b>' + esc(a.name) + '</b> &mdash; <b>' + t.calls +
             '</b> call(s), <b>none</b> connected. Held out of the ranking: a line that ' +
             'never connects is broken, not last.' + collNote(a) + '</div>';
      });
    }

    // The quiet seats, after the ranked rows: one line each, no rank, no
    // numbers -- the pill is the whole message.
    if (quietSeats.length) h += '<div class="qhd">Not active today</div>';
    quietSeats.forEach(function (a, qi) {
      var qid = slot + '_q' + qi;
      h += '<div class="r r-quiet" data-det="' + qid + '" tabindex="0" role="button" aria-expanded="false">' +
        '<div class="rk">&ndash;</div>' +
        '<div class="nm">' + esc(a.name) + presenceChip(a) + monitorLinks(a) + crmChip(a) + smsChip(a) + srcChip(a) + '</div>' +
        // Danny, 2026-10-07, on six quiet seats reading only "No Activity":
        // "not showing any shift sched". They have no shift on file -- the
        // schedule sheet named eleven people -- and the line now says so,
        // because a bare "No Activity" reads as a verdict on the person.
        '<div class="qn">' + (!a.complete ? 'not read yet' : (a.shift ? '' : 'no shift on file')) +
          (a.collected_total ? ' &middot; collected <b>' + money(a.collected_total) + '</b>' : '') + '</div>' +
        '</div>';
    });

    if (unknown.length) {
      h += '<h2>Not known yet</h2>';
      unknown.forEach(function (a) {
        h += '<div class="warn"><b>' + esc(a.name) + '</b> &mdash; window <b>not fully ' +
             'read</b>, so this is not known rather than no calls. Reload shortly.</div>';
      });
    }

    if (silent.length) {
      h += '<h2>No calls logged</h2>';
      silent.forEach(function (a) {
        var ext = (a.ext || a.ext_id) ? ' (ext ' + esc(a.ext || a.ext_id) + ')' : '';
        h += '<div class="warn bad"><b>' + esc(a.name) + '</b>' + ext +
             ' &mdash; no calls at all. An empty seat, a wrong extension, or the wrong ' +
             'platform &mdash; not a zero score.' + collNote(a) + '</div>';
      });
    }

    // Banked money from someone the board does not rank. Keying the board on the
    // CALL roster alone hid these takings entirely -- Ana Salazar collected daily
    // while her line sat on Inbound. She is now a billing seat read from RingCX
    // and ranks above, so this section is for whoever is next: shown with the
    // money, and NOT ranked, because there is no talk time to rank them on.
    var collectors = d.collectors || [];
    if (collectors.length) {
      h += '<h2>Collecting from another line</h2>';
      collectors.forEach(function (a) {
        var money_ = '<b>' + money(a.collected_total) + '</b> collected on <b>' +
                     a.collected_days + '</b> day(s)';
        var calls = '';
        if (a.calls_tracked) {
          // Their calls, from whichever platform they actually work on, beside
          // the money. Stated, never graded: these are not billing's targets.
          calls = ' &middot; <b>' + a.calls + '</b> call' + (a.calls === 1 ? '' : 's') +
                  ', <b>' + a.connected + '</b> connected, <b>' +
                  hm(Math.round((a.talk_minutes || 0) * 60)) + '</b> talk over <b>' +
                  a.call_days + '</b> day(s) on <b>' + esc(a.call_source || 'another line') +
                  '</b>';
        } else if (a.call_source) {
          calls = ' &middot; calls are on <b>' + esc(a.call_source) + '</b>, but no report ' +
                  'covering this window has been delivered &mdash; which is not the same ' +
                  'as making none';
        }
        h += '<div class="warn"><b>' + esc(a.name) + '</b>' +
             (a.ext ? ' (ext ' + esc(a.ext) + ')' : '') + ' &mdash; ' + money_ + calls +
             '. Held out of the ranking: these calls are not measured against ' +
             'billing\'s targets.</div>';
      });
    }

    var warns = (d.warnings || []).filter(function (x) {
      return x.kind !== 'no_activity' && x.kind !== 'no_connections' &&
             x.kind !== 'unknown_seat';
    });
    warns = warns.concat(extraNotes);
    if (warns.length) {
      // Danny, 2026-10-07: "collapse data notes sections slightly". Folded
      // behind one line with the count; the table is what the page is for.
      h += '<details class="notes"><summary>' + warns.length + ' data note' +
           (warns.length === 1 ? '' : 's') + '</summary>';
      warns.forEach(function (x) {
        h += '<div class="warn' + (x.kind === 'incomplete_fetch' ? ' bad' : '') + '">' +
             esc(x.message) +
             (x.values ? ' (' + x.values.map(function (v) {
               return esc(v[0]) + ' ×' + v[1];
             }).join(', ') + ')' : '') + '</div>';
      });
      h += '</details>';
    }

    var m = d.meta || {};
    h += '<div class="floor">' + esc(d.source_label || 'Call log') +
         '<span class="sep">&middot;</span>' +
         (m.cached ? (m.age_seconds || 0) + 's old' : 'live') +
         '<span class="sep">&middot;</span>connected calls only' +
         // Which time this is. The RingCX report's own column is Handle Time =
         // talk + wrap, and comparing the two without knowing that reads as a
         // discrepancy rather than as two different measurements.
         '<span class="sep">&middot;</span>talk time, wrap excluded' +
         '</div>';

    $(slot).innerHTML = h;

    $(slot).querySelectorAll('.r[data-det]').forEach(function (row) {
      var toggle = function () {
        var panel = document.getElementById(row.getAttribute('data-det'));
        if (!panel) return;
        var wasOpen = panel.classList.contains('on');
        $(slot).querySelectorAll('.det.on').forEach(function (o) { o.classList.remove('on'); });
        $(slot).querySelectorAll('.r[aria-expanded="true"]').forEach(function (r) {
          r.setAttribute('aria-expanded', 'false');
        });
        if (!wasOpen) {
          panel.classList.add('on');
          row.setAttribute('aria-expanded', 'true');
        }
      };
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });
    // A coordinator's own page opens on the panel: the row is the summary,
    // the panel is the point.
    if (AGENT) {
      var mine = $(slot).querySelector('.r[data-det]');
      var mpanel = mine && document.getElementById(mine.getAttribute('data-det'));
      if (mpanel) { mpanel.classList.add('on'); mine.setAttribute('aria-expanded', 'true'); }
    }
  }

  // Presence is fetched SEPARATELY from the report, and its failures stay its
  // own: this never touches $('out'), never clears the spinner, and never leaves
  // a stale pill behind. A board that loses its call figures because presence
  // 429'd would be a worse board than one with no presence at all -- and they
  // share a rate budget, so that is a live possibility rather than a hypothetical.
  function loadPresenceFor(team, slot, subId) {
    var q = new URLSearchParams();
    if (team) q.set('team', team);
    // The viewer's clock, for the shift states -- the same offset the figures
    // are built with, so "Starts 1:00 PM" and the day's percentage agree.
    q.set('tz', String(new Date().getTimezoneOffset()));
    if (SHARE && TOKEN) q.set('k', TOKEN);
    if (AGENT_SLUG) q.set('agent', AGENT_SLUG);
    var redraw = function () { if (LAST[slot]) render(LAST[slot], slot, subId); };
    fetch('/api/v6/presence?' + q.toString(), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.seats) {
          // Withhold rather than keep showing the last reading: presence is only
          // worth anything while it is current.
          if (PRESENCE[slot]) { delete PRESENCE[slot]; redraw(); }
          return;
        }
        var m = {};
        (j.seats || []).forEach(function (sx) { m[sx.name] = sx; });
        m.__note = j.note || '';
        PRESENCE[slot] = m;
        redraw();
      })
      .catch(function () {
        if (PRESENCE[slot]) { delete PRESENCE[slot]; redraw(); }
      });
  }

  function loadPresence() {
    BOARDS.forEach(function (t, i) {
      if (MULTI_BOARD) loadPresenceFor(t, slotId(t), subFor(t, i));
      else loadPresenceFor(t, 'out', 'sub');
    });
  }

  var INFLIGHT = 0;

  function loadBoard(team, slot, subId) {
    INFLIGHT += 1;
    $('spin').textContent = 'loading…';
    // A page that sits on "Loading…" forever tells the viewer nothing. If the
    // server drops the connection -- a killed gunicorn worker does exactly that
    // -- fetch() never settles, so the page needs its own deadline.
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var bailed = false;
    var done = function () {
      INFLIGHT = Math.max(0, INFLIGHT - 1);
      if (!INFLIGHT) $('spin').textContent = '';
    };
    var fail = function (html) {
      // In single-board mode the error replaces the page, as it always has. With
      // two boards it replaces only its own, so a billing fetch that hits the
      // RingEX limit does not blank the RingCX board beside it, which is read
      // from files and cannot have failed the same way.
      $(slot).innerHTML = html;
      $(subId).textContent = '';
    };
    var bail = setTimeout(function () {
      bailed = true;
      if (ctl) { try { ctl.abort(); } catch (e) {} }
      done();
      fail('<div class="err"><b>The server did not answer in 45 seconds.</b>' +
        '<br>RingCentral only allows 10 call-log requests a minute for the whole account, ' +
        'and this board shares that budget with the sales dashboard. Days already fetched ' +
        'are cached, so reloading usually works. If it keeps timing out, check the service logs.' +
        '</div>');
    }, 45000);
    var q = new URLSearchParams();
    if ($('start').value) q.set('start', $('start').value);
    if ($('end').value) q.set('end', $('end').value || $('start').value);
    q.set('tz', String(new Date().getTimezoneOffset()));
    if (team) q.set('team', team);
    if (SHARE && TOKEN) q.set('k', TOKEN);
    if (AGENT_SLUG) q.set('agent', AGENT_SLUG);

    fetch('/api/v6/report?' + q.toString(),
          ctl ? { credentials: 'same-origin', signal: ctl.signal }
              : { credentials: 'same-origin' })
      .then(function (r) {
        return r.text().then(function (t) {
          // A dropped worker or a proxy error returns HTML, not JSON. Parsing it
          // blind threw inside the success path and left the spinner running.
          var j; try { j = JSON.parse(t); } catch (e) {
            j = { error: 'bad_response',
                  detail: 'HTTP ' + r.status + ' — the server returned ' +
                          (t.slice(0, 120) || 'an empty body') };
          }
          return { ok: r.ok, j: j };
        });
      })
      .then(function (res) {
        if (bailed) return;
        clearTimeout(bail);
        done();
        if (!res.ok) {
          var j = res.j || {};
          fail('<div class="err"><b>' + esc(j.error || 'Request failed') +
            '</b><br>' + esc(j.detail || '') + '</div>');
          return;
        }
        render(res.j, slot, subId);
        var w = res.j.window || {};
        if (w.start && !$('start').value) { $('start').value = w.start; $('end').value = w.end; }
        syncChips();
      })
      .catch(function (err) {
        if (bailed) return;
        clearTimeout(bail);
        done();
        fail('<div class="err">Could not reach the server: ' +
          esc(err && err.message ? err.message : err) + '</div>');
      });
  }

  function subFor(t, i) { return MULTI_BOARD ? 'sub_' + slotId(t) : 'sub'; }

  function load() {
    ensureSlots();
    BOARDS.forEach(function (t, i) {
      if (MULTI_BOARD) loadBoard(t, slotId(t), subFor(t, i));
      else loadBoard(t, 'out', 'sub');
    });
  }

  // LOCAL date, not UTC. The presets used d.toISOString(), which is UTC, so
  // after 8pm Eastern every one of them asked for a range a day ahead -- "Today"
  // fetched tomorrow and came back empty. A board about a working day has to
  // count days the way the floor does.
  function isoLocal(d) {
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
             .toISOString().slice(0, 10);
  }

  // Ranges people actually ask for, not just "last N days". Yesterday is how you
  // check a finished day; the month ones are how the numbers get reported.
  function presetRange(key) {
    var now = new Date();
    var d = function (n) { var x = new Date(now); x.setDate(x.getDate() + n); return x; };
    var monthStart = function (off) {
      return new Date(now.getFullYear(), now.getMonth() + off, 1);
    };
    switch (key) {
      case 'today':      return [d(0), d(0)];
      case 'yesterday':  return [d(-1), d(-1)];
      case '7d':         return [d(-6), d(0)];
      case '30d':        return [d(-29), d(0)];
      case 'month':      return [monthStart(0), d(0)];
      case 'lastmonth':  return [monthStart(-1),
                                 new Date(now.getFullYear(), now.getMonth(), 0)];
    }
  }

  var PRESETS = [['today', 'Today'], ['yesterday', 'Yesterday'], ['7d', '7 days'],
                 ['30d', '30 days'], ['month', 'This month'], ['lastmonth', 'Last month']];

  function buildDayButtons() {
    var box = $('days');
    if (box.dataset.built) return;
    box.dataset.built = '1';
    PRESETS.forEach(function (pr) {
      var b = document.createElement('button');
      b.className = 'day'; b.type = 'button'; b.textContent = pr[1];
      b.dataset.key = pr[0];
      b.onclick = function () {
        var r = presetRange(pr[0]);
        $('start').value = isoLocal(r[0]);
        $('end').value = isoLocal(r[1]);
        syncChips();
        load();
      };
      box.appendChild(b);
    });
    syncChips();
  }

  // Highlight whichever preset the current range happens to match -- including
  // after the dates are edited by hand, so the chips describe what is on screen
  // rather than only what was last clicked.
  function syncChips() {
    var box = $('days');
    if (!box) return;
    var a = $('start').value, b = $('end').value;
    box.querySelectorAll('.day').forEach(function (x) {
      var r = presetRange(x.dataset.key);
      x.classList.toggle('on', !!r && isoLocal(r[0]) === a && isoLocal(r[1]) === b);
    });
  }

  // Open on today, explicitly. The API defaults to today anyway, but leaving the
  // pickers blank meant the board's own controls did not say what it was showing.
  (function initToday() {
    var iso = isoLocal(new Date());
    $('start').value = iso;
    $('end').value = iso;
    // Build the range controls BEFORE the first fetch, not after a successful
    // one. They used to be created in the success path, so a board whose first
    // request failed offered no way to ask for a different range -- the one
    // control that could have got it out of the error.
    buildDayButtons();
  })();

  // The range applies itself. A separate "Show" button was a second way to do
  // what picking a date already means, and picking a date and then wondering
  // why nothing moved is the whole friction being removed here.
  ['start', 'end'].forEach(function (id) {
    var el = $(id);
    el.addEventListener('change', function () {
      if (!$('start').value || !$('end').value) return;
      if ($('start').value > $('end').value) {          // swap rather than refuse
        var t = $('start').value; $('start').value = $('end').value; $('end').value = t;
      }
      syncChips();
      load();
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { syncChips(); load(); }
    });
  });
  // One listener for every Listen / Whisper link, present or future. The
  // number is asked for once and remembered; a request's outcome shows in
  // place of the two words for a few seconds.
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('.mon a[data-verb]');
    if (!a) return;
    ev.preventDefault(); ev.stopPropagation();
    var box = a.closest('.mon'), uii = box.getAttribute('data-uii'), verb = a.getAttribute('data-verb');
    var num = myNumber();
    if (!num) {
      num = window.prompt('Number to ring you on (once; remembered in this browser)', '') || '';
      num = num.trim(); if (!num) return; myNumber(num);
    }
    var was = box.innerHTML;
    box.textContent = verb === 'listen' ? 'Ringing you\u2026' : 'Whispering\u2026';
    fetch('/api/v6/monitor', {method: 'POST', credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({uii: uii, destination: num, verb: verb})})
      .then(function (r) { return r.json().then(function (j) { return {ok: r.ok, j: j}; }); })
      .then(function (res) {
        box.textContent = res.ok ? 'Connected' : (res.j && res.j.error ? res.j.error : 'Failed');
        if (!res.ok && res.j && /number/.test(res.j.error || '')) myNumber('');
        setTimeout(function () { box.innerHTML = was; }, res.ok ? 4000 : 6000);
      })
      .catch(function () { box.textContent = 'Failed'; setTimeout(function () { box.innerHTML = was; }, 6000); });
  });

  load();
  loadPresence();
  // Today's numbers move; a board left open on a wall should not go stale.
  setInterval(function () {
    var today = isoLocal(new Date());
    if (!$('end').value || $('end').value >= today) load();
  }, 120000);
  // Presence moves faster than the figures and is cheap to ask for -- the server
  // caches it for 60s, so polling costs RingCentral nothing extra however many
  // boards are open. Asked slightly slower than that cache so a poll usually
  // lands on a fresh read rather than the tail of the previous one.
  setInterval(loadPresence, 70000);
})();
</script>
</body>
</html>
