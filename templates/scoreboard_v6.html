<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Billing Team KPI Board</title>
<style>
  :root{
    --bg:#FFFFFF; --tint:#F6F8F8; --rule:#E3E9E8; --hair:#EFF3F2;
    --ink:#131C1B; --ink-2:#4A5957; --muted:#7C8B89;
    --up:#0B6E67; --dn:#B03A31; --mid:#9C6712; --stretch:#1B5FA8;
    --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#101614; --tint:#161E1C; --rule:#26302E; --hair:#1C2523;
    --ink:#EDF2F1; --ink-2:#BCC9C7; --muted:#849492;
    --up:#4FCCBF; --dn:#EE8177; --mid:#E0A542; --stretch:#6FB2F0;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
       -webkit-text-size-adjust:100%}
  .n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .wrap{max-width:760px;margin:0 auto;padding:20px 14px 44px}
  @media(min-width:640px){.wrap{padding:32px 22px 56px}}

  h1{margin:0 0 2px;font-size:20px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
  .sub b{color:var(--ink);font-weight:650}
  h2{margin:22px 0 6px;font-size:12px;font-weight:700;letter-spacing:.06em;
     text-transform:uppercase;color:var(--muted)}

  /* team switcher: the same board, three rosters */
  .teams{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
  .teams a{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:6px;
           border:1px solid var(--rule);color:var(--muted);text-decoration:none}
  .teams a:hover{border-color:var(--up);color:var(--up)}
  .teams a.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .teams a:focus-visible{outline:2px solid var(--up);outline-offset:2px}
  @media(max-width:560px){.teams a{padding:7px 12px;font-size:13px}}

  .ctl{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:12px}
  .ctl input,.ctl button{font-family:inherit;font-size:12.5px;padding:4px 8px;
       border:1px solid var(--rule);background:var(--bg);color:var(--ink);
       border-radius:5px;-webkit-appearance:none}
  .ctl button{cursor:pointer;font-weight:600}
  .ctl button:hover{border-color:var(--up);color:var(--up)}
  .ctl button:focus-visible,.day:focus-visible,.r:focus-visible{outline:2px solid var(--up);
       outline-offset:2px}
  .day{cursor:pointer;font-size:12px;font-weight:600;padding:4px 9px;border-radius:5px;
       border:1px solid var(--rule);background:var(--bg);color:var(--muted)}
  .day:hover{border-color:var(--up);color:var(--up)}
  .day.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .spin{font-size:12px;color:var(--muted)}

  .floor{font-size:12.5px;color:var(--muted);padding:8px 0;border-top:1px solid var(--rule)}
  .floor b{color:var(--ink);font-weight:700}
  .floor .sep{opacity:.45;padding:0 5px}

  /* KPI legend */
  .key{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:11px;color:var(--muted);
       padding:0 0 7px;border-bottom:1px solid var(--rule);line-height:1.5}
  .key span{white-space:nowrap}
  .key i{font-style:normal;font-weight:700}
  .key .b-stretch{color:var(--stretch)} .key .b-target{color:var(--up)}
  .key .b-floor{color:var(--mid)} .key .b-below{color:var(--dn)}

  /* the list */
  .hd,.r{display:grid;align-items:center;
         grid-template-columns:22px minmax(0,1fr) 86px 62px 62px 60px;
         grid-template-areas:"rk nm tk c cn lg"}
  .hascoll .hd,.hascoll .r{grid-template-columns:22px minmax(0,1fr) 80px 54px 54px 50px 84px;
         grid-template-areas:"rk nm tk c cn lg co"}
  .a-co{grid-area:co} .co{grid-area:co;font-weight:600;font-size:13px;color:var(--up)}
  @media(max-width:560px){
    .hascoll .r{grid-template-areas:
        "rk nm nm nm" "tk tk pc pc" "sp c cn lg" "sp co co co"}
    .co{text-align:left}
  }
  /* live day: one more column for pace-vs-expected */
  .live .hd,.live .r{grid-template-columns:20px minmax(0,1fr) 76px 82px 52px 52px 46px;
         grid-template-areas:"rk nm tk pc c cn lg"}
  .live .hd>*{padding-left:6px}
  .live .hd .a-nm{padding-left:0}
  .a-pc{grid-area:pc} .pc{grid-area:pc;font-weight:700;font-size:13px}
  .pc .exp{display:block;font-weight:400;font-size:10.5px;color:var(--muted);
           line-height:1.25}
  .proj{font-size:11px;color:var(--muted);font-weight:500}
  .asof{font-size:11.5px;color:var(--muted);padding:6px 0 0}
  .hd{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      color:var(--muted);padding:9px 0 5px;border-bottom:1px solid var(--rule)}
  .r{padding:7px 0;border-bottom:1px solid var(--hair);cursor:pointer}
  .r:last-child{border-bottom:0}
  .r:hover,.r[aria-expanded="true"]{background:var(--tint)}
  .hd>*,.r>*{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .hd .a-rk,.hd .a-nm,.r .rk,.r .nm{text-align:left}
  .a-rk{grid-area:rk} .a-nm{grid-area:nm} .a-tk{grid-area:tk} .a-c{grid-area:c}
  .a-cn{grid-area:cn} .a-lg{grid-area:lg}
  .rk{grid-area:rk;color:var(--muted);font-size:11.5px}
  .nm{grid-area:nm;font-weight:600;font-size:14.5px;letter-spacing:-.01em;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
  .tk{grid-area:tk;font-weight:700;font-size:14.5px}
  .c{grid-area:c} .cn{grid-area:cn} .lg{grid-area:lg}
  .c,.cn,.lg{font-weight:600;color:var(--ink-2);font-size:13px}
  .lbl{display:none;color:var(--muted);font-weight:400}
  /* band colours are the whole point of the board: where each number sits
     against the KPI, not just what it is */
  .b-stretch{color:var(--stretch)} .b-target{color:var(--up)}
  .b-floor{color:var(--mid)} .b-below{color:var(--dn)}
  .r.r-below .nm{color:var(--dn)}
  .mk{font-size:9px;padding-right:2px}

  /* expand panel */
  .det{display:none;padding:11px 0 13px 22px;border-bottom:1px solid var(--hair);
       background:var(--tint)}
  .det.on{display:block}
  .dg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 16px;max-width:520px}
  @media(max-width:520px){.dg{gap:8px 10px;max-width:none}.det{padding:10px 0 12px 21px}}
  .dg > div{display:flex;flex-direction:column;gap:1px;min-width:0}
  .dg em{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.06em;
         text-transform:uppercase;color:var(--muted);line-height:1.25}
  .dg b{font-size:13px;font-weight:650;color:var(--ink);
        font-variant-numeric:tabular-nums;white-space:nowrap}
  .dg .zero b{color:var(--muted);font-weight:500}
  .dg .rule{grid-column:1/-1;height:1px;background:var(--rule);margin:2px 0 1px}
  .dg .wide{grid-column:1/-1}

  /* expand panel: one table, one footnote */
  .dtab{width:100%;border-collapse:collapse;font-size:12.5px;max-width:520px}
  .dtab th{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
           color:var(--muted);text-align:right;padding:0 0 6px;white-space:nowrap}
  .dtab th:first-child{text-align:left}
  .dtab td{padding:4px 0;text-align:right;font-variant-numeric:tabular-nums;
           border-top:1px solid var(--rule)}
  .dtab td:first-child{text-align:left;color:var(--ink-2)}
  .dtab .big{font-weight:700;font-size:13.5px;color:var(--ink)}
  .dtab .q{color:var(--muted)}
  .foot{font-size:11.5px;color:var(--muted);padding-top:8px;margin-top:9px;
        border-top:1px solid var(--rule);line-height:1.6;max-width:520px}

  /* per-day bars inside the panel */
  .spark{grid-column:1/-1;margin-top:7px;padding-top:7px;border-top:1px solid var(--rule)}
  .spark .cap{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
              color:var(--muted);margin-bottom:5px}
  .bars{display:flex;align-items:flex-end;gap:2px;height:44px}
  .bars{justify-content:flex-start}
  .bars div{flex:1 1 0;min-width:3px;max-width:22px;background:var(--up);
            border-radius:1px 1px 0 0;opacity:.75}
  .bars div.off{background:var(--muted);opacity:.3}
  .bars div:hover{opacity:1}
  .axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);
        margin-top:3px}

  /* a team whose calls are not on this platform at all */
  .blocked{background:var(--tint);border:1px solid var(--rule);
           border-left:3px solid var(--dn);border-radius:0 8px 8px 0;
           padding:13px 15px;margin:0 0 14px;font-size:13px;line-height:1.55;
           color:var(--ink-2)}
  .blocked .bt{font-weight:700;color:var(--ink);font-size:13.5px;margin-bottom:5px}
  .blocked ul{margin:8px 0 0;padding-left:18px}
  .blocked li{margin-bottom:3px}
  .blocked .cap{font-size:10px;font-weight:700;letter-spacing:.08em;
                text-transform:uppercase;color:var(--dn);margin-bottom:4px}

  .warn{font-size:12px;color:var(--ink-2);background:var(--tint);
        border-left:3px solid var(--mid);padding:8px 11px;margin:7px 0;border-radius:0 5px 5px 0}
  .warn.bad{border-left-color:var(--dn)}
  .warn b{color:var(--ink)}
  .empty{color:var(--muted);font-size:13px;padding:16px 0}
  .err{color:var(--dn);font-size:13px;padding:14px 0;line-height:1.5}

  /* ── phones ────────────────────────────────────────────────
     The desktop layout is a table and a table does not survive 375px: the
     headline talk figure was being clipped off the right edge. So each agent
     becomes a small card instead -- name, then the number that matters at
     size, then the supporting counts on one line. */
  @media(max-width:560px){
    .wrap{padding:16px 13px 40px}
    h1{font-size:19px}
    .sub{font-size:12px}

    .hd{display:none}
    .r,.live .r{
      grid-template-columns:22px 1fr 1fr 1fr;
      grid-template-areas:
        "rk nm nm nm"
        "tk tk pc pc"
        "sp c  cn lg";
      row-gap:5px; padding:12px 0 13px;
    }
    .r .rk{align-self:start;padding-top:2px}
    .nm{font-size:16px;padding-right:0;white-space:normal}
    /* the headline: big, left, unclipped. Its label becomes a small caption
       above rather than inheriting 26px and shouting louder than the number. */
    .tk{font-size:26px;letter-spacing:-.02em;text-align:left;line-height:1.1}
    .tk .lbl{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;
             text-transform:uppercase;color:var(--muted);line-height:1.4}
    .pc{text-align:right;font-size:15px;align-self:center}
    .pc .exp{font-size:10.5px}
    /* supporting counts read as label+value pairs, not bare digits */
    .c,.cn,.lg{text-align:left;font-size:12.5px;font-weight:500;color:var(--muted)}
    .c b,.cn b,.lg b{color:var(--ink)}
    .lbl{display:inline;color:var(--muted);font-weight:500}

    /* expand panel: the 22px desktop indent costs a column's worth of width on
       a 375px screen, so it shrinks and the 5-column live table may scroll. */
    .det{padding:11px 2px 13px 8px}
    .dtab{font-size:12px}
    .dtab th{font-size:9px}
    .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .foot{font-size:11px}

    /* controls: two dates on one line, chips on the next, all thumb-sized */
    .ctl{gap:6px}
    .ctl input{flex:1 1 44%;min-width:0;font-size:16px;padding:7px 8px}
    .ctl button{padding:7px 12px;font-size:13px}
    .day{padding:7px 13px;font-size:13px}
    .key{font-size:10.5px;gap:2px 10px}
    .warn{font-size:12px;padding:9px 11px}
  }
  /* very narrow phones: drop the pace column under the headline */
  @media(max-width:360px){
    .r,.live .r{
      grid-template-areas:
        "rk nm nm nm"
        "tk tk tk tk"
        "pc pc pc pc"
        "sp c  cn lg";
    }
    .pc{text-align:left}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Team KPI Board</h1>
  <p class="sub" id="sub">Loading&hellip;</p>

  <div class="teams" id="teams"></div>

  <div class="ctl">
    <input type="date" id="start" aria-label="Start date" />
    <input type="date" id="end" aria-label="End date" />
    <button id="go" type="button">Show</button>
    <span id="days"></span>
    <span class="spin" id="spin"></span>
  </div>

  <div id="out"></div>
</div>

<script>
(function () {
  'use strict';
  var SHARE = {{ 'true' if share_mode else 'false' }};
  var TOKEN = {{ (share_token or '')|tojson }};
  var $ = function (id) { return document.getElementById(id); };
  var TEAM = (new URLSearchParams(location.search).get('team') || '').toLowerCase();

  function hm(s) {
    s = Math.round(s || 0);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    if (s >= 3600) return Math.floor(s / 3600) + ':' + p(Math.floor((s % 3600) / 60)) + ':' + p(s % 60);
    return Math.floor(s / 60) + ':' + p(s % 60);
  }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  // A metric cell coloured by where it lands against the KPI.
  function cell(area, value, band, label) {
    // The label only shows on phones (see .lbl), where a bare number in a
    // three-across row is unreadable without it.
    return '<div class="' + area + ' b-' + esc(band) + '">' +
           '<span class="lbl">' + esc(label) + ' </span><b>' + esc(value) + '</b></div>';
  }
  // Ahead/behind against what a normal day looks like at this hour -- not
  // against the clock. See _PACE_CURVE_DEFAULT in billing_report.py for why.
  function paceCell(pace, key, unit) {
    if (!pace) return '<div class="pc"></div>';
    var exp = pace.expected[key], act = pace.actual[key], r = pace.ratio[key];
    if (r == null) {
      return '<div class="pc b-floor">&mdash;<span class="exp">too early</span></div>';
    }
    var pct = Math.round((r - 1) * 100);
    var cls = r >= 1.05 ? 'b-stretch' : (r >= 0.95 ? 'b-target'
            : (r >= 0.8 ? 'b-floor' : 'b-below'));
    var sign = pct > 0 ? '+' : '';
    return '<div class="pc ' + cls + '">' + sign + pct + '%' +
           '<span class="exp">exp ' + exp + (unit || '') + '</span></div>';
  }

  function money(v) {
    if (v == null) return '\u2014';
    return '$' + Math.round(v).toLocaleString();
  }

  function tgt(t, k) {
    return t[k] ? (t[k].floor + ' / ' + t[k].target + ' / ' + t[k].stretch) : '';
  }

  function render(d) {
    var ranked = d.ranked || [], silent = d.silent || [], stalled = d.stalled || [],
        unknown = d.unknown || [], team = d.team || {};
    var T = d.targets || {}, LONG = d.long_call_seconds || 120;
    var longLbl = '≥' + Math.round(LONG / 60) + 'm';
    var longKey = 'over_' + LONG + 's';
    var multi = (d.window || {}).start !== (d.window || {}).end;

    if (d.team_label) {
      $('title').textContent = d.team_label + ' KPI Board';
      document.title = d.team_label + ' KPI Board';
    }
    if (d.teams && d.teams.length) {
      $('teams').innerHTML = d.teams.map(function (t) {
        var qs = new URLSearchParams(location.search);
        qs.set('team', t.key);
        return '<a class="' + (t.key === d.team ? 'on' : '') + '" href="?' + qs.toString() +
               '">' + esc(t.label) + '</a>';
      }).join('');
    }

    var sub = '<b>' + ranked.length + '</b> seat' + (ranked.length === 1 ? '' : 's') +
      ' &middot; <b>' + (team.agent_days || 0) + '</b> working day' +
      ((team.agent_days || 0) === 1 ? '' : 's') +
      ' &middot; team <b>' + (team.per_day ? team.per_day.talk_minutes : 0) + '</b> min talk/day' +
      ' &middot; team <b>' + (team.per_day ? team.per_day.connected : 0) + '</b> connected/day';
    if (d.live && ranked.length && ranked[0].pace) {
      var pc = ranked[0].pace;
      sub += ' &middot; as of <b>' + esc(pc.as_of) + '</b> a normal day is <b>' +
             Math.round(pc.fraction * 100) + '%</b> done, so targets below are pro-rated to now';
    } else {
      var today = new Date().toISOString().slice(0, 10);
      if ((d.window || {}).end >= today) {
        sub += ' &middot; <b>today is still in progress</b>';
      }
    }
    if (d.meta && d.meta.complete === false) {
      sub += ' &middot; <b>still fetching</b>';
    }
    $('sub').innerHTML = sub;

    var h = '';
    h += '<div class="key">' +
      '<span><i class="b-stretch">Stretch</i></span>' +
      '<span><i class="b-target">Target</i></span>' +
      '<span><i class="b-floor">Floor</i></span>' +
      '<span><i class="b-below">Below floor</i></span>' +
      '<span>talk ' + esc(tgt(T, 'talk_minutes')) + ' min</span>' +
      '<span>calls ' + esc(tgt(T, 'calls')) + '</span>' +
      '<span>conn ' + esc(tgt(T, 'connected')) + '</span>' +
      '<span>' + longLbl + ' ' + esc(tgt(T, 'long_calls')) + '</span>' +
      '</div>';

    if (!ranked.length && !silent.length && !stalled.length && !unknown.length) {
      $('out').innerHTML = h + '<div class="empty">No seats on the roster.</div>';
      return;
    }

    if (d.blocked) {
      h += '<div class="blocked"><div class="cap">Wrong platform</div>' +
           '<div class="bt">These numbers are not this team\'s performance</div>' +
           esc(d.blocked.message) +
           '<ul>' + (d.blocked.unblock || []).map(function (u) {
             return '<li>' + esc(u) + '</li>';
           }).join('') + '</ul></div>';
    }

    var live = !!d.live;
    // Only billing has a collections sheet behind it.
    var hasColl = ranked.some(function (a) { return a.collected_total != null; });
    h += '<div class="' + (live ? 'live' : '') + (hasColl ? ' hascoll' : '') + '">';
    h += '<div class="hd">' +
      '<div class="a-rk"></div><div class="a-nm">Agent</div>' +
      '<div class="a-tk">' + (live ? 'So far' : 'Talk/day') + '</div>' +
      (live ? '<div class="a-pc">vs expected</div>' : '') +
      '<div class="a-c">Calls</div>' +
      '<div class="a-cn">Conn</div><div class="a-lg">' + longLbl + '</div>' +
      (hasColl ? '<div class="a-co">Collected</div>' : '') + '</div>';

    ranked.forEach(function (a, i) {
      // `worked` = the working-day figures every per-day average is derived from.
      // `totals` includes idle-day stray dials; showing those here instead would
      // make the panel disagree with the row above it.
      var g = a.grades || {}, p = a.per_day || {}, tot = a.worked || a.totals || {};
      var all = a.totals || {};
      var id = 'd' + i;
      // On a live day the numbers ARE the part-day so far, and the colour comes
      // from where the day is HEADED -- colouring a half-finished day against a
      // whole-day target just paints everyone red until the evening.
      var pace = a.pace;
      var band = pace && pace.grades ? (pace.grades.talk_minutes || a.band) : a.band;
      var show = pace ? pace.actual : p;
      var pg = pace && pace.grades ? pace.grades : g;
      h += '<div class="r' + (band === 'below' ? ' r-below' : '') + '" data-det="' + id +
           '" tabindex="0" role="button" aria-expanded="false">' +
        '<div class="rk">' + (i + 1) + '</div>' +
        '<div class="nm">' + esc(a.name) + '</div>' +
        cell('tk', show.talk_minutes + 'm', pg.talk_minutes || 'below',
             live ? 'Talk so far' : 'Talk/day') +
        (live ? paceCell(pace, 'talk_minutes', 'm') : '') +
        cell('c', show.calls, pg.calls || 'below', 'Calls') +
        cell('cn', show.connected, pg.connected || 'below', 'Conn') +
        cell('lg', show.long_calls, pg.long_calls || 'below', longLbl) +
        (hasColl ? '<div class="co"><span class="lbl">Collected </span><b>' +
                   money(a.collected_total) + '</b></div>' : '') +
        '</div>';

      var days = (a.days || []);
      var worked = days.filter(function (x) { return x.worked; });
      var peak = Math.max.apply(null, days.map(function (x) { return x.talk_minutes; }).concat([1]));
      var METRICS = [['talk_minutes', 'Talk', 'm'], ['calls', 'Calls', ''],
                     ['connected', 'Connected', ''], ['long_calls', longLbl, '']];

      // One table, not a wall of tiles. A live day answers "where are they, where
      // should they be, where will they land"; a finished range answers "per day
      // and in total". Everything else is one quiet footnote.
      var body;
      if (pace) {
        body = '<div class="tscroll">' +
          '<table class="dtab"><tr><th>Metric</th><th>Now</th><th>Expected</th>' +
          '<th>On track for</th><th>Target</th></tr>' +
          METRICS.map(function (m) {
            var k = m[0], u = m[2], pj = pace.projected[k];
            return '<tr><td>' + m[1] + '</td>' +
              '<td class="big">' + pace.actual[k] + u + '</td>' +
              '<td class="q">' + pace.expected[k] + u + '</td>' +
              '<td class="big b-' + (pace.grades[k] || 'below') + '">' +
                (pj == null ? '&mdash;' : pj + u) + '</td>' +
              '<td class="q">' + ((T[k] || {}).target != null ? T[k].target + u : '') + '</td></tr>';
          }).join('') + '</table></div>';
      } else {
        body =
          '<table class="dtab"><tr><th>Metric</th><th>Per working day</th><th>Total</th></tr>' +
          METRICS.map(function (m) {
            var k = m[0], u = m[2];
            var totals = {talk_minutes: hm(tot.talk_seconds), calls: tot.handled_calls,
                          connected: tot.connected, long_calls: tot[longKey]};
            return '<tr><td>' + m[1] + '</td>' +
              '<td class="big b-' + (g[k] || 'below') + '">' + p[k] + u + '</td>' +
              '<td class="q">' + totals[k] + '</td></tr>';
          }).join('') + '</table>';
      }

      if (a.collected_total != null) {
        body += '<div class="foot" style="border-top:0;margin-top:6px;padding-top:6px">' +
          'Collected <b>' + money(a.collected_total) + '</b> over ' + a.collected_days +
          ' day(s) logged in the shared sheet' +
          (a.collected_per_day != null ? ' &middot; ' + money(a.collected_per_day) + '/day' : '') +
          '</div>';
      }
      var foot = 'Ext ' + esc(a.ext || a.ext_id) +
        ' &middot; avg call ' + a.avg_call_seconds + 's' +
        ' &middot; longest ' + hm(tot.longest_seconds) +
        ' &middot; ' + a.long_call_share_pct + '% of connected calls run ' + longLbl;
      if (pace) {
        foot += '<br>' + Math.round(pace.fraction * 100) + '% of a normal day has run at ' +
                esc(pace.as_of) + ', measured on ' +
                (pace.curve === 'own' ? 'their own pattern' : 'the team pattern') + '.' +
                (pace.projectable ? '' : ' Too early to project.');
      } else {
        foot += '<br>' + a.worked_days + ' working day' + (a.worked_days === 1 ? '' : 's') +
                (a.idle_days ? ', ' + a.idle_days + ' idle (not averaged)' : '') +
                ' &middot; median day ' + a.median_talk_minutes + 'm talk';
      }

      h += '<div class="det" id="' + id + '">' + body +
        (multi && days.length ?
          '<div class="spark"><div class="cap">Talk minutes per day</div>' +
          '<div class="bars">' + days.map(function (x) {
            return '<div class="' + (x.worked ? '' : 'off') + '" title="' + esc(x.date) +
                   ': ' + x.talk_minutes + ' min, ' + x.connected + ' connected" style="height:' +
                   Math.max(2, Math.round(100 * x.talk_minutes / peak)) + '%"></div>';
          }).join('') + '</div>' +
          '<div class="axis"><span>' + esc(days[0].date) + '</span><span>' +
            esc(days[days.length - 1].date) + '</span></div></div>' : '') +
        '<div class="foot">' + foot + '</div></div>';
    });

    h += '</div>';   // close .live / plain list wrapper

    if (stalled.length) {
      h += '<h2>Dialling but not connecting</h2>';
      stalled.forEach(function (a) {
        var t = a.totals || {};
        h += '<div class="warn bad"><b>' + esc(a.name) + '</b> (ext ' + esc(a.ext || a.ext_id) +
             ') logged <b>' + t.calls + '</b> call(s) here &mdash; ' + t.dials + ' outbound, ' +
             t.inbound + ' inbound &mdash; and connected <b>none</b> of them. A line that logs ' +
             'calls but never connects is out, reassigned or broken &mdash; that is not last ' +
             'place, so this seat is held out of the ranking.</div>';
      });
    }

    if (unknown.length) {
      h += '<h2>Not known yet</h2>';
      unknown.forEach(function (a) {
        h += '<div class="warn"><b>' + esc(a.name) + '</b> (ext ' + esc(a.ext || a.ext_id) +
             ') returned no calls, but their window was <b>not fully read</b> &mdash; so this is ' +
             '&ldquo;not known&rdquo;, not &ldquo;no calls&rdquo;. Reload in a minute; long ' +
             'ranges fill in a few days at a time.</div>';
      });
    }

    if (silent.length) {
      h += '<h2>No calls logged</h2>';
      silent.forEach(function (a) {
        h += '<div class="warn bad"><b>' + esc(a.name) + '</b> (ext ' + esc(a.ext || a.ext_id) +
             ') logged no calls at all in this window. That is an empty seat, a wrong ' +
             'extension, or someone who does not dial from RingEX &mdash; not a zero score.</div>';
      });
    }

    var warns = (d.warnings || []).filter(function (x) {
      return x.kind !== 'no_activity' && x.kind !== 'no_connections' &&
             x.kind !== 'unknown_seat';
    });
    if (warns.length) {
      h += '<h2>Data notes</h2>';
      warns.forEach(function (x) {
        h += '<div class="warn' + (x.kind === 'incomplete_fetch' ? ' bad' : '') + '">' +
             esc(x.message) +
             (x.values ? ' (' + x.values.map(function (v) {
               return esc(v[0]) + ' ×' + v[1];
             }).join(', ') + ')' : '') + '</div>';
      });
    }

    var m = d.meta || {};
    h += '<div class="floor">Source: RingEX per-extension call log' +
         '<span class="sep">&middot;</span>Roster: ' + esc((m.roster || {}).source || '?') +
         '<span class="sep">&middot;</span>' +
         (m.cached ? 'cached ' + (m.age_seconds || 0) + 's ago' : 'fetched live') +
         '<span class="sep">&middot;</span>Talk time counts connected calls only' +
         '</div>';

    $('out').innerHTML = h;

    $('out').querySelectorAll('.r[data-det]').forEach(function (row) {
      var toggle = function () {
        var panel = document.getElementById(row.getAttribute('data-det'));
        if (!panel) return;
        var wasOpen = panel.classList.contains('on');
        $('out').querySelectorAll('.det.on').forEach(function (o) { o.classList.remove('on'); });
        $('out').querySelectorAll('.r[aria-expanded="true"]').forEach(function (r) {
          r.setAttribute('aria-expanded', 'false');
        });
        if (!wasOpen) {
          panel.classList.add('on');
          row.setAttribute('aria-expanded', 'true');
        }
      };
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });
  }

  function load() {
    $('spin').textContent = 'loading…';
    // A page that sits on "Loading…" forever tells the viewer nothing. If the
    // server drops the connection -- a killed gunicorn worker does exactly that
    // -- fetch() never settles, so the page needs its own deadline.
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var bailed = false;
    var bail = setTimeout(function () {
      bailed = true;
      if (ctl) { try { ctl.abort(); } catch (e) {} }
      $('spin').textContent = '';
      $('sub').textContent = '';
      $('out').innerHTML = '<div class="err"><b>The server did not answer in 45 seconds.</b>' +
        '<br>RingCentral only allows 10 call-log requests a minute for the whole account, ' +
        'and this board shares that budget with the sales dashboard. Days already fetched ' +
        'are cached, so reloading usually works. If it keeps timing out, check the service logs.' +
        '</div>';
    }, 45000);
    var q = new URLSearchParams();
    if ($('start').value) q.set('start', $('start').value);
    if ($('end').value) q.set('end', $('end').value || $('start').value);
    q.set('tz', String(new Date().getTimezoneOffset()));
    if (TEAM) q.set('team', TEAM);
    if (SHARE && TOKEN) q.set('k', TOKEN);

    fetch('/api/v6/report?' + q.toString(),
          ctl ? { credentials: 'same-origin', signal: ctl.signal }
              : { credentials: 'same-origin' })
      .then(function (r) {
        return r.text().then(function (t) {
          // A dropped worker or a proxy error returns HTML, not JSON. Parsing it
          // blind threw inside the success path and left the spinner running.
          var j; try { j = JSON.parse(t); } catch (e) {
            j = { error: 'bad_response',
                  detail: 'HTTP ' + r.status + ' — the server returned ' +
                          (t.slice(0, 120) || 'an empty body') };
          }
          return { ok: r.ok, j: j };
        });
      })
      .then(function (res) {
        if (bailed) return;
        clearTimeout(bail);
        $('spin').textContent = '';
        if (!res.ok) {
          var j = res.j || {};
          $('out').innerHTML = '<div class="err"><b>' + esc(j.error || 'Request failed') +
            '</b><br>' + esc(j.detail || '') + '</div>';
          $('sub').textContent = '';
          return;
        }
        render(res.j);
        var w = res.j.window || {};
        if (w.start && !$('start').value) { $('start').value = w.start; $('end').value = w.end; }
        buildDayButtons();
      })
      .catch(function (err) {
        if (bailed) return;
        clearTimeout(bail);
        $('spin').textContent = '';
        $('out').innerHTML = '<div class="err">Could not reach the server: ' +
          esc(err && err.message ? err.message : err) + '</div>';
      });
  }

  function buildDayButtons() {
    var box = $('days');
    if (box.dataset.built) return;
    box.dataset.built = '1';
    var mk = function (label, days) {
      var b = document.createElement('button');
      b.className = 'day'; b.type = 'button'; b.textContent = label;
      b.onclick = function () {
        var end = new Date();
        var start = new Date(); start.setDate(start.getDate() - (days - 1));
        var iso = function (d) { return d.toISOString().slice(0, 10); };
        $('start').value = iso(start); $('end').value = iso(end);
        box.querySelectorAll('.day').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        load();
      };
      box.appendChild(b);
    };
    mk('Today', 1); mk('7d', 7); mk('30d', 30); mk('90d', 90);
    var first = box.querySelector('.day');
    if (first) first.classList.add('on');    // the board opens on Today
  }

  // Open on today, explicitly. The API defaults to today anyway, but leaving the
  // pickers blank meant the board's own controls did not say what it was showing.
  (function initToday() {
    var t = new Date();
    var iso = new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    $('start').value = iso;
    $('end').value = iso;
  })();

  function clearDayChips() {
    var box = $('days');
    if (box) box.querySelectorAll('.day').forEach(function (x) { x.classList.remove('on'); });
  }

  $('go').onclick = function () { clearDayChips(); load(); };
  ['start', 'end'].forEach(function (id) {
    $(id).addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { clearDayChips(); load(); }
    });
  });
  load();
  // Today's numbers move; a board left open on a wall should not go stale.
  setInterval(function () {
    var today = new Date().toISOString().slice(0, 10);
    if (!$('end').value || $('end').value >= today) load();
  }, 120000);
})();
</script>
</body>
</html>
