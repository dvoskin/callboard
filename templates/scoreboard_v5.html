<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sales Floor Scoreboard</title>
<style>
  :root{
    --bg:#FFFFFF; --tint:#F6F8F8; --rule:#E3E9E8; --hair:#EFF3F2;
    --ink:#131C1B; --ink-2:#4A5957; --muted:#7C8B89;
    --up:#0B6E67; --dn:#B03A31; --mid:#9C6712;
    --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#101614; --tint:#161E1C; --rule:#26302E; --hair:#1C2523;
    --ink:#EDF2F1; --ink-2:#BCC9C7; --muted:#849492;
    --up:#4FCCBF; --dn:#EE8177; --mid:#E0A542;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
       -webkit-text-size-adjust:100%}
  .n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .wrap{max-width:680px;margin:0 auto;padding:20px 14px 44px}
  @media(min-width:640px){.wrap{padding:32px 22px 56px}}

  h1{margin:0 0 2px;font-size:20px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
  .sub b{color:var(--ink);font-weight:650}
  .sub b.down{color:var(--dn)}
  h2{margin:22px 0 6px;font-size:12px;font-weight:700;letter-spacing:.06em;
     text-transform:uppercase;color:var(--muted)}

  .ctl{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:14px}
  .ctl input,.ctl button{font-family:inherit;font-size:12.5px;padding:4px 8px;
       border:1px solid var(--rule);background:var(--bg);color:var(--ink);
       border-radius:5px;-webkit-appearance:none}
  .ctl button{cursor:pointer;font-weight:600}
  .ctl button:hover{border-color:var(--up);color:var(--up)}
  .day{cursor:pointer;font-size:12px;font-weight:600;padding:4px 9px;border-radius:5px;
       border:1px solid var(--rule);background:var(--bg);color:var(--muted)}
  .day:hover{border-color:var(--up);color:var(--up)}
  .day.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .spin{font-size:12px;color:var(--muted)}

  /* the floor, one line */
  .floor{font-size:12.5px;color:var(--muted);padding:8px 0;
         border-top:1px solid var(--rule)}
  .key{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:11px;color:var(--muted);
       padding:0 0 7px;border-bottom:1px solid var(--rule);line-height:1.5}
  .key b{font-weight:700}
  .key .d{padding-right:2px}
  .key .u{color:var(--up)} .key .d{color:var(--dn)}
  .key span{white-space:nowrap}
  .floor b{color:var(--ink);font-weight:700}
  .floor .sep{opacity:.45;padding:0 5px}

  /* the list — flat grid, hairlines only */
  .hd,.r{display:grid;align-items:center;
         grid-template-columns:22px minmax(0,1fr) 84px 62px 52px 58px;
         grid-template-areas:"rk nm tk d t3 t10"}
  .hd{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      color:var(--muted);padding:9px 0 5px;border-bottom:1px solid var(--rule)}
  .r{padding:7px 0;border-bottom:1px solid var(--hair)}
  .r:last-child{border-bottom:0}
  .r{cursor:pointer}
  .r:hover{background:var(--tint)}
  .r[aria-expanded="true"]{background:var(--tint)}
  .det{display:none;padding:11px 0 13px 22px;border-bottom:1px solid var(--hair);
       background:var(--tint)}
  @media(max-width:520px){.det{padding:10px 0 12px 21px}}
  .det.on{display:block}
  /* Fixed 3 columns so the six call figures land as a clean 2x3 and the three
     Books figures as one row. auto-fit packed five across and orphaned the
     sixth on a line of its own. */
  .dg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
      gap:9px 16px;max-width:460px}
  @media(max-width:520px){.dg{gap:8px 10px;max-width:none}}
  .dg > div{display:flex;flex-direction:column;gap:1px;min-width:0}
  .dg em{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.06em;
         text-transform:uppercase;color:var(--muted);line-height:1.25}
  .dg{align-items:start}
  .dg b{font-size:13px;font-weight:650;color:var(--ink);
        font-variant-numeric:tabular-nums;white-space:nowrap}
  .dg .zero b{color:var(--muted);font-weight:500}
  .dg .rule{grid-column:1/-1;height:1px;background:var(--rule);margin:2px 0 1px}
  .hd>*,.r>*{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .hd .a-rk,.hd .a-nm,.r .rk,.r .nm{text-align:left}
  .a-rk{grid-area:rk} .a-nm{grid-area:nm} .a-tk{grid-area:tk}
  .a-d{grid-area:d} .a-t3{grid-area:t3} .a-t10{grid-area:t10}
  .rk{grid-area:rk;color:var(--muted);font-size:11.5px}
  .nm{grid-area:nm;font-weight:600;font-size:14.5px;letter-spacing:-.01em;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
  .r.low .nm{color:var(--dn)}
  .tk{grid-area:tk;font-weight:700;font-size:14.5px}
  .d{grid-area:d} .t3{grid-area:t3} .t10{grid-area:t10}
  .d,.t3,.t10{font-weight:600;color:var(--ink-2);font-size:13px}
  .lbl{display:none;color:var(--muted);font-weight:400}
  .up{color:var(--up)} .down{color:var(--dn)}
  .mk{font-size:9px;padding-right:2px}

  @media(max-width:560px){
    .hd{display:none}
    .r{grid-template-columns:22px minmax(0,1fr) auto;
       grid-template-areas:"rk nm tk" ". s s";row-gap:2px;padding:9px 0}
    .d,.t3,.t10{grid-area:s;font-size:12.5px;font-weight:600}
    .r>.d{justify-self:start} .r>.t3{justify-self:center} .r>.t10{justify-self:end}
    .lbl{display:inline}
    .r{grid-template-columns:22px minmax(0,1fr) auto}
    .srow{grid-area:s;display:flex;justify-content:space-between;gap:10px}
  }

  ul{list-style:none;margin:0;padding:0}
  li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1px 12px;
     padding:6px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
  li:last-child{border-bottom:0}
  li b{font-weight:600}
  li.low b{color:var(--dn)}
  li span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  p.note{font-size:12px;color:var(--muted);line-height:1.55;margin:8px 0 0}
  p.note b{color:var(--ink-2);font-weight:650}
  .recon{font-size:12.5px;color:var(--muted);padding:7px 0;border-top:1px solid var(--rule)}
  .recon b{color:var(--ink);font-weight:700}
  .warn{font-size:12.5px;color:var(--mid);padding:7px 0;border-top:1px solid var(--rule)}
  .msg{padding:14px 0;font-size:13.5px;color:var(--muted)}
  .msg.err{color:var(--dn)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sales Floor Scoreboard</h1>
  <p class="sub" id="stamp">Loading…</p>
  {% if not share_mode %}
  <div class="ctl">
    <input type="date" id="start" /><input type="date" id="end" />
    <button id="go">Refresh</button><span class="spin" id="spin"></span>
  </div>
  <div class="ctl" id="days"></div>
  {% endif %}
  <div id="out"><div class="msg">Pulling calls from RingEX and RingCX…</div></div>
</div>

<script>
(function () {
  var SHARE = {{ 'true' if share_mode else 'false' }};
  var TOKEN = {{ (share_token or '')|tojson }};
  var $ = function (id) { return document.getElementById(id); };

  function hm(s) {
    s = Math.round(s || 0);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return h ? h + ':' + p(m) + ':' + p(x) : m + ':' + p(x);
  }
  // A median over an even number of people lands on .5 — right, but it reads as a
  // typo. Display rounds; every comparison still uses the true value.
  function w(n) { return Math.round(n || 0); }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function cell(v, med, cls, label) {
    var up = v >= med;
    return '<span class="' + cls + ' ' + (up ? 'up' : 'down') + '">' +
           '<span class="mk">' + (up ? '▲' : '▼') + '</span>' + w(v) +
           '<span class="lbl">' + label + '</span></span>';
  }

  function render(d) {
    var f = d.floor || {}, ranked = d.ranked || [], thin = d.unranked || [];
    if (!ranked.length && !thin.length) {
      $('out').innerHTML = '<div class="msg">No calls logged in this window.</div>'; return;
    }
    var h = '';
    h += '<div class="floor">Floor to clear&nbsp; <b>' + hm(f.talk) + '</b> talk' +
         '<span class="sep">·</span><b>' + w(f.attempts) + '</b> dials' +
         '<span class="sep">·</span><b>' + w(f.over_3) + '</b> over 3m' +
         '<span class="sep">·</span><b>' + w(f.over_10) + '</b> over 10m</div>';
    // A legend, not a tooltip: this is read on phones, where hover does not exist.
    h += '<div class="key">' +
           '<span><b class="u">▲</b><b class="d">▼</b> vs the floor</span>' +
           '<span><b>Floor</b> = median rep, not a target</span>' +
           '<span><b>Talk</b> excludes wrap</span>' +
           '<span><b>&gt;3m/&gt;10m</b> = real conversations, not dialer touches</span>' +
         '</div>';

    h += '<div class="hd"><span class="a-rk"></span><span class="a-nm">Rep</span>' +
         '<span class="a-tk">Talk</span><span class="a-d">Dials</span>' +
         '<span class="a-t3">&gt;3m</span><span class="a-t10">&gt;10m</span></div>';
    ranked.forEach(function (a, i) {
      var up = a.talk >= f.talk;
      const bk = a.books || {};
      const cell2 = function (label, value, isZero) {
        return '<div' + (isZero ? ' class="zero"' : '') + '><em>' + label +
               '</em><b>' + value + '</b></div>';
      };
      const paid = bk.retainers_paid
        ? w(bk.retainers_paid) + (bk.paid_amount
            ? ' · $' + Math.round(bk.paid_amount).toLocaleString() : '')
        : '0';
      h += '<div class="r ' + a.band + '" role="button" tabindex="0" aria-expanded="false"' +
           ' data-det="d' + i + '"><span class="rk">' + (i + 1) + '</span>' +
           '<span class="nm">' + esc(a.name) + '</span>' +
           '<span class="tk ' + (up ? 'up' : 'down') + '"><span class="mk">' +
             (up ? '▲' : '▼') + '</span>' + hm(a.talk) + '</span>' +
           cell(a.attempts, f.attempts, 'd', ' dials') +
           cell(a.over_3, f.over_3, 't3', ' over 3m') +
           cell(a.over_10, f.over_10, 't10', ' over 10m') +
           '</div>';
      h += '<div class="det" id="d' + i + '"><div class="dg">' +
             cell2('Campaign', hm(a.campaign), !a.campaign) +
             cell2('Direct', hm(a.direct), !a.direct) +
             cell2('Longest', hm(a.longest)) +
             '<span class="rule"></span>' +
             cell2('Quotes', w(bk.quotes_sent), !bk.quotes_sent) +
             cell2('Retainers paid', paid, !bk.retainers_paid) +
           '</div></div>';
    });

    var low = ranked.filter(function (a) { return a.band === 'low'; });
    if (low.length) {
      h += '<h2>Below the floor on all three</h2><ul>';
      low.slice().reverse().forEach(function (a) {
        h += '<li class="low"><b>' + esc(a.name) + '</b><span>' + hm(a.talk) + ' talk · ' +
             w(a.attempts) + ' dials · ' + w(a.over_3) + ' over 3m</span></li>';
      });
      h += '</ul><p class="note">Behind on time, volume <b>and</b> conversation length — ' +
           'not just one. Dials are the place to start.</p>';
    }
    if (thin.length) {
      h += '<h2>Not enough calls to rank</h2><ul>';
      thin.forEach(function (a) {
        h += '<li><b>' + esc(a.name) + '</b><span>' + w(a.attempts) + ' call' +
             (a.attempts === 1 ? '' : 's') + ' · ' + hm(a.talk) + ' talk</span></li>';
      });
      h += '</ul><p class="note">Under ' + w(d.meta.min_calls_to_rank) +
           ' calls logged — usually a part shift, not a slow day.</p>';
    }

    (d.warnings || []).forEach(function (x) {
      if (x.kind === 'report_stale') h += '<div class="warn">' + esc(x.detail) + '</div>';
    });

    if (!SHARE) {
      var r = d.recon || {};
      h += '<div class="recon">RingCX holds <b>' +
           (r.coverage_pct == null ? '—' : r.coverage_pct + '%') + '</b> of the connected ' +
           'RingEX calls · <b>' + w(r.matched) + '</b> matched · <b>' + w(r.ex_only) +
           '</b> RingEX-only · <b>' + w(r.uc_only) + '</b> RingCX-only · <b>' +
           w(r.ex_missed_absent) + '</b> missed</div>';
      (d.warnings || []).forEach(function (x) {
        if (x.kind === 'report_stale') return;
        h += '<div class="warn">' + esc(x.kind.replace(/_/g, ' ')) + ' — ' + esc(x.detail || '') +
             (x.values ? ' (' + x.values.map(function (v) { return esc(v[0]) + ' ×' + v[1]; }).join(', ') + ')' : '') +
             '</div>';
      });
    }
    h += '<p class="note">Both phone systems combined, no call counted twice. Talk time only — ' +
         'wrap and admin excluded. Shift length isn’t in the data, so a half day sits beside a full one.</p>';
    $('out').innerHTML = h;

    // Expand on click. Delegated so it survives every refresh, and keyboard
    // reachable because the rows are the only way into this detail.
    $('out').querySelectorAll('.r[data-det]').forEach(function (row) {
      const open = function () {
        const d = document.getElementById(row.getAttribute('data-det'));
        if (!d) return;
        const now = d.classList.toggle('on');
        row.setAttribute('aria-expanded', now ? 'true' : 'false');
      };
      row.addEventListener('click', open);
      row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });
    });
  }

  function load() {
    var s = $('start'), e = $('end'), q = new URLSearchParams();
    if (s && s.value) q.set('start', s.value);
    if (e && e.value) q.set('end', e.value);
    q.set('tz', new Date().getTimezoneOffset());
    if (SHARE && TOKEN) q.set('k', TOKEN);
    if ($('spin')) $('spin').textContent = '…';
    fetch('/api/v5/report?' + q.toString(), { credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if ($('spin')) $('spin').textContent = '';
        if (!res.ok) {
          $('out').innerHTML = '<div class="msg err"><b>' + esc(res.j.error || 'error') +
            '</b> ' + esc(res.j.detail || '') + '</div>';
          return;
        }
        var m = res.j.meta || {}, src = m.ringcx_source || {};
        // Say how far into the day the DATA reaches, not just when the page loaded.
        // Two views of the same day disagree constantly when one has an extra hour
        // in it, and without this line that looks like a bug rather than a clock.
        var covers = (src.covers_to || '').slice(0, 5);
        var pretty = '';
        if (covers) {
          var hh = parseInt(covers.slice(0, 2), 10), mm = covers.slice(3, 5);
          pretty = (hh % 12 || 12) + ':' + mm + (hh < 12 ? ' AM' : ' PM');
        }
        $('stamp').innerHTML =
          (m.window && m.window.start ? esc(m.window.start) + ' · ' : '') +
          (pretty ? '<b>calls through ' + pretty + '</b> · ' : '') +
          m.ringex_calls + ' RingEX · ' + m.ringcx_rows + ' RingCX' +
          (src.source === 'live_cdr_api' ? ' · live pull' : '') +
          (m.ringex_calls === 0 ? ' · <b class="down">no RingEX calls</b>' : '');
        var dz = $('days');
        if (dz && m.available_days) {
          dz.innerHTML = '';
          m.available_days.slice(0, 8).forEach(function (day) {
            var b = document.createElement('button');
            b.className = 'day' + (day === $('start').value ? ' on' : '');
            b.textContent = new Date(day + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' });
            b.onclick = function () { $('start').value = day; $('end').value = day; load(); };
            dz.appendChild(b);
          });
        }
        render(res.j);
      })
      .catch(function (err) {
        if ($('spin')) $('spin').textContent = '';
        $('out').innerHTML = '<div class="msg err">Could not reach the report: ' + esc(err) + '</div>';
      });
  }

  if (!SHARE) {
    var t = new Date(), iso = new Date(t.getTime() - t.getTimezoneOffset() * 60000)
      .toISOString().slice(0, 10);
    $('start').value = iso; $('end').value = iso;
    $('go').addEventListener('click', load);
  }
  load();
  setInterval(load, 15 * 60 * 1000);
})();
</script>
</body>
</html>
