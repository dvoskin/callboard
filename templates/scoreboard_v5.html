<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Where you stand today</title>
<style>
  :root{
    --paper:#F2F5F5;--card:#FFF;--line:#DCE4E3;--line-2:#EAF0EF;
    --ink:#12211F;--ink-2:#41524F;--muted:#6B7A78;
    --up:#0B7D77;--mid:#B4700C;--dn:#B33B33;
    --f:-apple-system,ui-sans-serif,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --m:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0C1614;--card:#141F1E;--line:#243330;--line-2:#1B2726;
    --ink:#E9F0EE;--ink-2:#BCCBC8;--muted:#8AA09C;
    --up:#4DCFC3;--mid:#E8A93F;--dn:#EE8478;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:20px 13px 48px;display:flex;
        flex-direction:column;gap:18px}
  @media(min-width:700px){.wrap{padding:36px 24px 64px;gap:24px}}
  h1{font-size:22px;line-height:1.15;letter-spacing:-.022em;font-weight:660;margin:0}
  @media(min-width:700px){h1{font-size:28px}}
  h2{font-size:13px;font-weight:650;margin:0}
  .date{font-family:var(--m);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .top{display:flex;flex-direction:column;gap:7px}
  .ctl{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .ctl input,.ctl button{font-family:var(--m);font-size:12px;padding:6px 9px;
       border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:0}
  .ctl button{cursor:pointer;font-weight:650}
  .ctl button:hover{border-color:var(--up);color:var(--up)}
  .barline{font-family:var(--m);font-size:11.5px;color:var(--muted);background:var(--card);
           border:1px solid var(--line);padding:8px 11px;line-height:1.7}
  .barline b{color:var(--ink);font-weight:650}
  .barline u{text-decoration:none;color:var(--up)}
  .list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
  .row{background:var(--card);padding:9px 11px 10px;display:grid;gap:2px 9px;
       border-left:3px solid var(--bc);grid-template-columns:19px 1fr auto;
       grid-template-areas:"rk nm tk" "bar bar bar" "st st st"}
  .r-ok{--bc:var(--up)}.r-mid{--bc:var(--mid)}.r-low{--bc:var(--dn)}.r-na{--bc:var(--line)}
  .rk{grid-area:rk;font-family:var(--m);font-size:10.5px;color:var(--muted);align-self:center}
  .nm{grid-area:nm;font-weight:600;font-size:14.5px;letter-spacing:-.01em;align-self:center;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-low .nm{color:var(--dn)}
  .tk{grid-area:tk;font-family:var(--m);font-size:14px;font-weight:650;align-self:center;
      font-variant-numeric:tabular-nums;white-space:nowrap}
  .tk i,.st i{font-style:normal;font-size:9px;margin-right:3px;vertical-align:1px}
  .up{color:var(--up)}.down{color:var(--dn)}
  .bar{grid-area:bar;display:block;height:4px;background:var(--line-2);margin:4px 0 5px}
  .bar i{display:block;height:100%;background:var(--bc)}
  .sts{grid-area:st;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .st{font-family:var(--m);font-size:11px;color:var(--muted);display:flex;
      align-items:baseline;gap:3px;white-space:nowrap;min-width:0}
  .st b{font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums}
  .st em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
  .sts .st:nth-child(2){justify-content:center}.sts .st:nth-child(3){justify-content:flex-end}
  @media(min-width:620px){
    .row{grid-template-columns:20px 146px 1fr 78px 74px 74px 78px;
         grid-template-areas:"rk nm bar tk s1 s2 s3";align-items:center;gap:0 12px;padding:8px 13px}
    .bar{margin:0}.tk{text-align:right}
    .sts{display:contents}
    .sts .st:nth-child(1){grid-area:s1}.sts .st:nth-child(2){grid-area:s2}
    .sts .st:nth-child(3){grid-area:s3}.sts .st{justify-content:flex-end}
  }
  .card{background:var(--card);border:1px solid var(--line);padding:13px 14px;
        display:flex;flex-direction:column;gap:9px}
  .card.flag{border-left:3px solid var(--dn)}
  .card.warn{border-left:3px solid var(--mid)}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1px 12px;padding:6px 0;
     border-bottom:1px solid var(--line-2);font-size:14px}
  li:first-child{padding-top:0}li:last-child{border-bottom:0;padding-bottom:0}
  li b{font-weight:600}li span{font-family:var(--m);font-size:11px;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);line-height:1.55;margin:0}
  .note b{color:var(--ink-2);font-weight:650}
  .recon{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
         background:var(--line);border:1px solid var(--line)}
  .rc{background:var(--card);padding:11px 13px;display:flex;flex-direction:column;gap:3px}
  .rc b{font-family:var(--m);font-size:20px;font-weight:650;line-height:1.1;color:var(--rc,var(--ink))}
  .rc span{font-size:11.5px;color:var(--muted);line-height:1.4}
  .rc-good{--rc:var(--up)}.rc-bad{--rc:var(--dn)}.rc-warn{--rc:var(--mid)}
  .msg{padding:16px;border:1px solid var(--line);background:var(--card);font-size:14px}
  .msg.err{border-left:3px solid var(--dn)}
  .spin{color:var(--muted);font-family:var(--m);font-size:12px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="date" id="stamp">loading…</div>
    <h1>Where you stand today</h1>
    {% if not share_mode %}
    <div class="ctl">
      <input type="date" id="start" /><input type="date" id="end" />
      <button id="go">Refresh</button>
      <span class="spin" id="spin"></span>
    </div>
    {% endif %}
  </div>
  <div id="out"><div class="msg spin">Pulling calls from RingEX and RingCX…</div></div>
</div>

<script>
(function () {
  var SHARE = {{ 'true' if share_mode else 'false' }};
  var TOKEN = {{ (share_token or '')|tojson }};
  var $ = function (id) { return document.getElementById(id); };

  function hm(s) {
    s = Math.round(s || 0);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return h ? h + ':' + p(m) + ':' + p(x) : m + ':' + p(x);
  }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function arrow(v, med) {
    var up = v >= med;
    return '<i class="' + (up ? 'up' : 'down') + '">' + (up ? '▲' : '▼') + '</i>';
  }

  function render(d) {
    var f = d.floor || {}, ranked = d.ranked || [], thin = d.unranked || [];
    if (!ranked.length && !thin.length) {
      $('out').innerHTML = '<div class="msg">No calls in this window.</div>';
      return;
    }
    var mx = ranked.length ? ranked[0].talk : 1;
    var h = '';

    h += '<div class="barline"><b>▲</b> means you’re at or above the floor, ' +
         '<b>▼</b> means below. Today’s bar to clear: <u><b>' + hm(f.talk) +
         '</b> talk</u> · <u><b>' + f.attempts + '</b> dials</u> · <u><b>' +
         f.over_3 + '</b> over 3m</u> · <u><b>' + f.over_10 + '</b> over 10m</u>.</div>';

    h += '<div class="list">';
    ranked.forEach(function (a, i) {
      h += '<div class="row r-' + a.band + '"><span class="rk">' + (i + 1) + '</span>' +
           '<span class="nm">' + esc(a.name) + '</span>' +
           '<span class="tk">' + arrow(a.talk, f.talk) + hm(a.talk) + '</span>' +
           '<span class="bar"><i style="width:' + (a.talk / mx * 100).toFixed(1) + '%"></i></span>' +
           '<span class="sts">' +
             '<span class="st">' + arrow(a.attempts, f.attempts) + '<b>' + a.attempts + '</b><em>dials</em></span>' +
             '<span class="st">' + arrow(a.over_3, f.over_3) + '<b>' + a.over_3 + '</b><em>over 3m</em></span>' +
             '<span class="st">' + arrow(a.over_10, f.over_10) + '<b>' + a.over_10 + '</b><em>over 10m</em></span>' +
           '</span></div>';
    });
    h += '</div>';

    var low = ranked.filter(function (a) { return a.band === 'low'; });
    if (low.length) {
      h += '<div class="card flag"><h2>Below the bar on all three</h2><ul>';
      low.slice().reverse().forEach(function (a) {
        h += '<li><b>' + esc(a.name) + '</b><span>' + hm(a.talk) + ' · ' +
             a.attempts + ' dials · ' + a.over_3 + ' over 3m</span></li>';
      });
      h += '</ul><p class="note">Behind on time, volume <b>and</b> conversation length ' +
           '— not just one. Best place to start is dials.</p></div>';
    }
    if (thin.length) {
      h += '<div class="card"><h2>Not enough calls logged to rank</h2><ul>';
      thin.forEach(function (a) {
        h += '<li><b>' + esc(a.name) + '</b><span>' + a.attempts + ' call' +
             (a.attempts === 1 ? '' : 's') + ' · ' + hm(a.talk) + ' talk</span></li>';
      });
      h += '</ul><p class="note">Under ' + (d.meta.min_calls_to_rank) +
           ' calls on the system — usually a part shift, not a slow day.</p></div>';
    }

    if (!SHARE) {
      var r = d.recon || {};
      h += '<div class="card"><h2>RingEX ↔ RingCX reconciliation</h2><div class="recon">' +
        '<div class="rc rc-good"><b>' + r.matched + '</b><span>matched call for call</span></div>' +
        '<div class="rc rc-bad"><b>' + r.ex_only + '</b><span>connected in RingEX, absent from RingCX (' +
          Math.round(r.ex_only_seconds / 60) + ' min)</span></div>' +
        '<div class="rc rc-warn"><b>' + r.uc_only + '</b><span>in RingCX, absent from RingEX</span></div>' +
        '<div class="rc"><b>' + r.ex_missed_absent + '</b><span>missed, correctly absent</span></div>' +
        '</div><p class="note">RingCX holds <b>' + (r.coverage_pct == null ? '—' : r.coverage_pct + '%') +
        '</b> of the connected RingEX calls. The board above merges both, counting each matched call once.</p></div>';

      (d.warnings || []).forEach(function (w) {
        h += '<div class="card warn"><h2>' + esc(w.kind.replace(/_/g, ' ')) + '</h2>' +
             '<p class="note">' + esc(w.detail || '') +
             (w.values ? ' — ' + w.values.map(function (v) { return esc(v[0]) + ' ×' + v[1]; }).join(', ') : '') +
             (w.count ? ' — ' + w.count + ' rows' : '') + '</p></div>';
      });
    }

    h += '<p class="note">Both phone systems combined, no call counted twice. Talk time only ' +
         '— wrap and admin not counted. Inbound talk uses the call-log duration, which ' +
         'includes ring time. Shift length isn’t in the data, so a half day sits beside a full one.</p>';
    $('out').innerHTML = h;
  }

  function load() {
    var s = $('start'), e = $('end');
    var q = new URLSearchParams();
    if (s && s.value) q.set('start', s.value);
    if (e && e.value) q.set('end', e.value);
    q.set('tz', new Date().getTimezoneOffset());
    if (SHARE && TOKEN) q.set('k', TOKEN);
    if ($('spin')) $('spin').textContent = 'loading…';
    fetch('/api/v5/report?' + q.toString(), { credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if ($('spin')) $('spin').textContent = '';
        if (!res.ok) {
          $('out').innerHTML = '<div class="msg err"><b>' + esc(res.j.error || 'error') +
            '</b><br>' + esc(res.j.detail || '') + '</div>';
          return;
        }
        var m = res.j.meta || {};
        $('stamp').textContent = (m.window && m.window.start ? m.window.start : '') +
          ' · ' + m.ringex_calls + ' RingEX calls, ' + m.ringcx_rows + ' RingCX interactions' +
          ' · as of ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        render(res.j);
      })
      .catch(function (err) {
        if ($('spin')) $('spin').textContent = '';
        $('out').innerHTML = '<div class="msg err">Could not reach the report: ' + esc(err) + '</div>';
      });
  }

  if (!SHARE) {
    var t = new Date(), iso = new Date(t.getTime() - t.getTimezoneOffset() * 60000)
      .toISOString().slice(0, 10);
    $('start').value = iso; $('end').value = iso;
    $('go').addEventListener('click', load);
  }
  load();
  setInterval(load, 15 * 60 * 1000);   // hourly report, refreshed 4x an hour
})();
</script>
</body>
</html>
