<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sales Floor Scoreboard</title>
{% include "_board_style.html" %}
</head>
<body>
<div class="wrap">
  <h1>Sales Floor Scoreboard</h1>
  <p class="sub" id="stamp">Loading…</p>
  <p class="age" id="age"></p>
  {% if not share_mode %}
  <div class="ctl">
    <input type="date" id="start" /><input type="date" id="end" />
    <button id="go">Refresh</button><span class="spin" id="spin"></span>
  </div>
  <div class="ctl" id="days"></div>
  {% endif %}
  <div id="out"><div class="msg">Pulling calls from RingEX and RingCX…</div></div>
</div>
{% include "_teamboard.html" %}

<script>
(function () {
  var SHARE = {{ 'true' if share_mode else 'false' }};
  var TOKEN = {{ (share_token or '')|tojson }};
  var $ = function (id) { return document.getElementById(id); };

  function hm(s) {
    s = Math.round(s || 0);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return h ? h + ':' + p(m) + ':' + p(x) : m + ':' + p(x);
  }
  // A median over an even number of people lands on .5 — right, but it reads as a
  // typo. Display rounds; every comparison still uses the true value.
  function w(n) { return Math.round(n || 0); }
  function fmt(n) { return Math.round(n || 0).toLocaleString('en-US'); }   // 3,095 not 3095 in the summary
  function money(v) {
    return v == null ? '\u2014' : '$' + Math.round(v).toLocaleString();
  }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // ---- Texts, from each rep's RingEX extension (/api/v5/sms). Danny,
  // 2026-10-15: "add inbound outbound sms sent auto and manual and unread to
  // the sales call board". Fetched beside the report, never in its way: the
  // line under a name appears when the texts land and is repainted in place.
  var SMS = null, SMS_KEY = '', SMS_TRIES = 0;
  // Each rep's scheduled Zoho follow-ups (/api/v5/followups), painted in place
  // like the texts: a hairline under the name, a line in the panel, a summary row.
  var FU = null, FU_KEY = '', FU_TRIES = 0;
  function smsNorm(n) { return String(n || '').toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function smsFor(name) {
    if (!SMS || !SMS.agents) return null;
    var want = smsNorm(name), byNorm = {}, k;
    for (k in SMS.agents) byNorm[smsNorm(k)] = SMS.agents[k];
    if (byNorm[want]) return byNorm[want];
    var t = want.split(' '), hits = [];
    for (k in byNorm) { var kt = k.split(' '); if (kt.indexOf(t[0]) >= 0 && kt.indexOf(t[t.length - 1]) >= 0) hits.push(byNorm[k]); }
    return hits.length === 1 ? hits[0] : null;
  }
  function smsLine(name) {
    var s = smsFor(name);
    if (!s) return '';
    if (s.unknown) return '<span class="sms na" title="' + esc('The message store refused this read (rate limited); it will be read on the next refresh. Unknown, not zero.') + '">texts not read yet</span>';
    var split = s.sent_typed != null && s.sent_auto != null;
    var tip = s.sent + ' texts sent' + (split ? ' (' + s.sent_typed + ' typed by hand, ' + s.sent_auto + ' automated)' : '') +
              ', ' + s.received + ' received, ' + s.unread + ' received and not opened yet, ' +
              s.unanswered + ' conversation' + (s.unanswered === 1 ? '' : 's') + ' where the patient wrote last' +
              (s.complete ? '' : ' -- part of the window could not be read, so these are a floor') + '. RingEX extension ' + (s.ext || '?') + '.';
    return '<span class="sms" title="' + esc(tip) + '"><b>' + s.sent + '</b>\u2191' +
      (split && s.sent_auto ? ' <i>(' + s.sent_typed + ' typed \u00b7 ' + s.sent_auto + ' auto)</i>' : '') +
      ' <b>' + s.received + '</b>\u2193' +
      (s.unread ? ' \u00b7 <b class="hot">' + s.unread + '</b> unread' : '') +
      (s.unanswered ? ' \u00b7 ' + s.unanswered + ' waiting' : '') +
      (s.complete ? '' : ' <i>+</i>') + '</span>';
  }
  // What needs doing, and nothing else: missed calls nobody got back to,
  // texts not opened, conversations waiting on a reply. Empty when all clear.
  var AG = {};
  // Missed inbound calls, newest first: the number to call back, or who got
  // back to it and when. Signed-in only (the share link gets counts).
  function missedList(a) {
    var L = a.missed_calls || [];
    if (!L.length) return '';
    return '<div class="ml"><div class="ml-h">Missed calls \u00b7 ' + (a.missed_open || 0) + ' not called back</div>' +
      L.map(function (m) {
        return '<div class="ml-r' + (m.resolved ? ' done' : '') + '"><span class="ml-t">' + esc(m.at) + '</span>' +
          (m.resolved ? '<span class="ml-n">' + esc(m.number) + '</span><span class="ml-s">' + esc((m.back || {}).how || 'called back') + ' ' + esc((m.back || {}).at || '') +
                        ((m.back || {}).by && (m.back || {}).by !== a.name ? ' \u00b7 ' + esc(m.back.by) : '') + '</span>'
                      : '<a class="ml-n" href="tel:' + esc(m.number.replace(/[^0-9]/g, '')) + '">' + esc(m.number) + '</a><span class="ml-s hot">call back</span>') + '</div>';
      }).join('') + '</div>';
  }

  function pressLine(name) {
    var a = AG[name] || {}, s = smsFor(name) || {}, bits = [];
    if (a.missed_open) bits.push('<b class="hot">' + a.missed_open + '</b> missed');
    if (s.unread) bits.push('<b class="hot">' + s.unread + '</b> unread');
    if (s.unanswered) bits.push(s.unanswered + ' waiting');
    if (!bits.length) return '';
    return '<span class="press" title="' + esc((a.missed_open ? a.missed_open + ' missed inbound call' + (a.missed_open === 1 ? '' : 's') + ' not called back \u00b7 ' : '') +
           (s.unread ? s.unread + ' text' + (s.unread === 1 ? '' : 's') + ' not opened \u00b7 ' : '') +
           (s.unanswered ? s.unanswered + ' text conversation' + (s.unanswered === 1 ? '' : 's') + ' waiting on a reply' : '')) + '">' +
           bits.join(' \u00b7 ') + '</span>';
  }

  function smsPaint() {
    var out = $('out'); if (!out) return;
    [out].forEach(function (box) {
      if (!box) return;
      box.querySelectorAll('.nm[data-name]').forEach(function (el) {
        var old = el.querySelector('.press'); if (old) old.remove();
        var html = pressLine(el.getAttribute('data-name'));
        var bar = el.querySelector('.prog.fu');
        if (html) { if (bar) bar.insertAdjacentHTML('beforebegin', html); else el.insertAdjacentHTML('beforeend', html); }
      });
      // the full texts line lives in the panel
      box.querySelectorAll('.dsms[data-name]').forEach(function (el) {
        el.innerHTML = smsLine(el.getAttribute('data-name')) || '\u2014';
      });
    });
    var row = $('smsrow'), rv = $('smsrowv');
    if (SMS && SMS.totals && row && rv) {
      var T = SMS.totals, sp = T.sent_typed != null;
      rv.innerHTML = (window.TB ? TB.segs : String)('<b>' + fmt(T.sent) + '</b> sent' + (sp ? ' <i>' + fmt(T.sent_typed) + ' typed \u00b7 ' + fmt(T.sent_auto) + ' auto</i>' : '') +
        '<span class="sep">\u00b7</span><b>' + fmt(T.received) + '</b> received' +
        '<span class="sep">\u00b7</span><b' + (T.unread ? ' class="hot"' : '') + '>' + fmt(T.unread) + '</b> unread' +
        '<span class="sep">\u00b7</span><b>' + fmt(T.unanswered) + '</b> waiting on a reply' +
        (T.incomplete_seats ? '<span class="sep">\u00b7</span><i>' + T.incomplete_seats + ' line' + (T.incomplete_seats === 1 ? '' : 's') + ' partly read</i>' : '') +
        (T.unknown_seats ? '<span class="sep">\u00b7</span><i>' + T.unknown_seats + ' line' + (T.unknown_seats === 1 ? '' : 's') + ' not read yet</i>' : ''));
      row.hidden = false;
    }
    smsPanel();
  }
  // The other lines' texts, a small table at the foot of the board.
  function smsPanel() {
    var old = $('smspanel'); if (old) old.remove();
    var P = (SMS && SMS.panel) || [], un = (SMS && SMS.panel_unresolved) || [];
    if (!P.length && !un.length) return;
    var n = function (v, hot, cls) { return '<span class="' + cls + (hot && v ? ' hot' : '') + '">' + w(v) + '</span>'; };
    var rows = P.map(function (a) {
      var who = '<span class="rk"></span><span class="nm" title="' + esc((a.name || a.label) + ' \u00b7 ext ' + (a.ext || '?') +
                (a.complete ? '' : ' \u00b7 partly read, so these are a floor')) + '">' + esc(a.label) + (a.complete ? '' : '<i>+</i>') + '</span>';
      if (a.unknown) return '<div class="sp-r">' + who + '<span class="sp-na">not read yet</span></div>';
      return '<div class="sp-r">' + who + n(a.received, false, 'sp-in') + n(a.sent, false, 'sp-out') +
             n(a.unanswered, true, 'sp-un') + n(a.unread, true, 'sp-ur') + '</div>';
    }).join('') + un.map(function (l) {
      return '<div class="sp-r"><span class="rk"></span><span class="nm">' + esc(l) + '</span><span class="sp-na">no RingEX line found</span></div>';
    }).join('');
    var dn = $('datanotes');
    (dn ? dn : $('out')).insertAdjacentHTML(dn ? 'beforebegin' : 'beforeend', '<div id="smspanel" class="smspanel"><h2>Texts \u00b7 other lines</h2>' +
      '<div class="sp-hd"><span class="rk"></span><span class="nm">Line</span><span class="sp-in" title="Received">In</span>' +
      '<span class="sp-out" title="Sent">Out</span>' +
      '<span class="sp-un" title="Conversations where the other side wrote last"><span class="lead-long">Unanswered</span><span class="lead-short">Waiting</span></span>' +
      '<span class="sp-ur" title="Received and not opened">Unread</span></div>' + rows + '</div>');
  }

  function loadSms(q) {
    var key = q.toString();
    if (key !== SMS_KEY) { SMS = null; SMS_KEY = key; SMS_TRIES = 0; }
    var names = Array.prototype.map.call(document.querySelectorAll('#out .nm[data-name]'), function (el) { return el.getAttribute('data-name'); });
    fetch('/api/v5/sms?' + key + (names.length && SMS_TRIES === 0 ? '&names=' + encodeURIComponent(names.join('|')) : ''), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || key !== SMS_KEY) return;
        if (j.loading || j.refreshing) {
          if (++SMS_TRIES <= 30) setTimeout(function () { if (key === SMS_KEY) loadSms(q); }, 8000);   // a cold build takes ~2 min
        }
        if (j.agents && Object.keys(j.agents).length) { SMS = j; smsPaint(); }
      })
      .catch(function () {});
  }

  function fuState(name) {
    if (!FU) return 'loading';
    if ((FU.not_crm_users || []).indexOf(name) !== -1) return 'not_crm';
    return FU.error ? 'error' : 'loading';
  }
  function fuPaint() {
    if (!window.TB) return;
    var by = (FU && FU.by) || {};
    var box = $('out');
    if (box) {
      var names = [];
      box.querySelectorAll('.nm[data-name]').forEach(function (el) {
        var n = el.getAttribute('data-name'); names.push(n);
        var old = el.querySelector('.prog.fu'); if (old) old.remove();
        var html = TB.fuBar(by[n]);
        if (html) el.insertAdjacentHTML('beforeend', html);
      });
      box.querySelectorAll('.dfu[data-name]').forEach(function (el) {
        var n = el.getAttribute('data-name');
        el.innerHTML = TB.fuLine(by[n], fuState(n));
      });
      var sum = box.querySelector('.sum'), line = FU ? TB.fuSum(by, names) : '';
      if (sum) {
        var row = sum.querySelector('.srow.fu-sum');
        if (!line) { if (row) row.remove(); }
        else {
          if (!row) {
            sum.insertAdjacentHTML('beforeend', '<div class="srow fu-sum" title="Scheduled follow-up calls in Zoho whose time has come, and the ones still to come">' +
                                                '<span class="sl">Due</span><span class="sv"></span></div>');
            row = sum.querySelector('.srow.fu-sum');
          }
          row.querySelector('.sv').innerHTML = TB.segs(line);
        }
      }
    }
  }
  function loadFu(q) {
    var key = q.toString();
    if (key !== FU_KEY) { FU = null; FU_KEY = key; FU_TRIES = 0; }
    var names = [];
    var box = $('out');
    if (box) box.querySelectorAll('.nm[data-name]').forEach(function (el) { names.push(el.getAttribute('data-name')); });
    fetch('/api/v5/followups?' + key + (names.length ? '&names=' + encodeURIComponent(names.join('|')) : ''), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || key !== FU_KEY) return;
        if (j.loading) {
          if (++FU_TRIES <= 15) setTimeout(function () { if (key === FU_KEY) loadFu(q); }, 8000);
          return;
        }
        FU = j; fuPaint();
      })
      .catch(function () {});
  }

  function cell(v, med, cls, label) {
    var up = v >= med;
    return '<span class="' + cls + ' ' + (up ? 'up' : 'down') + '">' +
           '<span class="mk">' + (up ? '▲' : '▼') + '</span>' + w(v) +
           '<span class="lbl">' + label + '</span></span>';
  }

  function render(d) {
    var f = d.floor || {}, ranked = d.ranked || [], thin = d.unranked || [];
    if (!ranked.length && !thin.length) {
      // "No calls logged" was the one thing that wasn't true: the header counts
      // RingEX, but rows are built from RingCX, so an interaction report that
      // hasn't arrived yet and a genuinely quiet floor rendered identically --
      // and the page contradicted its own subtitle.
      var m = d.meta || {}, rc = d.recon || {};
      var cxEmpty = (d.warnings || []).some(function (x) { return x.kind === 'source_empty'; });
      var ex = m.ringex_calls || 0, msg;
      if (cxEmpty) {
        msg = '<b>No agent rows yet.</b> Today\'s RingCX interaction report hasn\'t arrived. ' +
              'Agent names, talk time and the campaign split all come from that report — ' +
              'the first one lands about 7:45 AM.';
        var bits = [];
        if (rc.ex_missed_absent) bits.push(rc.ex_missed_absent + ' rang out unanswered');
        if (rc.ex_connected) bits.push(rc.ex_connected + ' answered but not attributed to an agent');
        if (ex) {
          msg += '<div class="sub">' + ex + ' RingEX call' + (ex === 1 ? '' : 's') +
                 ' on the line so far' + (bits.length ? ': ' + bits.join(', ') : '') + '.</div>';
        }
      } else {
        msg = 'No calls logged in this window.';
      }
      $('out').innerHTML = '<div class="msg">' + msg + '</div>'; return;
    }
    // Did Books answer, figure by figure? A zero it never sent and a zero it did
    // are the same digit on screen and mean opposite things -- and one refused
    // module must not blank the figures that did arrive.
    var bm = (d.meta || {}).books;
    var bErr = ((bm && bm.errors) || []).map(function (e) { return e.metric; });
    var booksHas = function (metric) {
      return !!bm && !bm.loading && bErr.indexOf(metric) === -1;
    };
    var everyone = ranked.concat(thin);
    var sumB = function (k) {
      return everyone.reduce(function (s, a) { return s + ((a.books || {})[k] || 0); }, 0);
    };
    var bcell = function (v, metric, cls, one, many) {
      var ok = booksHas(metric), n = w(v);
      return '<span class="' + cls + (ok && !n ? ' zero' : '') + '">' +
             (ok ? n : '\u2014') + '<span class="lbl"> ' + (n === 1 ? one : many) +
             '</span></span>';
    };
    var h = '';
    h += '<div class="sum"><div class="floor srow"><span class="sl"><span class="lead-long">Floor</span>' +
         '<span class="lead-short">Floor</span></span><span class="sv"><b>' + hm(f.talk) + '</b> talk' +
         '<span class="sep">·</span><b>' + w(f.attempts) + '</b> dials' +
         '<span class="sep">·</span><b>' + w(f.over_3) + '</b> &gt;3m' +
         '<span class="sep">·</span><b>' + w(f.over_10) + '</b> &gt;10m <i class="med">median rep</i></span></div>';
    h += '<div class="tot srow"><span class="sl">Sent</span><span class="sv"><b>' +
         (booksHas('quotes_sent') ? w(sumB('quotes_sent')) : '\u2014') + '</b> quotes' +
         '<span class="sep">·</span><b>' +
         (booksHas('retainers_sent') ? w(sumB('retainers_sent')) : '\u2014') + '</b> retainers' +
         (booksHas('retainers_paid')
            ? '<span class="sep">·</span><b>' + w(sumB('retainers_paid')) + '</b> paid' : '') +
         (bm && bm.loading ? '<span class="sep">·</span>loading from Books…' : '') +
         (booksHas('quotes_sent') && bm.quotes_by_books_date != null
            ? '<br><span class="alt">Books date filter: ' + w(bm.quotes_by_books_date) + ' quotes' +
              (bm.retainers_by_books_date != null
                 ? ' · ' + w(bm.retainers_by_books_date) + ' retainers' : '') +
              ' — a quote written in the evening carries the next day\u2019s date</span>'
            : '') + '</span></div>';
    var TT = d.totals || {};
    if ((TT.inbound || 0) + (TT.outbound || 0)) {
      h += '<div class="srow" title="Every call on the board, by its own direction"><span class="sl">Calls</span><span class="sv">' +
           '<b>' + fmt(TT.inbound) + '</b> inbound <i>' + fmt(TT.inbound_answered) + ' answered</i>' +
           '<span class="sep">\u00b7</span><b>' + fmt(TT.outbound) + '</b> outbound' +
           // what the reps recorded: a conversation, and how many booked a next step
           (TT.reached ? '<span class="sep">\u00b7</span><b title="Outbound calls the rep recorded as a conversation: anything but no answer, voicemail, a bad line, a wrong number, do not call, or no disposition">' +
                         fmt(TT.reached) + '</b> reached <i>' + fmt(TT.booked) + ' next step booked</i>' : '') +
           (TT.dnc ? '<span class="sep">\u00b7</span><b class="hot" title="Calls the rep dispositioned DNC (Do Not Call)">' + fmt(TT.dnc) + '</b> do not call' : '') +
           (TT.missed_in ? '<span class="sep">\u00b7</span><b' + (TT.missed_open ? ' class="hot"' : '') + '>' + fmt(TT.missed_open) + '</b> missed not called back <i>of ' + fmt(TT.missed_in) + '</i>' : '') +
           (TT.dir_unknown ? '<span class="sep">\u00b7</span><i>' + fmt(TT.dir_unknown) + ' with no direction</i>' : '') + '</span></div>';
    }
    // Texts land after the report; smsPaint fills this row in place.
    h += '<div class="srow" id="smsrow" hidden><span class="sl">Texts</span><span class="sv" id="smsrowv"></span></div></div>';
    // A legend, not a tooltip: this is read on phones, where hover does not exist.
    h += '<div class="key">' +
           '<span><b class="u">▲</b><b class="d">▼</b> vs the floor</span>' +
           '<span><b>Floor</b> = median rep, not a target</span>' +
           '<span><b>Talk</b> excludes wrap</span>' +
           '<span><b>&gt;3m/&gt;10m</b> = real conversations, not dialer touches</span>' +
         '</div>';

    h += '<div class="hd"><span class="a-rk"></span><span class="a-nm">Rep</span>' +
         '<span class="a-tk">Talk</span><span class="a-d">Dials</span>' +
         '<span class="a-t3">&gt;3m</span>' +
         '<span class="a-q" title="Quotes sent in this window (Books)">Quotes</span><span class="a-rt" title="Retainers paid in full in this window (Books)">Paid</span></div>';
    AG = {};
    ranked.forEach(function (a) { AG[a.name] = a; });
    ranked.forEach(function (a, i) {
      var up = a.talk >= f.talk;
      const bk = a.books || {};
      const cell2 = function (label, value, isZero) {
        return '<div' + (isZero ? ' class="zero"' : '') + '><em>' + label +
               '</em><b>' + value + '</b></div>';
      };
      h += '<div class="r ' + a.band + '" role="button" tabindex="0" aria-expanded="false"' +
           ' data-det="d' + i + '"><span class="rk">' + (i + 1) + '</span>' +
           '<span class="nm" data-name="' + esc(a.name) + '">' + esc(a.name) + pressLine(a.name) + '</span>' +
           '<span class="tk ' + (up ? 'up' : 'down') + '"><span class="mk">' +
             (up ? '▲' : '▼') + '</span>' + hm(a.talk) + '</span>' +
           cell(a.attempts, f.attempts, 'd', ' dials') +
           // ">3m" not " over 3m": these labels appear on phones only -- above
           // 560px the column headers say it -- and the long form was most of
           // the width of the row it sat under.
           cell(a.over_3, f.over_3, 't3', ' >3m') +
           bcell(bk.quotes_sent, 'quotes_sent', 'q', 'quote', 'quotes') +
           // PAID retainers (Books, closed in the window) -- not sent. Sent lives in the panel.
           bcell(bk.retainers_paid, 'retainers_paid', 'rt', 'paid', 'paid') +
           '</div>';
      h += '<div class="det" id="d' + i + '"><div class="dg">' +
             cell2('Campaign', hm(a.campaign), !a.campaign) +
             cell2('Direct', hm(a.direct), !a.direct) +
             cell2('Longest', hm(a.longest)) +
             cell2('Inbound', w(a.inbound || 0) + ' <i>' + w(a.inbound_answered || 0) + ' answered</i>', !a.inbound) +
             cell2('Outbound', w(a.outbound || 0), !a.outbound) +
             cell2('Reached', w(a.reached || 0) + ' <i>' + w(a.booked || 0) + ' booked \u00b7 ' + w(a.quoted || 0) + ' quoted</i>', !a.reached) +
             cell2('No answer / VM', w(a.not_reached || 0), !a.not_reached) +
             (a.no_disposition ? cell2('No disposition', w(a.no_disposition)) : '') +
             (a.dnc ? cell2('Do not call', '<span class="hot">' + w(a.dnc) + '</span>') : '') +
             cell2('Over 10 min', w(a.over_10 || 0), !a.over_10) +
             cell2('Texts', '<span class="dsms" data-name="' + esc(a.name) + '">' + (smsLine(a.name) || '\u2014') + '</span>') +
             cell2('Follow-ups', '<span class="dfu" data-name="' + esc(a.name) + '">' + (window.TB ? TB.fuLine((FU && FU.by || {})[a.name], fuState(a.name)) : '\u2014') + '</span>') +
             '<span class="rule"></span>' +
             // Quotes sent is in the row now; the panel keeps what the row does not.
             cell2('Quotes invoiced', booksHas('quotes_sent') ? w(bk.quotes_invoiced || 0) : '\u2014',
                   !bk.quotes_invoiced) +
             // Follow Up Created is HIDDEN, not removed: the API still computes
             // it, so it returns the moment the CRM name join is sorted. Owner
             // arrives without a name on this token (owner_surnames: [""]), so
             // nothing can be attributed and every cell would read as a dash --
             // worse than not showing the row at all.
             '' +
             // Retainers paid, back now the Books token is sorted. Shown ONLY
             // when Books actually answered: a confident 0 for money that may
             // well have been collected is worse than showing nothing, which is
             // why this was hidden rather than deleted while the token was
             // refusing. booksHas carries that distinction.
             // The row shows retainers PAID; the panel keeps how many went out
             // and what the paid ones were worth.
             cell2('Retainers sent', booksHas('retainers_sent') ? w(bk.retainers_sent || 0) : '\u2014', !bk.retainers_sent) +
             (booksHas('retainers_paid')
                ? cell2('Paid $', bk.paid_amount ? money(bk.paid_amount) : '\u2014', !bk.paid_amount)
                : '') +
             // Where the talk time actually went. Name and time only -- the point
             // is which queues a rep is living in, and a call count beside each
             // one turns a glance into a reading exercise.
             ((a.channels && a.channels.length) ? '<div class="chan">' +
                a.channels.map(function (c) {
                  return '<div><span>' + esc(c.name) + '</span><b>' +
                         hm(c.talk) + '<i>' + w(c.calls) + '</i></b></div>';
                }).join('') + '</div>' : '') +
           '</div>' + missedList(a) + '</div>';
    });

    var low = ranked.filter(function (a) { return a.band === 'low'; });
    if (low.length) {
      h += '<h2>Below the floor on all three</h2><ul>';
      low.slice().reverse().forEach(function (a) {
        h += '<li class="low"><b>' + esc(a.name) + '</b><span>' + hm(a.talk) + ' talk · ' +
             w(a.attempts) + ' dials · ' + w(a.over_3) + ' over 3m</span></li>';
      });
      h += '</ul><p class="note">Behind on time, volume <b>and</b> conversation length — ' +
           'not just one. Dials are the place to start.</p>';
    }
    if (thin.length) {
      h += '<h2>No calls yet</h2><ul>';
      thin.forEach(function (a) {
        var tb = a.books || {}, xtra = '';
        if (tb.quotes_sent) xtra += ' · ' + w(tb.quotes_sent) + ' quote' + (tb.quotes_sent === 1 ? '' : 's');
        if (tb.retainers_sent) xtra += ' · ' + w(tb.retainers_sent) + ' retainer' + (tb.retainers_sent === 1 ? '' : 's');
        h += '<li><b>' + esc(a.name) + '</b><span>' + w(a.attempts) + ' call' +
             (a.attempts === 1 ? '' : 's') + ' · ' + hm(a.talk) + ' talk' + xtra + '</span></li>';
      });
      h += '</ul><p class="note">No calls logged yet in this window.</p>';
    }


    (d.warnings || []).forEach(function (x) {
      if (x.kind === 'report_stale') h += '<div class="warn">' + esc(x.detail) + '</div>';
      if (x.kind === 'report_stopped') h += '<div class="warn">' + esc(x.detail) + '</div>';
    });

    // Data notes: how the board was built and what it could not match --
    // folded, one line until opened (design pass 2026-10-15).
    var notes = '', nNotes = 0;
    if (!SHARE) {
      // Books work with nowhere to sit -- no salesperson on the document, or a
      // name that matches no rep here. Named, so the totals above never quietly
      // disagree with Books.
      if (booksHas('quotes_sent') && booksHas('retainers_sent')) {
        var xq = (bm.quotes_sent_rows || 0) - sumB('quotes_sent'),
            xr = (bm.retainers_sent_rows || 0) - sumB('retainers_sent');
        if (xq > 0 || xr > 0) {
          nNotes++, notes += '<div class="warn">Books has ' + xq + ' more quote' + (xq === 1 ? '' : 's') +
               ' and ' + xr + ' more retainer' + (xr === 1 ? '' : 's') +
               ' than this board shows (no salesperson set, or a name with no row here)' +
               ((bm.not_on_board || []).length
                  ? '. Books names without a row: ' + bm.not_on_board.map(esc).join(', ')
                  : '') + '.</div>';
        }
      }
      var r = d.recon || {};
      nNotes++, notes += '<div class="recon">RingCX holds <b>' +
           (r.coverage_pct == null ? '—' : r.coverage_pct + '%') + '</b> of the connected ' +
           'RingEX calls · <b>' + w(r.matched) + '</b> matched · <b>' + w(r.ex_only) +
           '</b> RingEX-only · <b>' + w(r.uc_only) + '</b> RingCX-only · <b>' +
           w(r.ex_missed_absent) + '</b> missed</div>';
      (d.warnings || []).forEach(function (x) {
        if (x.kind === 'report_stale') return;
        if (x.kind === 'report_stopped') return;
        nNotes++, notes += '<div class="warn">' + esc(x.kind.replace(/_/g, ' ')) + ' — ' + esc(x.detail || '') +
             (x.values ? ' (' + x.values.map(function (v) { return esc(v[0]) + ' ×' + v[1]; }).join(', ') + ')' : '') +
             '</div>';
      });
    }
    if (window.TB) nNotes++, notes += '<p class="note">' + TB.FU_NOTE + '</p>';
    nNotes++, notes += '<p class="note">Both phone systems combined, no call counted twice. Talk time only — ' +
         'wrap and admin excluded. Shift length isn’t in the data, so a half day sits beside a full one.</p>';
    h += '<details class="notes" id="datanotes"><summary>Data notes' + (nNotes ? ' (' + nNotes + ')' : '') + '</summary>' + notes + '</details>';
    $('out').innerHTML = h;
    // the floor's summary lines break between figures, never inside one, as
    // every team's do (TB.segs); the texts row is segmented when it lands
    if (window.TB) $('out').querySelectorAll(':scope > .sum .sv').forEach(function (el) {
      if (el.id !== 'smsrowv') el.innerHTML = TB.segs(el.innerHTML);
    });

    // Expand on click. Delegated so it survives every refresh, and keyboard
    // reachable because the rows are the only way into this detail.
    $('out').querySelectorAll('.r[data-det]').forEach(function (row) {
      const open = function () {
        const d = document.getElementById(row.getAttribute('data-det'));
        if (!d) return;
        const wasOpen = d.classList.contains('on');
        // One at a time. Several panels open at once pushed the rows below off
        // screen, so comparing two reps meant scrolling past the first one's
        // detail to reach the second.
        $('out').querySelectorAll('.det.on').forEach(function (o) {
          o.classList.remove('on');
        });
        $('out').querySelectorAll('.r[aria-expanded="true"]').forEach(function (r) {
          r.setAttribute('aria-expanded', 'false');
        });
        if (!wasOpen) {
          d.classList.add('on');
          row.setAttribute('aria-expanded', 'true');
        }
      };
      row.addEventListener('click', open);
      row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });
    });
  }

  var LAST_OK = null, STALE = false, BOOKS_RETRY = 0, BOOKS_TIMER = null;

  function stampAge() {
    var el = $('age');
    if (!el) return;
    if (!LAST_OK) { el.textContent = ''; return; }
    var mins = Math.floor((Date.now() - LAST_OK.getTime()) / 60000);
    var t = LAST_OK.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    // Past two refresh intervals something is wrong -- say so rather than let a
    // frozen page pass for a quiet one.
    // Silent when healthy: the header already carries the report time, and a
    // second line repeating it is noise. This line exists for the case the
    // header cannot show -- a page that has stopped reaching the server at all.
    if (STALE || mins >= 11) {
      el.className = 'age bad';
      el.textContent = 'not updating — last reached the server at ' + t +
                       ' (' + mins + ' min ago). Reload.';
    } else {
      el.className = 'age';
      el.textContent = '';
    }
  }
  setInterval(stampAge, 30 * 1000);

  function load() {
    var s = $('start'), e = $('end'), q = new URLSearchParams();
    if (s && s.value) q.set('start', s.value);
    if (e && e.value) q.set('end', e.value);
    q.set('tz', new Date().getTimezoneOffset());
    if (SHARE && TOKEN) q.set('k', TOKEN);
    if ($('spin')) $('spin').textContent = '…';
    fetch('/api/v5/report?' + q.toString(), { credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if ($('spin')) $('spin').textContent = '';
        if (!res.ok) {
          $('out').innerHTML = '<div class="msg err"><b>' + esc(res.j.error || 'error') +
            '</b> ' + esc(res.j.detail || '') + '</div>';
          return;
        }
        var m = res.j.meta || {}, src = m.ringcx_source || {};
        // Say how far into the day the DATA reaches, not just when the page loaded.
        // Two views of the same day disagree constantly when one has an extra hour
        // in it, and without this line that looks like a bug rather than a clock.
        var covers = (src.covers_to || '').slice(0, 5);
        var pretty = '';
        if (covers) {
          var hh = parseInt(covers.slice(0, 2), 10), mm = covers.slice(3, 5);
          pretty = (hh % 12 || 12) + ':' + mm + (hh < 12 ? ' AM' : ' PM');
        }
        // When the REPORT arrived, which is not the same as how far its starts
        // reach. covers_to is the latest interaction START, so a call that began
        // at 10:50 and ended at 11:40 joins the report without moving it -- two
        // reports in a row read "through 11:10" while rows climbed 263 -> 271, and
        // that looked exactly like a stalled pipeline. Show both.
        var got = '';
        if (typeof src.age_hours === 'number') {
          var gotAt = new Date(Date.now() - src.age_hours * 3600 * 1000);
          got = gotAt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }
        // One line. "through" is how far the data reaches; "updated" is when the
        // report landed. Both are needed -- they come apart whenever someone is on
        // a long call -- but they do not need a sentence each.
        $('stamp').innerHTML =
          (m.window && m.window.start ? esc(m.window.start) + ' · ' : '') +
          (pretty ? '<b>through ' + pretty + '</b> · ' : '') +
          (got ? 'updated ' + got + ' · ' : '') +
          '<span class="counts">' + m.ringex_calls + ' RingEX · ' +
          m.ringcx_rows + ' RingCX</span>' +
          (src.source === 'live_cdr_api' ? ' · live pull' : '') +
          (m.ringex_calls === 0 ? ' · <b class="down">no RingEX calls</b>' : '');
        // When the page last actually FETCHED, which is a different fact from how
        // far the data reaches. Without it a tab that quietly stopped refreshing
        // looks exactly like a quiet floor -- the same failure as a zero that
        // might mean "none" or might mean "could not read".
        LAST_OK = new Date();
        STALE = false;
        stampAge();
        var dz = $('days');
        if (dz && m.available_days) {
          dz.innerHTML = '';
          // available_days is the ingested-report inbox, so today earns a chip
          // only once its first Interaction Report lands -- mid-morning at the
          // earliest, and not at all on a quiet day. Until then tapping Aug 20
          // stranded you: nothing led back to the day the page opens on. Today
          // is always offered, and named, so the way home is never missing.
          var _n = new Date(),
              today = new Date(_n.getTime() - _n.getTimezoneOffset() * 60000)
                        .toISOString().slice(0, 10);
          var days = m.available_days.slice(0, 8);
          if (days.indexOf(today) === -1) { days.unshift(today); days = days.slice(0, 8); }
          days.forEach(function (day) {
            var b = document.createElement('button');
            b.className = 'day' + (day === $('start').value ? ' on' : '');
            b.textContent = day === today ? 'Today'
              : new Date(day + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' });
            b.onclick = function () { $('start').value = day; $('end').value = day; load(); };
            dz.appendChild(b);
          });
        }
        render(res.j);
        smsPaint();            // what is already known, at once
        loadSms(q);            // and the window's own texts, when they land
        loadFu(q);             // each rep's scheduled follow-ups in Zoho (forgets another window's at once)
        fuPaint();
        // Books is fetched in the background, so the first load of a day usually
        // lands before it has. Waiting out the five-minute timer left Quotes and
        // Retainers blank for that long; ask again shortly, a few times at most.
        var bmeta = (res.j.meta || {}).books;
        if (bmeta && bmeta.loading) {
          if (BOOKS_RETRY < 9) {
            BOOKS_RETRY++;
            clearTimeout(BOOKS_TIMER);
            BOOKS_TIMER = setTimeout(load, 10000);
          }
        } else {
          BOOKS_RETRY = 0;
        }
      })
      .catch(function (err) {
        if ($('spin')) $('spin').textContent = '';
        // Keep whatever is on screen -- stale figures with a warning beat an empty
        // board -- but mark it, and keep the interval running so it self-heals
        // once the server comes back (a deploy restart is the usual cause).
        STALE = true;
        stampAge();
        if (!LAST_OK) {
          $('out').innerHTML = '<div class="msg err">Could not reach the report: ' +
                               esc(err) + '</div>';
        }
      });
  }

  if (!SHARE) {
    var t = new Date(), iso = new Date(t.getTime() - t.getTimezoneOffset() * 60000)
      .toISOString().slice(0, 10);
    $('start').value = iso; $('end').value = iso;
    $('go').addEventListener('click', load);
  }
  load();
  // The server has new data every ~15 min (RingCX emits on that cadence and the
  // forwarder picks it up within 5). A 15-min page timer could therefore sit a
  // whole cycle behind what was already ingested; 5 keeps the screen level with
  // the server instead of trailing it.
  setInterval(load, 5 * 60 * 1000);
})();
</script>

</body>
