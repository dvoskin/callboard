<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote Follow-Ups — Sales Call Monitor</title>
  <style>
    :root {
      --bg: #eef0f5;
      --bg-grad: radial-gradient(ellipse at top left, #eaecf7 0%, #eef0f5 35%, #f0f1f6 100%);
      --surface: #ffffff; --surface2: #f7f8fc;
      --border: rgba(15,23,42,0.13); --sep: rgba(15,23,42,0.07);
      --text: #0b0e1a; --secondary: #5b6478; --tertiary: #94a0b8;
      --blue: #2563eb; --blue-dk: #1d4ed8; --green: #10b981; --green-dk: #047857;
      --red: #ef4444; --red-dk: #b91c1c;
      --radius-sm: 8px; --radius: 12px; --radius-lg: 18px;
      --shadow-sm: 0 1px 3px rgba(15,23,42,.07), 0 1px 2px rgba(15,23,42,.04);
      --shadow: 0 4px 24px rgba(15,23,42,.08), 0 1px 4px rgba(15,23,42,.06);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); background-image: var(--bg-grad);
      color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; padding: 18px; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .back { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--secondary); margin-bottom: 8px; }
    .back:hover { color: var(--blue); text-decoration: none; }
    .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
    .top h1 { margin: 0 0 2px; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
    .top .sub { color: var(--secondary); font-size: 12.5px; }
    .controls { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    input[type=date], select, input[type=search] {
      padding: 6px 9px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font: inherit; font-size: 13px; }
    input[type=search] { min-width: 190px; }
    .dash { color: var(--tertiary); }
    .btn { padding: 6px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
      color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--surface2); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { background: var(--blue-dk); }
    .btn.on { background: var(--text); border-color: var(--text); color: #fff; }

    /* Headline — the whole picture in one sentence */
    .headline { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); padding: 13px 16px; margin-bottom: 12px; font-size: 15px; line-height: 1.5; }
    .headline b { font-size: 17px; font-weight: 700; }
    .headline .hot { color: var(--red-dk); }
    .headline .good { color: var(--green-dk); }
    .headline .sep { color: var(--tertiary); margin: 0 8px; }
    .headline .calm { color: var(--secondary); font-size: 13.5px; }

    /* Agent scoreboard */
    .board { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); margin-bottom: 12px; overflow: hidden; }
    .board-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 9px 14px; cursor: pointer; user-select: none; }
    .board-head h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--secondary); font-weight: 700; }
    .board-head .hint { font-size: 11.5px; color: var(--tertiary); font-weight: 500; }
    .board-body { border-top: 1px solid var(--sep); padding: 4px 0; max-height: 250px; overflow-y: auto; }
    .board-body.hide { display: none; }
    .agent { display: grid; grid-template-columns: 1fr 96px 110px 78px; align-items: center; gap: 10px;
      padding: 6px 14px; font-size: 13px; cursor: pointer; }
    .agent:hover { background: var(--surface2); }
    .agent.sel { background: rgba(37,99,235,.07); }
    .agent .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agent .meta { color: var(--tertiary); font-size: 11.5px; font-feature-settings: "tnum"; }
    .bar { height: 7px; background: var(--sep); border-radius: 999px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
    .bar > i.hot { background: var(--red); }
    .agent .verdict { text-align: right; font-weight: 700; font-size: 12px; }
    .agent .verdict.hot { color: var(--red-dk); }
    .agent .verdict.ok { color: var(--green-dk); }
    .agent .verdict.mid { color: var(--secondary); }

    .filters { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
    .filters .spacer { flex: 1; }
    .filters .count { font-size: 12px; color: var(--tertiary); font-feature-settings: "tnum"; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th { position: sticky; top: 0; z-index: 2; background: var(--surface2); text-align: left; font-size: 10.5px;
      text-transform: uppercase; letter-spacing: .03em; color: var(--secondary); font-weight: 600;
      padding: 8px 10px; white-space: nowrap; border-bottom: 1px solid var(--border); }
    thead th.mid { text-align: center; }
    tbody td { padding: 7px 10px; border-bottom: 1px solid var(--sep); white-space: nowrap;
      font-size: 13px; line-height: 1.3; }
    tbody td.mid { text-align: center; }
    tbody tr:hover { background: var(--surface2); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.attn td:first-child { box-shadow: inset 3px 0 0 var(--red); }
    tbody tr.done td:first-child { box-shadow: inset 3px 0 0 var(--green); }
    .c-name { font-weight: 600; max-width: 160px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }
    .c-deal { max-width: 210px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom;
      color: var(--secondary); font-size: 12px; }
    .c-owner { color: var(--text); max-width: 130px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }
    .c-val { font-weight: 700; font-feature-settings: "tnum"; }
    .c-sent { color: var(--tertiary); font-size: 11.5px; font-feature-settings: "tnum"; }
    .muted { color: var(--tertiary); }

    /* Progress dots — six steps at a glance */
    .dots { display: inline-flex; gap: 4px; align-items: center; }
    .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; background: var(--sep);
      border: 1px solid transparent; }
    .dot.done { background: var(--green); }
    .dot.miss { background: var(--red); }
    .dot.today { background: var(--surface); border-color: var(--text); box-shadow: inset 0 0 0 2px var(--surface); }
    .dot.plan { background: transparent; border-color: var(--border); }
    .dot.none { background: transparent; border: 1px dashed rgba(15,23,42,.18); }

    /* Plain-language status */
    .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
    .chip.ok { background: rgba(16,185,129,.15); color: var(--green-dk); }
    .chip.late { background: rgba(239,68,68,.13); color: var(--red-dk); }
    .chip.today { background: rgba(15,23,42,.07); color: var(--text); }
    .chip.track { background: transparent; color: var(--secondary); border: 1px solid var(--border); }
    .next { font-size: 12px; color: var(--secondary); }
    .next.hot { color: var(--red-dk); font-weight: 600; }
    .next.today { color: var(--text); font-weight: 700; }

    .state { padding: 42px; text-align: center; color: var(--secondary); }
    .legend { margin-top: 11px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--secondary); align-items: center; }
    .legend .dot { vertical-align: -1px; margin-right: 3px; }
    .note { margin-top: 7px; font-size: 12px; color: var(--tertiary); }
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    @media (max-width: 700px) { body { padding: 11px; } .c-deal { max-width: 130px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/v3">← Back to Sales Call Monitor</a>
    <div class="top">
      <div>
        <h1>Quote Follow-Ups</h1>
        <div class="sub">Every quote's follow-up sequence — live from the CRM.</div>
      </div>
      <div class="controls">
        <input type="date" id="date-start">
        <span class="dash">–</span>
        <input type="date" id="date-end">
        <button class="btn" onclick="setRange(30)">30d</button>
        <button class="btn" onclick="setRange(90)">90d</button>
        <button class="btn primary" id="reload" onclick="load()">↻</button>
      </div>
    </div>

    <div class="headline" id="headline"></div>

    <div class="board">
      <div class="board-head" onclick="toggleBoard()">
        <h2>Who's keeping up <span id="board-caret">▾</span></h2>
        <span class="hint">click a rep to see just their quotes</span>
      </div>
      <div class="board-body" id="board-body"></div>
    </div>

    <div class="filters">
      <button class="btn" id="attn-btn" onclick="toggleAttn()">⚠ Needs action</button>
      <input type="search" id="q" placeholder="Search contact, deal, rep…" oninput="render()">
      <select id="owner" onchange="render()"><option value="">All reps</option></select>
      <select id="sort" onchange="render()">
        <option value="attn">Sort: most urgent</option>
        <option value="next">Sort: next due</option>
        <option value="sent">Sort: newest quote</option>
        <option value="amount">Sort: quote value</option>
        <option value="done">Sort: least complete</option>
        <option value="owner">Sort: rep</option>
      </select>
      <span class="spacer"></span>
      <span class="count" id="count"></span>
      <button class="btn" onclick="exportCsv()">Export CSV</button>
    </div>

    <div class="panel">
      <div class="table-scroll">
        <table id="tbl">
          <thead><tr>
            <th>Customer</th>
            <th>Rep</th>
            <th>Quote</th>
            <th class="mid">Follow-ups <span style="text-transform:none;font-weight:500">(1→6)</span></th>
            <th>Status</th>
            <th>Next step</th>
          </tr></thead>
          <tbody id="tbody"><tr><td class="state" colspan="6"><span class="spin"></span> Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="legend">
      <span><span class="dot done"></span>done</span>
      <span><span class="dot miss"></span>overdue</span>
      <span><span class="dot today"></span>due today</span>
      <span><span class="dot plan"></span>upcoming</span>
      <span><span class="dot none"></span>not scheduled</span>
      <span class="muted">· hover any dot for its date</span>
    </div>
    <div class="note" id="note"></div>
  </div>

<script>
  const ZOHO_ORG = "goalsplasticsurgery";
  const crmUrl = (m, id) => id ? `https://crm.zoho.com/crm/${ZOHO_ORG}/tab/${m}/${id}` : null;
  let _records = [], _cadence = {}, _attnOnly = false, _boardOpen = true, _lastUpdated = null;
  const STEPS = ["1","2","3","4","5","6"];
  const CAD_SHORT = {"24 Hours":"24h","72 Hours":"72h","1 Week":"1 wk","10 Days":"10 d","2 Weeks":"2 wk","1 Month":"1 mo"};

  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const todayISO = () => iso(new Date());
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const shortDate = s => { if (!s) return ""; const p = String(s).slice(0,10).split("-"); return p.length===3 ? `${+p[1]}/${+p[2]}` : s; };
  const money = n => (n || n === 0) ? "$" + Number(n).toLocaleString("en-US", {maximumFractionDigits: 0}) : "";
  const kMoney = n => { n = Number(n)||0; return n >= 1000 ? "$" + (n/1000).toFixed(n >= 10000 ? 0 : 1) + "k" : "$" + n; };
  const shortCad = s => CAD_SHORT[s] || s || "";
  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

  function setRange(days) {
    const end = new Date(), start = new Date(); start.setDate(start.getDate() - days);
    document.getElementById("date-start").value = iso(start);
    document.getElementById("date-end").value = iso(end);
    load();
  }
  function stepState(step, today) {
    if (!step) return "none";
    if (/complet/i.test(step.status || "")) return "done";
    const due = (step.due_date || "").slice(0,10);
    if (!due) return "plan";
    if (due < today) return "miss";
    if (due === today) return "today";
    return "plan";
  }
  function rollup(r, today) {
    let done = 0, total = 0, late = 0, dueToday = 0, next = null;
    STEPS.forEach(n => {
      const st = r.steps && r.steps[n];
      if (!st) return;
      total++;
      const s = stepState(st, today);
      if (s === "done") { done++; return; }
      if (s === "miss") late++;
      if (s === "today") dueToday++;
      const due = (st.due_date || "").slice(0,10);
      if (!next || (due && due < next.due)) next = { n, due, state: s };
    });
    return { done, total, late, dueToday, next, pct: total ? Math.round(done/total*100) : 0,
             complete: total > 0 && done === total };
  }
  const agentOf = r => (r.owner || "—").trim() || "—";

  function toggleBoard() {
    _boardOpen = !_boardOpen;
    document.getElementById("board-body").classList.toggle("hide", !_boardOpen);
    document.getElementById("board-caret").textContent = _boardOpen ? "▾" : "▸";
  }
  function toggleAttn() {
    _attnOnly = !_attnOnly;
    document.getElementById("attn-btn").classList.toggle("on", _attnOnly);
    render();
  }
  function pickAgent(name) {
    const sel = document.getElementById("owner");
    sel.value = (sel.value === name) ? "" : name;
    render();
  }

  function visibleRecords() {
    const today = todayISO();
    const q = (document.getElementById("q").value || "").trim().toLowerCase();
    const owner = document.getElementById("owner").value;
    let rows = _records.map(r => ({ r, roll: rollup(r, today) }));
    if (owner) rows = rows.filter(x => agentOf(x.r) === owner);
    if (q) rows = rows.filter(x => `${x.r.contact_name} ${x.r.deal_name} ${x.r.owner}`.toLowerCase().includes(q));
    if (_attnOnly) rows = rows.filter(x => x.roll.late > 0 || x.roll.dueToday > 0);
    const byNext = (a,b) => ((a.roll.next?.due) || "9999").localeCompare((b.roll.next?.due) || "9999");
    const cmp = {
      attn: (a,b) => (b.roll.late - a.roll.late) || (b.roll.dueToday - a.roll.dueToday) || byNext(a,b),
      next: byNext,
      sent: (a,b) => String(b.r.quote_sent_date||"").localeCompare(String(a.r.quote_sent_date||"")),
      amount: (a,b) => (Number(b.r.amount)||0) - (Number(a.r.amount)||0),
      done: (a,b) => a.roll.pct - b.roll.pct,
      owner: (a,b) => agentOf(a.r).localeCompare(agentOf(b.r)) || byNext(a,b),
    }[document.getElementById("sort").value] || (() => 0);
    return rows.sort(cmp);
  }

  function renderHeadline() {
    const today = todayISO();
    let late = 0, dueToday = 0, atRisk = 0, done = 0, total = 0, repsBehind = new Set();
    _records.forEach(r => {
      const ro = rollup(r, today);
      late += ro.late; dueToday += ro.dueToday; done += ro.done; total += ro.total;
      if (ro.late > 0) { atRisk += Number(r.amount) || 0; repsBehind.add(agentOf(r)); }
    });
    const pct = total ? Math.round(done/total*100) : 0;
    const el = document.getElementById("headline");
    if (!_records.length) { el.innerHTML = `<span class="calm">No quotes with follow-ups in this range.</span>`; return; }
    const bits = [];
    if (late) bits.push(`<b class="hot">${late} overdue</b> across ${repsBehind.size} rep${repsBehind.size===1?"":"s"}`);
    else bits.push(`<b class="good">Nothing overdue</b>`);
    bits.push(`<b>${dueToday}</b> due today`);
    if (atRisk) bits.push(`<b class="hot">${kMoney(atRisk)}</b> in quotes at risk`);
    el.innerHTML = bits.join(`<span class="sep">·</span>`) +
      `<div class="calm" style="margin-top:4px">${_records.length} quote${_records.length===1?"":"s"} tracked · ${done} of ${total} follow-ups completed (${pct}%)</div>`;
  }

  function renderBoard() {
    const today = todayISO();
    const by = {};
    _records.forEach(r => {
      const a = agentOf(r), ro = rollup(r, today);
      const o = by[a] || (by[a] = { quotes: 0, done: 0, total: 0, late: 0, today: 0 });
      o.quotes++; o.done += ro.done; o.total += ro.total; o.late += ro.late; o.today += ro.dueToday;
    });
    const sel = document.getElementById("owner").value;
    const list = Object.entries(by).map(([name, o]) => ({
      name, ...o, pct: o.total ? Math.round(o.done/o.total*100) : 0,
    })).sort((a,b) => (b.late - a.late) || (a.pct - b.pct) || a.name.localeCompare(b.name));

    document.getElementById("board-body").innerHTML = list.map(a => {
      const verdict = a.late ? `${a.late} late` : (a.today ? `${a.today} today` : (a.pct === 100 ? "all done" : "on track"));
      const vcls = a.late ? "hot" : (a.pct === 100 ? "ok" : "mid");
      return `<div class="agent${sel===a.name?" sel":""}" onclick="pickAgent('${esc(a.name).replace(/'/g,"\\'")}')" ` +
        `title="${esc(a.name)}: ${a.done} of ${a.total} follow-ups done${a.late?` · ${a.late} overdue`:""}${a.today?` · ${a.today} due today`:""}">` +
        `<div class="nm">${esc(a.name)}</div>` +
        `<div class="meta">${a.quotes} quote${a.quotes===1?"":"s"}</div>` +
        `<div class="bar"><i class="${a.late?"hot":""}" style="width:${a.pct}%"></i></div>` +
        `<div class="verdict ${vcls}">${verdict}</div></div>`;
    }).join("") || `<div class="agent"><div class="nm muted">No reps in range</div></div>`;

    const osel = document.getElementById("owner"), cur = osel.value;
    osel.innerHTML = `<option value="">All reps</option>` +
      list.map(a => `<option value="${esc(a.name)}"${a.name===cur?" selected":""}>${esc(a.name)}${a.late?` — ${a.late} late`:""}</option>`).join("");
  }

  function renderBody() {
    const tb = document.getElementById("tbody");
    const rows = visibleRecords();
    document.getElementById("count").textContent = `${rows.length} of ${_records.length} quotes`;
    if (!rows.length) {
      tb.innerHTML = `<tr><td class="state" colspan="6">${_records.length ? "Nothing matches these filters." : "No quote follow-ups in this range."}</td></tr>`;
      return;
    }
    const today = todayISO();
    tb.innerHTML = rows.map(({ r, roll }) => {
      const cUrl = crmUrl("Contacts", r.contact_id), dUrl = crmUrl("Potentials", r.deal_id);
      const name = cUrl
        ? `<a href="${cUrl}" target="_blank" rel="noopener" class="c-name" title="Open contact in CRM">${esc(r.contact_name)}</a>`
        : `<span class="c-name">${esc(r.contact_name)}</span>`;
      const deal = dUrl
        ? `<a href="${dUrl}" target="_blank" rel="noopener" class="c-deal" title="${esc(r.deal_name)}">${esc(r.deal_name)}</a>`
        : `<span class="c-deal">${esc(r.deal_name)}</span>`;
      const sentAgo = r.quote_sent_date ? daysBetween(r.quote_sent_date, new Date()) : null;
      const sentTxt = sentAgo === null ? "" : (sentAgo <= 0 ? "sent today" : `sent ${sentAgo}d ago`);
      const qVal = money(r.amount) || "—";
      const quote = r.estimate_url
        ? `<a href="${esc(r.estimate_url)}" target="_blank" rel="noopener" class="c-val" title="Open quote">${qVal}</a>`
        : `<span class="c-val">${qVal}</span>`;

      const dots = STEPS.map(n => {
        const st = r.steps && r.steps[n];
        const s = stepState(st, today);
        const word = { done:"Done", plan:"Upcoming", today:"Due today", miss:"Overdue", none:"Not scheduled" }[s];
        const tip = `Follow-up ${n} (${shortCad(_cadence[n])}) — ${word}${st && st.due_date ? ` · due ${shortDate(st.due_date)}` : ""}`;
        return `<span class="dot ${s}" title="${esc(tip)}"></span>`;
      }).join("");

      let chip, rowCls = "";
      if (roll.complete) { chip = `<span class="chip ok">Complete</span>`; rowCls = " done"; }
      else if (roll.late) { chip = `<span class="chip late">${roll.late} overdue</span>`; rowCls = " attn"; }
      else if (roll.dueToday) { chip = `<span class="chip today">Due today</span>`; }
      else { chip = `<span class="chip track">On track</span>`; }

      let nextTxt = `<span class="muted">—</span>`;
      if (roll.next) {
        const d = roll.next.due ? daysBetween(todayISO(), roll.next.due) : null;
        const cad = shortCad(_cadence[roll.next.n]);
        if (roll.next.state === "miss") nextTxt = `<span class="next hot">${esc(cad)} · ${Math.abs(d)}d late</span>`;
        else if (roll.next.state === "today") nextTxt = `<span class="next today">${esc(cad)} · today</span>`;
        else nextTxt = `<span class="next">${esc(cad)} · in ${d}d</span>`;
      } else if (roll.total) {
        nextTxt = `<span class="next" style="color:var(--green-dk)">nothing left</span>`;
      }

      return `<tr class="${rowCls.trim()}">` +
        `<td>${name}<br>${deal}</td>` +
        `<td><span class="c-owner">${esc(r.owner || "—")}</span></td>` +
        `<td>${quote}${sentTxt ? `<br><span class="c-sent">${sentTxt}</span>` : ""}</td>` +
        `<td class="mid"><span class="dots">${dots}</span><br><span class="c-sent">${roll.done}/${roll.total}</span></td>` +
        `<td>${chip}</td>` +
        `<td>${nextTxt}</td></tr>`;
    }).join("");
  }

  function render() { renderHeadline(); renderBoard(); renderBody(); }

  function exportCsv() {
    const today = todayISO();
    const head = ["Customer","Deal","Rep","Quote Value","Quote Sent"]
      .concat(STEPS.map(n => shortCad(_cadence[n]) || ("FU"+n)))
      .concat(["Completed","Total","Overdue","Status","Next Due"]);
    const lines = [head.join(",")];
    visibleRecords().forEach(({ r, roll }) => {
      const cells = STEPS.map(n => ({ done:"Done", plan:"Upcoming", today:"Due today", miss:"Overdue", none:"" })[stepState(r.steps && r.steps[n], today)]);
      const status = roll.complete ? "Complete" : (roll.late ? `${roll.late} overdue` : (roll.dueToday ? "Due today" : "On track"));
      const row = [r.contact_name, r.deal_name, r.owner || "", r.amount ?? "", (r.quote_sent_date||"").slice(0,10)]
        .concat(cells).concat([roll.done, roll.total, roll.late, status, roll.next ? roll.next.due : ""]);
      lines.push(row.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(","));
    });
    const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `quote-followups-${todayISO()}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
  }

  async function load() {
    const s = document.getElementById("date-start").value;
    const e = document.getElementById("date-end").value;
    const btn = document.getElementById("reload");
    btn.disabled = true; btn.textContent = "…";
    document.getElementById("tbody").innerHTML = `<tr><td class="state" colspan="6"><span class="spin"></span> Loading…</td></tr>`;
    try {
      const tz = new Date().getTimezoneOffset();
      const r = await fetch(`/api/quote-followups?tz=${tz}&start=${s}&end=${e}&_=${Date.now()}`, { headers: { Accept: "application/json" } });
      if (r.status === 401) { location.href = "/login"; return; }
      const j = await r.json();
      if (j.status !== "ok") throw new Error(j.message || "load failed");
      _records = (j.data && j.data.records) || [];
      _cadence = (j.data && j.data.cadence) || {};
      _lastUpdated = j.last_updated;
      render();
      document.getElementById("note").textContent =
        `Updated ${new Date(_lastUpdated).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})} · refreshes every 2 min · reps tick tasks off in the CRM`;
    } catch (err) {
      document.getElementById("tbody").innerHTML = `<tr><td class="state" colspan="6">Error: ${esc(err.message)}</td></tr>`;
    } finally {
      btn.disabled = false; btn.textContent = "↻";
    }
  }

  setRange(30);
  setInterval(load, 120000);
</script>
</body>
